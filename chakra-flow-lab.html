<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chakra Flow Lab">
  <title>Chakra Flow Lab</title>
  <style>
    :root {
      --bg: #07070b;
      --panel: rgba(22, 22, 30, 0.92);
      --line: rgba(255,255,255,0.08);
      --text: #f4f4f8;
      --muted: #9a9aaa;
      --accent: #c4b5fd;
      --radius: 18px;
      --glow: #6A1B9A;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(1200px 420px at 50% -10%, color-mix(in srgb, var(--glow) 28%, transparent), transparent 70%),
        var(--bg);
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 14px; }
    header h1 { margin: 0; font-size: 1.55rem; letter-spacing: -0.03em; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
    .yt {
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--line);
    }
    .yt.hide { display: none; }
    #player { width: 100%; height: 100%; }
    .hero, .panel, .quote {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin: 10px 0;
      backdrop-filter: blur(16px);
    }
    .hero { text-align: center; }
    .kicker { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
    #nowName { font-size: 1.45rem; font-weight: 700; margin: 4px 0 2px; }
    #nowMeta { color: var(--muted); font-size: .9rem; }
    .progress {
      height: 6px;
      background: #2a2a34;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 12px;
    }
    #bar {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #fff, var(--glow));
      transition: width .45s ease;
    }
    .rail { display: grid; gap: 8px; }
    .card {
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 12px 14px;
      min-height: 64px;
      color: #fff;
      text-align: left;
      cursor: pointer;
    }
    .card.on {
      border-color: rgba(255,255,255,.85);
      box-shadow: 0 0 0 3px color-mix(in srgb, #fff 18%, transparent);
      filter: brightness(1.12);
    }
    .card b { display: block; font-size: 1.02rem; }
    .card small { display: block; opacity: .88; }
    .card em {
      display: block;
      font-size: .82rem;
      margin-top: 4px;
      opacity: .95;
      font-style: italic;
    }
    .quote { text-align: center; min-height: 88px; }
    #affLabel { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    #affText { margin-top: 6px; font-size: 1.02rem; line-height: 1.4; }
    .tabs, .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tabs button, .btn, .chip {
      border: 0;
      border-radius: 12px;
      min-height: 46px;
      padding: 10px 8px;
      color: #fff;
      background: #2a2a34;
      font-weight: 650;
      font-size: 14px;
    }
    .tabs button.on { background: #efe9ff; color: #1a1028; }
    .btn.start { background: #3b6cff; }
    .btn.pause { background: #6d4c41; }
    .btn.stop { background: #b42318; }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }
    .row label { width: 118px; color: var(--muted); font-size: 14px; flex-shrink: 0; }
    .row input, .row select {
      flex: 1;
      min-width: 0;
      min-height: 42px;
      background: #1c1c24;
      color: #fff;
      border: 1px solid #3a3a46;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 16px;
    }
    .row input[type=range] { padding: 0; min-height: 32px; }
    .val { width: 44px; color: var(--muted); font-size: 13px; text-align: right; }
    .ts { display: none; }
    .ts.show { display: block; }
    .status {
      text-align: center;
      color: var(--muted);
      min-height: 22px;
      font-size: 13px;
      margin-top: 8px;
    }
    .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
    details summary {
      cursor: pointer;
      font-weight: 700;
      padding: 2px 0 8px;
    }
    @media (max-width: 390px) {
      .actions { grid-template-columns: 1fr 1fr; }
      .actions .start { grid-column: 1 / -1; }
      .row label { width: 96px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Chakra Flow Lab</h1>
      <p>Compare-ready journey lab · tones · YouTube · voice</p>
    </header>
    <div class="yt" id="ytBox"><div id="player"></div></div>
    <section class="hero">
      <div class="kicker">CURRENT CHAKRA</div>
      <div id="nowName">Ready</div>
      <div id="nowMeta">Choose a source and start</div>
      <div class="progress"><i id="bar"></i></div>
    </section>
    <div class="rail" id="rail"></div>
    <section class="quote">
      <div id="affLabel">AFFIRMATION</div>
      <div id="affText">Your affirmation will appear here.</div>
    </section>
    <section class="panel">
      <b>Journey Source</b>
      <p class="hint">Switch audio without leaving the lab.</p>
      <div class="tabs" id="sourceTabs">
        <button data-source="tones">Tones</button>
        <button data-source="youtube">YouTube</button>
        <button data-source="both" class="on">YouTube + Tones</button>
      </div>
      <div class="row"><label>YouTube</label><input id="url" value="https://youtu.be/YlOUww60Q5M"></div>
      <div class="row"><label>YT volume</label><input id="ytVol" type="range" min="0" max="100" value="65"><span class="val" id="ytVolVal">65%</span></div>
      <div class="row"><label>During voice</label><input id="duckVol" type="range" min="0" max="50" value="12"><span class="val" id="duckVolVal">12%</span></div>
    </section>
    <section class="panel">
      <b>Journey Control</b>
      <div class="row">
        <label>Progression</label>
        <select id="mode">
          <option value="affirmation">Affirmation Driven</option>
          <option value="timed">Timed Duration</option>
          <option value="timestamps">Video Timestamp Sync</option>
        </select>
      </div>
      <div class="row" id="durRow"><label>Per chakra</label><input id="duration" type="number" min="10" max="600" value="60"><span class="val">sec</span></div>
      <div class="row">
        <label>Affirmations</label>
        <select id="affCount">
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
        </select>
      </div>
      <div class="row"><label>Voice gap</label><input id="voiceGap" type="number" min="0" max="30" step=".5" value="2"><span class="val">sec</span></div>
      <div class="row"><label>Between</label><input id="chakraGap" type="number" min="0" max="60" step=".5" value="3"><span class="val">sec</span></div>
      <div id="tsBox" class="ts"></div>
    </section>
    <section class="panel">
      <details open>
        <summary>Voice & Tone</summary>
        <div class="row">
          <label>Voice</label>
          <select id="voice">
            <option value="EXAVITQu4vr4xnSDxMaL">Sarah</option>
            <option value="cgSgspJ2msm6clMCkdW9">Jessica</option>
            <option value="pFZP5JQG7iQjIQuC4Bku">Lily</option>
            <option value="nPczCjzI2devNBz1zQrb">Brian</option>
            <option value="JBFqnCBsd6RMkjVDRZzb">George</option>
          </select>
        </div>
        <div class="row"><label>ElevenLabs</label><input id="apiKey" type="password" placeholder="API key (optional)" autocomplete="off"></div>
        <div class="row"><label>Voice speed</label><input id="voiceSpeed" type="number" min=".6" max="1.2" step=".05" value=".85"></div>
        <div class="row"><label>Voice vol</label><input id="voiceVol" type="range" min="0" max="1" step=".01" value=".8"><span class="val" id="voiceVolVal">80%</span></div>
        <div class="row">
          <label>Tone style</label>
          <select id="toneStyle">
            <option value="pure">Pure</option>
            <option value="crystal" selected>Crystal Bowl</option>
            <option value="tibetan">Tibetan</option>
            <option value="warm">Warm Bowl</option>
          </select>
        </div>
        <div class="row"><label>Tone vol</label><input id="toneVol" type="range" min="0" max="1" step=".01" value=".18"><span class="val" id="toneVolVal">18%</span></div>
      </details>
    </section>
    <div class="actions">
      <button class="btn start" id="startBtn">Start Journey</button>
      <button class="btn pause" id="pauseBtn">Pause</button>
      <button class="btn stop" id="stopBtn">Stop</button>
    </div>
    <div class="status" id="status"></div>
  </div>
<script>
const CHAKRAS = [
  {name:"Root",sanskrit:"Muladhara",hz:396,note:"C",color:"#8B0000",affirmations:["I am safe, grounded, and secure in my body.","I trust the process of life and feel deeply rooted.","My foundation is strong; I belong here.","I release fear and stand firmly in the present moment.","Abundance flows to me as I remain stable and centered."]},
  {name:"Sacral",sanskrit:"Svadhisthana",hz:417,note:"D",color:"#E65100",affirmations:["I embrace pleasure and creativity with ease.","My emotions flow freely and healthily.","I honor my desires and allow joy into my life.","I am open to change and the beauty of transformation.","Creativity moves through me effortlessly."]},
  {name:"Solar Plexus",sanskrit:"Manipura",hz:528,note:"E",color:"#F9A825",affirmations:["I am confident, powerful, and in control of my life.","I trust my inner wisdom and take decisive action.","My personal power shines brightly.","I release self-doubt and step into my strength.","I am worthy of success and respect."]},
  {name:"Heart",sanskrit:"Anahata",hz:639,note:"F",color:"#2E7D32",affirmations:["I give and receive love freely and unconditionally.","My heart is open, compassionate, and full of gratitude.","I forgive myself and others with ease.","Love is my true nature and guides every action.","I am deeply connected to all living beings."]},
  {name:"Throat",sanskrit:"Vishuddha",hz:741,note:"G",color:"#0277BD",affirmations:["I speak my truth with clarity and confidence.","My voice is powerful and my words create positive change.","I express myself authentically and listen deeply.","Communication flows easily between me and others.","I am heard, understood, and respected."]},
  {name:"Third Eye",sanskrit:"Ajna",hz:852,note:"A",color:"#283593",affirmations:["I trust my intuition and inner vision.","Clarity and insight guide my path.","I see beyond illusion and perceive the truth.","My mind is clear, focused, and open to wisdom.","I am connected to my higher guidance."]},
  {name:"Crown",sanskrit:"Sahasrara",hz:963,note:"B",color:"#6A1B9A",affirmations:["I am one with the divine and infinite consciousness.","Divine wisdom flows through me effortlessly.","I am connected to pure awareness and universal love.","My spirit is free, expansive, and luminous.","I surrender to the highest good and trust the universe."]}
];
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const LS="cfl_";
const PARTIALS={pure:[[1,.8]],crystal:[[1,.48],[2,.23],[3,.12],[4,.06]],tibetan:[[1,.4],[2.02,.25],[2.98,.14],[4.18,.08]],warm:[[.5,.16],[1,.45],[1.5,.14],[2,.1]]};
let source="both",audioCtx=null,toneBus=null,toneOsc=[],ytPlayer=null,ytReady=false,running=false,paused=false,token=0,currentIndex=-1,stampWatch=null,voiceSource=null,voiceAbort=null,utterance=null,lastPick=CHAKRAS.map(()=>-1),ducking=false;
function setStatus(msg=""){$("status").textContent=msg}
function useYouTube(){return source!=="tones"}
function useTones(){return source!=="youtube"}
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();if(!toneBus){toneBus=audioCtx.createGain();toneBus.gain.value=.0001;toneBus.connect(audioCtx.destination)}return audioCtx}
function youtubeId(value){try{const u=new URL(value),parts=u.pathname.split("/").filter(Boolean);if(u.hostname.includes("youtu.be"))return parts[0];return u.searchParams.get("v")||parts[parts.findIndex(x=>["embed","shorts","live"].includes(x))+1]}catch{return /^[\w-]{11}$/.test(value)?value:""}}
function parseStamp(value){const parts=String(value||"").trim().split(":").map(Number);if(!parts.length||parts.some(n=>!Number.isFinite(n)))return NaN;if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];if(parts.length===2)return parts[0]*60+parts[1];return parts[0]}
function collectStamps(){const stamps=CHAKRAS.map((_,i)=>parseStamp(document.querySelector(`[data-ts="${i}"]`).value));stamps[0]=Number.isFinite(stamps[0])?stamps[0]:0;for(let i=1;i<7;i++){if(!Number.isFinite(stamps[i])||stamps[i]<=stamps[i-1])return null}return stamps}
function pickAffirmation(chakraIndex){const list=CHAKRAS[chakraIndex].affirmations;if(list.length===1)return{text:list[0],n:1};let next;do{next=Math.floor(Math.random()*list.length)}while(next===lastPick[chakraIndex]);lastPick[chakraIndex]=next;return{text:list[next],n:next+1}}
function renderRail(){const rail=$("rail");rail.innerHTML="";CHAKRAS.forEach((c,i)=>{const card=document.createElement("button");card.type="button";card.className="card";card.dataset.i=i;card.style.background=c.color;card.innerHTML=`<b>${c.name} · ${c.hz} Hz</b><small>${c.sanskrit} (${c.note})</small><em></em>`;card.onclick=()=>preview(i);rail.appendChild(card);const row=document.createElement("div");row.className="row";row.innerHTML=`<label>${c.name}</label><input data-ts="${i}" placeholder="mm:ss" value="${i?"":"0:00"}">`;$("tsBox").appendChild(row)})}
function setCurrent(i,extra=""){currentIndex=i;document.querySelectorAll(".card").forEach((el,n)=>el.classList.toggle("on",n===i));if(i<0){$("nowName").textContent="Ready";$("nowMeta").textContent=extra||"Choose a source and start";$("bar").style.width="0";document.documentElement.style.setProperty("--glow","#6A1B9A");return}const c=CHAKRAS[i];$("nowName").textContent=c.name;$("nowMeta").textContent=`${c.sanskrit} · ${c.hz} Hz · ${c.note}${extra?" · "+extra:""}`;$("bar").style.width=`${((i+1)/7)*100}%`;document.documentElement.style.setProperty("--glow",c.color)}
function showAffirmation(i,text,spoken,total){const c=CHAKRAS[i];$("affLabel").textContent=`${c.name} · AFFIRMATION ${spoken} OF ${total}`;$("affText").textContent=text;const card=document.querySelector(`.card[data-i="${i}"] em`);if(card)card.textContent=text}
function fadeTone(value,seconds=.35){if(!toneBus||!audioCtx)return;const now=audioCtx.currentTime;toneBus.gain.cancelScheduledValues(now);toneBus.gain.setTargetAtTime(Math.max(.0001,value),now,seconds/3)}
function stopOscillators(fade=.4){if(!audioCtx||!toneOsc.length)return;const now=audioCtx.currentTime;toneOsc.forEach(osc=>{try{osc.stop(now+fade)}catch{}});toneOsc=[]}
function startTone(chakra){if(!useTones()){fadeTone(.0001,.25);return}ensureAudio();fadeTone(.0001,.18);stopOscillators(.28);const style=$("toneStyle").value;const parts=PARTIALS[style]||PARTIALS.crystal;const now=audioCtx.currentTime;parts.forEach(([mult,gain])=>{const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type="sine";osc.frequency.value=chakra.hz*mult;g.gain.value=gain;osc.connect(g);g.connect(toneBus);osc.start(now+.02);toneOsc.push(osc)});fadeTone(paused?.0001:Number($("toneVol").value),.8)}
function desiredYtVolume(){return ducking?Number($("duckVol").value):Number($("ytVol").value)}
function setYtVolume(vol){if(!ytReady||!ytPlayer)return;try{ytPlayer.setVolume(clamp(vol,0,100))}catch{}}
function duck(on){ducking=on;const toneTarget=Number($("toneVol").value)*(on?.18:1);fadeTone(useTones()&&!paused?Math.max(.0001,toneTarget):.0001,.45);if(useYouTube())setYtVolume(desiredYtVolume())}
function stopVoice(){if(voiceAbort){voiceAbort.abort();voiceAbort=null}if(voiceSource){try{voiceSource.stop()}catch{}voiceSource=null}if(utterance){utterance.onend=utterance.onerror=null;utterance=null}try{speechSynthesis.cancel()}catch{}duck(false)}
async function speakDevice(text){return new Promise(resolve=>{const u=new SpeechSynthesisUtterance(text);utterance=u;u.rate=Number($("voiceSpeed").value);u.volume=Number($("voiceVol").value);duck(true);u.onend=()=>{utterance=null;duck(false);resolve(true)};u.onerror=()=>{utterance=null;duck(false);resolve(false)};speechSynthesis.speak(u)})}
async function speak(text,label){stopVoice();const key=$("apiKey").value.trim();if(!key){setStatus(label+" · device voice");return speakDevice(text)}voiceAbort=new AbortController();setStatus(label+" · ElevenLabs");try{const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${$("voice").value}`,{method:"POST",signal:voiceAbort.signal,headers:{"Content-Type":"application/json","xi-api-key":key,Accept:"audio/mpeg"},body:JSON.stringify({text,model_id:"eleven_multilingual_v2",voice_settings:{stability:.58,similarity_boost:.75},speed:Number($("voiceSpeed").value)})});if(!res.ok)throw new Error("elevenlabs");const ctx=ensureAudio();const buffer=await ctx.decodeAudioData(await(await res.blob()).arrayBuffer());const src=ctx.createBufferSource();const gain=ctx.createGain();src.buffer=buffer;gain.gain.value=Number($("voiceVol").value);src.connect(gain);gain.connect(ctx.destination);voiceSource=src;duck(true);return await new Promise(resolve=>{src.onended=()=>{voiceSource=null;duck(false);resolve(true)};src.start()})}catch(err){if(voiceAbort?.signal.aborted)return false;setStatus(label+" · fallback voice");return speakDevice(text)}}
async function pauseAwareWait(ms,runToken){let left=ms,last=performance.now();while(left>0&&running&&runToken===token){await wait(80);const now=performance.now();if(!paused)left-=now-last;last=now}return running&&runToken===token}
async function speakChakra(index,runToken){const count=clamp(Number($("affCount").value),1,5),gap=clamp(Number($("voiceGap").value),0,30);for(let i=0;i<count;i++){while(paused&&runToken===token)await wait(100);if(!running||runToken!==token)return false;const pick=pickAffirmation(index);showAffirmation(index,pick.text,i+1,count);const ok=await speak(pick.text,`${CHAKRAS[index].name} ${i+1}/${count}`);if(!ok)return false;if(i<count-1&&!(await pauseAwareWait(gap*1000,runToken)))return false}return true}
async function runSequence(runToken,timed){for(let i=0;i<7;i++){if(!running||runToken!==token)return;const started=performance.now();setCurrent(i,timed?"Timed":"Affirmation Driven");startTone(CHAKRAS[i]);if(!(await speakChakra(i,runToken)))return;if(timed){const remain=clamp(Number($("duration").value),10,600)*1000-(performance.now()-started);if(remain>0&&!(await pauseAwareWait(remain,runToken)))return}else if(i<6){if(!(await pauseAwareWait(clamp(Number($("chakraGap").value),0,60)*1000,runToken)))return}}finish(runToken)}
async function activateStamp(i,runToken){if(i===currentIndex||!running||runToken!==token)return;setCurrent(i,"Timestamp Sync");startTone(CHAKRAS[i]);await speakChakra(i,runToken)}
function runTimestamps(runToken){const stamps=collectStamps();if(!stamps){setStatus("Enter increasing timestamps for all 7 chakras");running=false;$("startBtn").textContent="Start Journey";return}stampWatch=setInterval(()=>{if(!running||runToken!==token){clearInterval(stampWatch);return}if(paused||!ytReady)return;let seconds=0;try{seconds=ytPlayer.getCurrentTime()}catch{return}let i=0;for(let n=0;n<7;n++)if(seconds>=stamps[n])i=n;if(i!==currentIndex)activateStamp(i,runToken)},400);activateStamp(0,runToken)}
function finish(runToken){if(runToken!==token)return;running=false;paused=false;fadeTone(.0001,.4);stopOscillators(.5);$("startBtn").textContent="Start Journey";$("pauseBtn").textContent="Pause";setStatus("Journey complete")}
function startYouTube(){if(!useYouTube())return true;if(!ytReady){setStatus("YouTube is still loading");return false}const id=youtubeId($("url").value);if(!id){setStatus("Invalid YouTube URL");return false}try{ytPlayer.loadVideoById(id);setYtVolume(Number($("ytVol").value));return true}catch{return false}}
function startJourney(){ensureAudio();if(running&&paused)return togglePause();if(running)return;token+=1;const runToken=token;running=true;paused=false;ducking=false;currentIndex=-1;$("startBtn").textContent="Running…";$("pauseBtn").textContent="Pause";setStatus("Journey started");if(!startYouTube()){running=false;$("startBtn").textContent="Start Journey";return}const mode=$("mode").value;if(mode==="timestamps"){if(!useYouTube()){setStatus("Timestamp Sync requires YouTube");running=false;$("startBtn").textContent="Start Journey";return}runTimestamps(runToken)}else runSequence(runToken,mode==="timed")}
function togglePause(){if(!running)return;paused=!paused;if(useYouTube()&&ytReady){try{paused?ytPlayer.pauseVideo():ytPlayer.playVideo()}catch{}}if(paused){stopVoice();fadeTone(.0001,.25);setStatus("Journey paused");$("pauseBtn").textContent="Resume"}else{if(useTones()&&currentIndex>=0)fadeTone(Number($("toneVol").value),.5);setStatus("Journey resumed");$("pauseBtn").textContent="Pause"}}
function stopJourney(){token+=1;running=false;paused=false;ducking=false;if(stampWatch)clearInterval(stampWatch);stopVoice();fadeTone(.0001,.25);stopOscillators(.45);if(ytReady){try{ytPlayer.pauseVideo();ytPlayer.seekTo(0,true)}catch{}}setCurrent(-1,"Journey stopped");$("startBtn").textContent="Start Journey";$("pauseBtn").textContent="Pause";$("affLabel").textContent="AFFIRMATION";$("affText").textContent="Your affirmation will appear here.";setStatus("Stopped")}
async function preview(i){if(running)return;ensureAudio();setCurrent(i,"Preview");startTone(CHAKRAS[i]);const pick=pickAffirmation(i);showAffirmation(i,pick.text,1,1);await speak(pick.text,CHAKRAS[i].name)}
const persistIds=["url","ytVol","duckVol","mode","duration","affCount","voiceGap","chakraGap","voice","apiKey","voiceSpeed","voiceVol","toneStyle","toneVol"];
function save(){persistIds.forEach(id=>localStorage.setItem(LS+id,$(id).value));localStorage.setItem(LS+"source",source);CHAKRAS.forEach((_,i)=>{const el=document.querySelector(`[data-ts="${i}"]`);if(el)localStorage.setItem(LS+"ts"+i,el.value)})}
function load(){persistIds.forEach(id=>{const v=localStorage.getItem(LS+id);if(v!==null&&$(id))$(id).value=v});source=localStorage.getItem(LS+"source")||"both";CHAKRAS.forEach((_,i)=>{const v=localStorage.getItem(LS+"ts"+i);const el=document.querySelector(`[data-ts="${i}"]`);if(v!==null&&el)el.value=v});refreshUI()}
function refreshUI(){document.querySelectorAll("#sourceTabs button").forEach(btn=>btn.classList.toggle("on",btn.dataset.source===source));$("ytBox").classList.toggle("hide",!useYouTube());$("ytVolVal").textContent=$("ytVol").value+"%";$("duckVolVal").textContent=$("duckVol").value+"%";$("voiceVolVal").textContent=Math.round(Number($("voiceVol").value)*100)+"%";$("toneVolVal").textContent=Math.round(Number($("toneVol").value)*100)+"%";const mode=$("mode").value;$("tsBox").classList.toggle("show",mode==="timestamps");$("durRow").style.display=mode==="timed"?"flex":"none"}
document.querySelectorAll("#sourceTabs button").forEach(btn=>{btn.onclick=()=>{source=btn.dataset.source;save();refreshUI()}});
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("change",()=>{save();refreshUI()}));
["ytVol","duckVol","voiceVol","toneVol"].forEach(id=>{$(id).addEventListener("input",()=>{refreshUI();save();if(id==="ytVol"&&!ducking)setYtVolume(Number($("ytVol").value));if(id==="toneVol"&&useTones()&&running&&!paused)fadeTone(Number($("toneVol").value),.12)})});
$("startBtn").onclick=startJourney;$("pauseBtn").onclick=togglePause;$("stopBtn").onclick=stopJourney;
window.onYouTubeIframeAPIReady=()=>{ytPlayer=new YT.Player("player",{videoId:youtubeId($("url").value)||"YlOUww60Q5M",playerVars:{playsinline:1,rel:0,modestbranding:1},events:{onReady:e=>{ytReady=true;e.target.setVolume(Number($("ytVol").value));setStatus("YouTube ready")},onError:e=>setStatus("YouTube error "+e.data)}})};
renderRail();load();
const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
</script>
</body>
</html>
