// BASIC HELPERS
// ============================================================
function wait(

) {
  return new Promise(
    resolve => {
      setTimeout(
        resolve,
        ms
      );
    }
  );
}
function setStatus(

// ============================================================
// AUDIO
// ============================================================
function ensureAudio() {
  if (
    !audioCtx
  ) {
    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }
  if (
    audioCtx.state ===
    "suspended"
  ) {
    audioCtx
      .resume()
      .catch(
        () => {}
      );
  }
  return audioCtx;
}
// ============================================================
// SAFE GAIN CHANGE
// ============================================================
function smoothGain(
  gainParam,
  target,
  seconds
) {
  if (
    !audioCtx
  ) {
    return;
  }
  const now =
    audioCtx.currentTime;
  try {
    if (
      typeof gainParam.cancelAndHoldAtTime ===
      "function"
    ) {
      gainParam
        .cancelAndHoldAtTime(
          now
        );
    }
    else {
      const value =
        gainParam.value;
      gainParam
        .cancelScheduledValues(
          now
        );
      gainParam
        .setValueAtTime(
          value,
          now
        );
    }
    gainParam
      .linearRampToValueAtTime(
        target,
        now + seconds
      );
  }
  catch (
    error
  ) {
    console.warn(
      error
    );
  }
}
// ============================================================
// API UI
// ============================================================

  detail
) {

    apiIndicator

// ============================================================
// CHECK ELEVENLABS
// ============================================================
async function checkElevenLabsAPI(
  showStatus = true
) {
  setApiStatus(
    "checking",
    "Checking selected voice…"
  );
  if (
    showStatus
  ) {
    setStatus(
      "Checking ElevenLabs…"
    );
  }
  try {
    const response =
      await fetch(
        `https://api.elevenlabs.io/v1/voices/${encodeURIComponent(VOICE_ID)}`,
        {
          headers: {
            "xi-api-key":
              ELEVENLABS_API_KEY
          }
        }
      );
    if (
      !response.ok
    ) {
      throw new Error(
        `API error ${response.status}`
      );
    }
    const voice =
      await response.json();
    verifiedVoiceName =
      voice.name ||
      "ElevenLabs Voice";
    elevenLabsOK =
      true;
    apiTitle.textContent =
      "ElevenLabs connected";
    setApiStatus(
      "good",
      `${verifiedVoiceName} • ${ELEVENLABS_MODEL}`
    );
    if (
      showStatus
    ) {
      setStatus(
        `✓ Voice verified: ${verifiedVoiceName}`
      );
      setTimeout(
        () => {
          if (
            !isSpeaking &&
            !isPlayingAll
          ) {
            setStatus("");
          }
        },
        2500
      );
    }
    return true;
  }
  catch (
    error
  ) {
    elevenLabsOK =
      false;
    setApiStatus(
      "bad",
      error.message
    );
    apiTitle.textContent =
      "ElevenLabs unavailable";
    if (
      showStatus
    ) {
      setStatus(
        `⚠ ${error.message}`
      );
    }
    console.error(
      error
    );
    return false;
  }
}

      document.createElement(
        "div"
      );
    card.className =
      "card";
    card.dataset.name =
      chakra.name;
    card.style.background =
      chakra.color;
    card.innerHTML = `
      <div class="card-name">
        ${chakra.name}
        •
        ${chakra.freq} Hz
      </div>
      <div class="card-meta">
        ${chakra.sanskrit}
        (${chakra.note})
      </div>
      <div
        class="card-affirmation"
        data-affirm
      ></div>
    `;
    card.addEventListener(
      "click",
      () => {
        playSingleChakra(
          chakra
        );
      }
    );
    grid.appendChild(
      card
    );
  }
);
// ============================================================
// CARD HIGHLIGHT
// ============================================================
function highlightCard(
  chakra
) {
  activeName =
    chakra.name;
  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {
        const data =
          CHAKRAS.find(
            item =>
              item.name ===
              card.dataset.name
          );
        if (
          card.dataset.name ===
          chakra.name
        ) {
          card
            .classList
            .add(
              "playing"
            );
          card.style.background =
            chakra.active;
        }
        else {
          card
            .classList
            .remove(
              "playing"
            );
          if (
            data
          ) {
            card.style.background =
              data.color;
          }
        }
      }
    );
}
// ============================================================
// CLEAR CARD
// ============================================================
function clearHighlight() {
  activeName =
    null;
  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {
        card
          .classList
          .remove(
            "playing"
          );
        const chakra =
          CHAKRAS.find(
            item =>
              item.name ===
              card.dataset.name
          );
        if (
          chakra
        ) {
          card.style.background =
            chakra.color;
        }
      }
    );
}
// ============================================================
// TONE
// ============================================================
function playTone(
  chakra
) {
  highlightCard(
    chakra
  );
  if (
    !toneEnabled
  ) {
    return;
  }
  ensureAudio();
  stopTone(
    false
  );
  const now =
    audioCtx.currentTime;
  const mixGain =
    audioCtx.createGain();
  const volumeGain =
    audioCtx.createGain();
  const duckGain =
    audioCtx.createGain();
  const compressor =
    audioCtx.createDynamicsCompressor();
  volumeGain.gain
    .setValueAtTime(
      0.0001,
      now
    );
  duckGain.gain
    .setValueAtTime(
      1,
      now
    );
  compressor.threshold.value =
    -24;
  compressor.knee.value =
    24;
  compressor.ratio.value =
    2.5;
  compressor.attack.value =
    0.025;
  compressor.release.value =
    0.8;
  mixGain.connect(
    volumeGain
  );
  volumeGain.connect(
    duckGain
  );
  duckGain.connect(
    compressor
  );
  compressor.connect(
    audioCtx.destination
  );
  const layers = [
    {
      freq:
        chakra.freq,
      gain:
        0.50,
      detune:
        0
    },
    {
      freq:
        chakra.freq / 2,
      gain:
        0.19,
      detune:
        0
    },
    {
      freq:
        chakra.freq * 2,
      gain:
        0.04,
      detune:
        0
    },
    {
      freq:
        chakra.freq,
      gain:
        0.11,
      detune:
        3
    },
    {
      freq:
        chakra.freq,
      gain:
        0.11,
      detune:
        -3
    }
  ];
  const oscillators =
    [];
  layers.forEach(
    layer => {
      const osc =
        audioCtx.createOscillator();
      const gain =
        audioCtx.createGain();
      osc.type =
        "sine";
      osc.frequency
        .setValueAtTime(
          layer.freq,
          now
        );
      osc.detune
        .setValueAtTime(
          layer.detune,
          now
        );
      gain.gain
        .setValueAtTime(
          layer.gain,
          now
        );
      osc.connect(
        gain
      );
      gain.connect(
        mixGain
      );
      osc.start(
        now
      );
      oscillators.push(
        {
          osc,
          gain
        }
      );
    }
  );
  volumeGain.gain
    .exponentialRampToValueAtTime(
      Math.max(
        0.0001,
        toneVolume
      ),
      now + 0.7
    );
  currentTone = {
    mixGain,
    volumeGain,
    duckGain,
    compressor,
    oscillators
  };
}
// ============================================================
// STOP TONE
// ============================================================
function stopTone(
  clearVisual = true
) {
  if (
    currentTone &&
    audioCtx
  ) {
    const tone =
      currentTone;
    currentTone =
      null;
    smoothGain(
      tone.volumeGain.gain,
      0.0001,
      0.18
    );
    setTimeout(
      () => {
        tone.oscillators
          .forEach(
            item => {
              try {
                item.osc.stop();
              }
              catch (_) {}
              try {
                item.osc.disconnect();
              }
              catch (_) {}
              try {
                item.gain.disconnect();
              }
              catch (_) {}
            }
          );
        try {
          tone.mixGain.disconnect();
        }
        catch (_) {}
        try {
          tone.volumeGain.disconnect();
        }
        catch (_) {}
        try {
          tone.duckGain.disconnect();
        }
        catch (_) {}
        try {
          tone.compressor.disconnect();
        }
        catch (_) {}
      },
      250
    );
  }
  if (
    clearVisual
  ) {
    clearHighlight();
  }
}
// ============================================================
// DUCK TONE FOR SPEECH
// ============================================================
function duckTone() {
  if (
    currentTone &&
    toneEnabled
  ) {
    smoothGain(
      currentTone.duckGain.gain,
      0.20,
      0.14
    );
  }
}
// ============================================================
// RESTORE TONE
// ============================================================
function restoreTone() {
  if (
    currentTone &&
    toneEnabled
  ) {
    smoothGain(
      currentTone.duckGain.gain,
      1,
      0.40
    );
  }
}
// ============================================================
// STOP SPEECH
// ============================================================
function stopSpeech() {
  speechToken++;
  if (
    currentFetchController
  ) {
    try {
      currentFetchController.abort();
    }
    catch (_) {}
    currentFetchController =
      null;
  }
  if (
    currentVoiceGain
  ) {
    smoothGain(
      currentVoiceGain.gain,
      0.0001,
      0.035
    );
  }
  if (
    currentVoiceSource
  ) {
    const source =
      currentVoiceSource;
    currentVoiceSource =
      null;
    setTimeout(
      () => {
        try {
          source.stop();
        }
        catch (_) {}
      },
      45
    );
  }
  currentVoiceGain =
    null;
  isSpeaking =
    false;
}
// ============================================================
// PLAY DECODED VOICE
// ============================================================
async function playDecodedVoice(
  audioBuffer,
  mySpeechToken
) {
  ensureAudio();
  if (
    mySpeechToken !==
    speechToken
  ) {
    return false;
  }
  duckTone();
  // Give the tone time to duck before
  // the spoken voice starts.
  await wait(
    150
  );
  if (
    mySpeechToken !==
    speechToken
  ) {
    return false;
  }
  const source =
    audioCtx.createBufferSource();
  const gain =
    audioCtx.createGain();
  source.buffer =
    audioBuffer;
  source.connect(
    gain
  );
  gain.connect(
    audioCtx.destination
  );
  currentVoiceSource =
    source;
  currentVoiceGain =
    gain;
  isSpeaking =
    true;
  const now =
    audioCtx.currentTime;
  const fadeIn =
    0.055;
  const fadeOut =
    0.080;
  gain.gain
    .setValueAtTime(
      0.0001,
      now
    );
  gain.gain
    .linearRampToValueAtTime(
      Math.max(
        0.0001,
        voiceVolume
      ),
      now + fadeIn
    );
  const fadeStart =
    Math.max(
      now + fadeIn,
      now +
      audioBuffer.duration -
      fadeOut
    );
  gain.gain
    .setValueAtTime(
      Math.max(
        0.0001,
        voiceVolume
      ),
      fadeStart
    );
  gain.gain
    .linearRampToValueAtTime(
      0.0001,
      now +
      audioBuffer.duration
    );
  return await new Promise(
    resolve => {
      let finished =
        false;
      const finish =
        success => {
          if (
            finished
          ) {
            return;
          }
          finished =
            true;
          if (
            currentVoiceSource ===
            source
          ) {
            currentVoiceSource =
              null;
          }
          if (
            currentVoiceGain ===
            gain
          ) {
            currentVoiceGain =
              null;
          }
          try {
            source.disconnect();
          }
          catch (_) {}
          try {
            gain.disconnect();
          }
          catch (_) {}
          isSpeaking =
            false;
          if (
            mySpeechToken ===
            speechToken
          ) {
            restoreTone();
          }
          resolve(
            success &&
            mySpeechToken ===
            speechToken
          );
        };
      source.onended =
        () => {
          finish(
            true
          );
        };
      try {
        source.start(
          now
        );
      }
      catch (
        error
      ) {
        console.error(
          error
        );
        finish(
          false
        );
      }
    }
  );
}
// ============================================================
// ELEVENLABS SPEECH
// ============================================================
async function speakElevenLabs(
  text
) {
  ensureAudio();
  // Create a unique speech operation.
  const mySpeechToken =
    ++speechToken;
  if (
    !elevenLabsOK
  ) {
    const ok =
      await checkElevenLabsAPI(
        false
      );
    if (
      !ok ||
      mySpeechToken !==
      speechToken
    ) {
      return false;
    }
  }
  const controller =
    new AbortController();
  currentFetchController =
    controller;
  try {
    setStatus(
      `Generating ${verifiedVoiceName || "ElevenLabs"}…`
    );
    const response =
      await fetch(
        `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(VOICE_ID)}?output_format=mp3_44100_128`,
        {
          method:
            "POST",
          signal:
            controller.signal,
          headers: {
            "Accept":
              "audio/mpeg",
            "Content-Type":
              "application/json",
            "xi-api-key":
              ELEVENLABS_API_KEY
          },
          body:
            JSON.stringify({
              text:
                text,
              model_id:
                ELEVENLABS_MODEL,
              voice_settings: {
                stability:
                  0.42,
                similarity_boost:
                  0.82,
                style:
                  0.18,
                use_speaker_boost:
                  true,
                speed:
                  0.90
              }
            })
        }
      );
    if (
      mySpeechToken !==
      speechToken
    ) {
      return false;
    }
    if (
      !response.ok
    ) {
      const errorText =
        await response.text();
      console.error(
        "ElevenLabs:",
        response.status,
        errorText
      );
      elevenLabsOK =
        false;
      throw new Error(
        `TTS error ${response.status}`
      );
    }
    const bytes =
      await response.arrayBuffer();
    if (
      mySpeechToken !==
      speechToken
    ) {
      return false;
    }
    setStatus(
      "Preparing voice…"
    );
    const audioBuffer =
      await audioCtx.decodeAudioData(
        bytes.slice(
          0
        )
      );
    if (
      mySpeechToken !==
      speechToken
    ) {
      return false;
    }
    currentFetchController =
      null;
    setStatus(
      `ELEVENLABS ✓ • ${verifiedVoiceName}`
    );
    const completed =
      await playDecodedVoice(
        audioBuffer,
        mySpeechToken
      );
    return completed;
  }
  catch (
    error
  ) {
    currentFetchController =
      null;
    if (
      error.name ===
      "AbortError"
    ) {
      return false;
    }
    console.error(
      error
    );
    setStatus(
      `Voice error: ${error.message}`
    );
    return false;
  }
}
// ============================================================
// AFFIRMATIONS
// ============================================================
function nextAffirmation(
  chakra
) {
  const index =
    affirmationIndex[
      chakra.name
    ];
  const text =
    chakra.affirmations[
      index
    ];
  affirmationIndex[
    chakra.name
  ] =
    (
      index + 1
    ) %
    chakra.affirmations.length;
  return {
    text:
      text,
    number:
      index + 1
  };
}
// ============================================================
// SHOW AFFIRMATION
// ============================================================
function showAffirmation(
  chakra,
  text,
  number
) {
  affirmPanel
    .classList
    .remove(
      "empty"
    );
  affirmPanel.style.background =
    chakra.color +
    "33";
  affirmLabel.style.display =
    "block";
  affirmLabel.textContent =
    `Affirmation ${number} of ${chakra.affirmations.length}`;
  affirmText.textContent =
    text;
  const card =
    document.querySelector(
      `.card[data-name="${chakra.name}"]`
    );
  if (
    card
  ) {
    const line =
      card.querySelector(
        "[data-affirm]"
      );
    if (
      line
    ) {
      line.textContent =
        text;
    }
  }
}
// ============================================================
// SINGLE CHAKRA
// ============================================================
async function playSingleChakra(
  chakra
) {
  ensureAudio();
  // Cancel Play All if user taps a card.
  if (
    isPlayingAll
  ) {
    stopEverything(
      false
    );
  }
  stopSpeech();
  const affirmation =
    nextAffirmation(
      chakra
    );
  showAffirmation(
    chakra,
    affirmation.text,
    affirmation.number
  );
  playTone(
    chakra
  );
  // Let tone establish itself first.
  await wait(
    250
  );
  await speakElevenLabs(
    affirmation.text
  );
}
// ============================================================
// PLAY ALL
// ============================================================
async function playAllSequence() {
  ensureAudio();
  const myJourney =
    ++journeyToken;
  isPlayingAll =
    true;
  playAllButton.textContent =
    "Stop Journey";
  // Reset to Root every time Play All starts.
  for (
    let index = 0;
    index < CHAKRAS.length;
    index++
  ) {
    if (
      !isPlayingAll ||
      myJourney !==
      journeyToken
    ) {
      return;
    }
    const chakra =
      CHAKRAS[
        index
      ];
    const affirmation =
      nextAffirmation(
        chakra
      );
    showAffirmation(
      chakra,
      affirmation.text,
      affirmation.number
    );
    playTone(
      chakra
    );
    setStatus(
      `Chakra ${index + 1} of ${CHAKRAS.length} • ${chakra.name}`
    );
    // Allow the new tone to fade in.
    await wait(
      300
    );
    if (
      !isPlayingAll ||
      myJourney !==
      journeyToken
    ) {
      return;
    }
    // ========================================================
    // THIS IS THE IMPORTANT FIX
    //
    // We explicitly WAIT for the complete mantra.
    // ========================================================
    const mantraFinished =
      await speakElevenLabs(
        affirmation.text
      );
    if (
      !isPlayingAll ||
      myJourney !==
      journeyToken
    ) {
      return;
    }
    if (
      !mantraFinished
    ) {
      console.warn(
        "Mantra did not finish normally"
      );
    }
    setStatus(
      `${chakra.name} • meditation pause`
    );
    // Let tone return before pause.
    await wait(
      1600
    );
    if (
      !isPlayingAll ||
      myJourney !==
      journeyToken
    ) {
      return;
    }
  }
  if (
    myJourney ===
    journeyToken
  ) {
    isPlayingAll =
      false;
    playAllButton.textContent =
      "Play All";
    stopSpeech();
    stopTone(
      true
    );
    setStatus(
      "Journey complete"
    );
    setTimeout(
      () => {
        if (
          !isPlayingAll
        ) {
          setStatus("");
        }
      },
      3000
    );
  }
}
// ============================================================
// STOP EVERYTHING
// ============================================================
function stopEverything(
  clearAffirmation = true
) {
  isPlayingAll =
    false;
  journeyToken++;
  playAllButton.textContent =
    "Play All";
  stopSpeech();
  stopTone(
    true
  );
  if (
    clearAffirmation
  ) {
    affirmPanel
      .classList
      .add(
        "empty"
      );
    affirmPanel.style.background =
      "#1a1a22";
    affirmLabel.style.display =
      "none";
    affirmText.textContent =
      "Select a chakra to begin";
    document
      .querySelectorAll(
        "[data-affirm]"
      )
      .forEach(
        item => {
          item.textContent =
            "";
        }
      );
  }
  setStatus("");
}
// ============================================================
// PLAY ALL BUTTON
// ============================================================
playAllButton
  .addEventListener(
    "click",
    async () => {
      ensureAudio();
      if (
        isPlayingAll
      ) {
        stopEverything(
          true
        );
        return;
      }
      stopSpeech();
      const apiOK =
        await checkElevenLabsAPI(
          true
        );
      if (
        !apiOK
      ) {
        setStatus(
          "ElevenLabs unavailable — cannot start journey"
        );
        return;
      }
      await playAllSequence();
    }
  );
// ============================================================
// STOP BUTTON
// ============================================================
stopButton
  .addEventListener(
    "click",
    () => {
      stopEverything(
        true
      );
    }
  );
// ============================================================
// API BUTTON
// ============================================================
checkApiButton
  .addEventListener(
    "click",
    () => {
      checkElevenLabsAPI(
        true
      );
    }
  );
// ============================================================
// VOICE SELECT
// ============================================================
voiceSelect
  .addEventListener(
    "change",
    async event => {
      stopEverything(
        false
      );
      VOICE_ID =
        event.target.value;
      elevenLabsOK =
        false;
      verifiedVoiceName =
        "";
      await checkElevenLabsAPI(
        true
      );
    }
  );
// ============================================================
// VOICE VOLUME
// ============================================================
voiceVolumeSlider
  .addEventListener(
    "input",
    event => {
      voiceVolume =
        Number(
          event.target.value
        );
      voiceVolumeValue.textContent =
        `${Math.round(
          voiceVolume *
          100
        )}%`;
      if (
        currentVoiceGain
      ) {
        smoothGain(
          currentVoiceGain.gain,
          Math.max(
            0.0001,
            voiceVolume
          ),
          0.07
        );
      }
    }
  );
// ============================================================
// TONE VOLUME
// ============================================================
toneVolumeSlider
  .addEventListener(
    "input",
    event => {
      toneVolume =
        Number(
          event.target.value
        );
      toneVolumeValue.textContent =
        `${Math.round(
          toneVolume *
          100
        )}%`;
      if (
        currentTone
      ) {
        smoothGain(
          currentTone.volumeGain.gain,
          Math.max(
            0.0001,
            toneVolume
          ),
          0.08
        );
      }
    }
  );
// ============================================================
// TONE TOGGLE
// ============================================================
toneToggle
  .addEventListener(
    "change",
    event => {
      toneEnabled =
        event.target.checked;
      if (
        !toneEnabled
      ) {
        stopTone(
          false
        );
      }
      else if (
        activeName
      ) {
        const chakra =
          CHAKRAS.find(
            item =>
              item.name ===
              activeName
          );
        if (
          chakra
        ) {
          playTone(
            chakra
          );
        }
      }
    }
  );
// ============================================================
// IOS AUDIO UNLOCK
// ============================================================
document.body
  .addEventListener(
    "touchstart",
    ensureAudio,
    {
      once:
        true,
      passive:
        true
    }
  );
document.body
  .addEventListener(
    "click",
    ensureAudio,
    {
      once:
        true
    }
  );
// ============================================================
// RETURNING TO APP
// ============================================================
document
  .addEventListener(
    "visibilitychange",
    () => {
      if (
        document.visibilityState ===
        "visible"
      ) {
        ensureAudio();
      }
    }
  );
// ============================================================
// INITIAL API CHECK
// ============================================================
window
  .addEventListener(
    "load",
    () => {
      setTimeout(
        () => {
          checkElevenLabsAPI(
            false
          );
        },
        350
      );
    }
  );
