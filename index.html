<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chakra Tones">
  <meta name="theme-color" content="#0f0f12">
  <title>Chakra Tone Player</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card-radius: 16px;
      --text: #ffffff;
      --muted: #a0a0b0;
      --panel: #1a1a20;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      background: var(--bg);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    .header {
      text-align: center;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .header p {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      gap: 10px;
      max-width: 480px;
      margin: 0 auto 14px;
    }
    .card {
      border-radius: var(--card-radius);
      padding: 13px 15px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.3s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid transparent;
    }
    .card:active {
      transform: scale(0.98);
    }
    .card.playing {
      border-color: rgba(255,255,255,0.78);
      filter: brightness(1.20) saturate(1.06);
      box-shadow:
        0 0 14px rgba(255,255,255,0.15),
        0 0 30px rgba(255,255,255,0.08);
      animation: breatheCard 5s ease-in-out infinite;
    }
    @keyframes breatheCard {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.012); }
    }
    .card-name {
      font-size: 1.08rem;
      font-weight: 650;
      margin-bottom: 2px;
    }
    .card-meta {
      font-size: 0.78rem;
      opacity: 0.85;
      margin-bottom: 3px;
    }
    .card-affirmation {
      font-size: 0.86rem;
      font-style: italic;
      opacity: 0.95;
      line-height: 1.35;
      min-height: 1.2em;
    }
    .affirmation-panel {
      max-width: 480px;
      margin: 0 auto 14px;
      background: #1a1a22;
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      min-height: 78px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background 0.3s ease;
    }
    .affirmation-panel.empty {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .affirmation-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .affirmation-text {
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.4;
    }
    .controls {
      max-width: 480px;
      margin: 0 auto;
      background: var(--panel);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }
    .control-row:last-of-type {
      margin-bottom: 8px;
    }
    .control-label {
      font-size: 0.88rem;
      color: var(--muted);
      min-width: 76px;
    }
    .volume-value {
      min-width: 40px;
      text-align: right;
      color: #c6c6d0;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    select {
      flex: 1;
      background: #2a2a32;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      min-width: 0;
    }
    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      flex: 0 0 auto;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #333;
      border-radius: 26px;
      transition: 0.2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider {
      background: #4caf50;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .switch-description {
      color: var(--muted);
      font-size: 0.88rem;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }
    .btn {
      padding: 12px 10px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-playall {
      background: #1565c0;
    }
    .btn-stop {
      background: #b71c1c;
    }
    .btn:active {
      opacity: 0.85;
      transform: scale(0.985);
    }
    .status {
      text-align: center;
      font-size: 0.84rem;
      color: #aaa;
      margin-top: 10px;
      min-height: 1.3em;
    }
    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.76rem;
      color: #555;
    }
    @media (prefers-reduced-motion: reduce) {
      .card.playing {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <div class="controls">

      <select id="voiceSelect">

        <option value="cgSgspJ2msm6clMCkdW9">Jessica – Bright & Warm</option>
        <option value="pFZP5JQG7iQjIQuC4Bku">Lily – Soft & Velvety</option>

    <div class="btn-row">

  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="footer">

  </div>
  <script>
    "use strict";
    // ============================================================

    // ============================================================
    const ELEVENLABS_API_KEY =
      "sk_e9322bc962e4375aa8656bae5caf6a5ddf3fb744e54167aa";
    let VOICE_ID = "EXAVITQu4vr4xnSDxMaL";
    // ============================================================
    // CHAKRAS
    // ============================================================
    const CHAKRAS = [
      {

      },
      {

        ]
      },
      {
        name: "Third Eye",
        sanskrit: "Ajna",
        freq: 852,

        active: "#5C6BC0",
        note: "A",
        affirmations: [
          "I trust my intuition and inner vision.",
          "Clarity and insight guide my path.",

        ]
      }
    ];
    // ============================================================
    // STATE
    // ============================================================
    let audioCtx = null;
    let toneEnabled = true;
    let toneVolume = 0.28;
    let voiceVolume = 0.80;
    let currentTone = null;
    let activeName = null;
    let currentVoiceSource = null;
    let currentVoiceGain = null;
    let currentVoiceResolve = null;
    let speechController = null;
    let currentUtterance = null;
    let isSpeaking = false;
    let isPlayingAll = false;
    let journeyToken = 0;
    const affirmationIndex = {};
    CHAKRAS.forEach(ch => {
      affirmationIndex[ch.name] = 0;
    });
    // ============================================================
    // DOM
    // ============================================================
    const grid =
      document.getElementById("chakraGrid");
    const voiceVolumeSlider =
      document.getElementById("voiceVolume");
    const toneVolumeSlider =
      document.getElementById("toneVolume");
    const voiceVolumeValue =
      document.getElementById("voiceVolumeValue");
    const toneVolumeValue =
      document.getElementById("toneVolumeValue");
    const toneToggle =
      document.getElementById("toneToggle");
    const voiceSelect =
      document.getElementById("voiceSelect");
    const stopBtn =
      document.getElementById("stopAll");
    const playAllBtn =
      document.getElementById("playAll");
    const affirmPanel =
      document.getElementById("affirmationPanel");
    const affirmLabel =
      document.getElementById("affirmLabel");
    const affirmText =
      document.getElementById("affirmText");
    const statusEl =
      document.getElementById("status");
    // ============================================================
    // BUILD CARDS
    // ============================================================
    CHAKRAS.forEach(ch => {
      const card =
        document.createElement("div");
      card.className =
        "card";
      card.style.background =
        ch.color;
      card.dataset.name =
        ch.name;
      card.setAttribute(
        "role",
        "button"
      );
      card.setAttribute(
        "tabindex",
        "0"
      );
      card.setAttribute(
        "aria-label",
        `${ch.name} chakra, ${ch.freq} hertz`
      );
      card.innerHTML = `
        <div class="card-name">
          ${ch.name} • ${ch.freq} Hz
        </div>
        <div class="card-meta">
          ${ch.sanskrit} (${ch.note})
        </div>
        <div
          class="card-affirmation"
          data-affirm
        ></div>
      `;
      card.addEventListener(
        "click",
        () => handleCardTap(ch)
      );
      card.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Enter" ||
            event.key === " "
          ) {
            event.preventDefault();
            handleCardTap(ch);
          }
        }
      );
      grid.appendChild(card);
    });
    // ============================================================
    // BASIC HELPERS
    // ============================================================
    function setStatus(message) {
      statusEl.textContent =
        message || "";
    }
    function wait(ms) {
      return new Promise(
        resolve => setTimeout(
          resolve,
          ms
        )
      );
    }
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )({
            latencyHint: "interactive"
          });
      }
      if (
        audioCtx.state ===
        "suspended"
      ) {
        audioCtx.resume()
          .catch(() => {});
      }
      return audioCtx;
    }
    function setParamSmooth(
      param,
      target,
      timeConstant = 0.08
    ) {
      if (
        !audioCtx ||
        !param
      ) {
        return;
      }
      const now =
        audioCtx.currentTime;
      try {
        if (
          typeof param.cancelAndHoldAtTime ===
          "function"
        ) {
          param.cancelAndHoldAtTime(
            now
          );
        } else {
          const current =
            param.value;
          param.cancelScheduledValues(
            now
          );
          param.setValueAtTime(
            current,
            now
          );
        }
      } catch (_) {
        try {
          param.cancelScheduledValues(
            now
          );
          param.setValueAtTime(
            param.value,
            now
          );
        } catch (_) {}
      }
      param.setTargetAtTime(
        Math.max(
          0.0001,
          target
        ),
        now,
        timeConstant
      );
    }
    // ============================================================
    // CARD VISUALS
    // ============================================================
    function highlightCard(ch) {
      activeName =
        ch.name;
      document
        .querySelectorAll(".card")
        .forEach(card => {
          const original =
            CHAKRAS.find(
              item =>
                item.name ===
                card.dataset.name
            );
          if (
            card.dataset.name ===
            ch.name
          ) {
            card.classList.add(
              "playing"
            );
            card.style.background =
              ch.active;
          } else {
            card.classList.remove(
              "playing"
            );
            if (original) {
              card.style.background =
                original.color;
            }
          }
        });
    }
    function clearCardHighlight() {
      activeName =
        null;
      document
        .querySelectorAll(".card")
        .forEach(card => {
          card.classList.remove(
            "playing"
          );
          const original =
            CHAKRAS.find(
              item =>
                item.name ===
                card.dataset.name
            );
          if (original) {
            card.style.background =
              original.color;
          }
        });
    }
    // ============================================================
    // TONE ENGINE
    // ============================================================
    function createTone(ch) {
      ensureAudio();
      const now =
        audioCtx.currentTime;
      const masterGain =
        audioCtx.createGain();
      const compressor =
        audioCtx.createDynamicsCompressor();
      masterGain.gain.setValueAtTime(
        0.0001,
        now
      );
      compressor.threshold.value =
        -24;
      compressor.knee.value =
        18;
      compressor.ratio.value =
        2.5;
      compressor.attack.value =
        0.03;
      compressor.release.value =
        0.7;
      masterGain.connect(
        compressor
      );
      compressor.connect(
        audioCtx.destination
      );
      const layers = [
        {
          frequency: ch.freq,
          gain: 0.50,
          detune: 0
        },
        {
          frequency: ch.freq / 2,
          gain: 0.22,
          detune: 0
        },
        {
          frequency: ch.freq * 2,
          gain: 0.045,
          detune: 0
        },
        {
          frequency: ch.freq,
          gain: 0.105,
          detune: 3.5
        },
        {
          frequency: ch.freq,
          gain: 0.105,
          detune: -3.5
        }
      ];
      const oscillatorNodes =
        [];
      for (
        const layer of layers
      ) {
        const osc =
          audioCtx.createOscillator();
        const gain =
          audioCtx.createGain();
        osc.type =
          "sine";
        osc.frequency.setValueAtTime(
          layer.frequency,
          now
        );
        osc.detune.setValueAtTime(
          layer.detune,
          now
        );
        gain.gain.setValueAtTime(
          layer.gain,
          now
        );
        osc.connect(
          gain
        );
        gain.connect(
          masterGain
        );
        osc.start(
          now
        );
        oscillatorNodes.push({
          osc,
          gain
        });
      }
      // Slow breathing modulation
      const lfo =
        audioCtx.createOscillator();
      const lfoGain =
        audioCtx.createGain();
      lfo.frequency.setValueAtTime(
        0.085,
        now
      );
      lfoGain.gain.setValueAtTime(
        toneVolume * 0.035,
        now
      );
      lfo.connect(
        lfoGain
      );
      lfoGain.connect(
        masterGain.gain
      );
      lfo.start(
        now
      );
      return {
        ch,
        masterGain,
        compressor,
        oscillatorNodes,
        lfo,
        lfoGain,
        disposed: false
      };
    }
    function disposeTone(
      tone
    ) {
      if (
        !tone ||
        tone.disposed
      ) {
        return;
      }
      tone.disposed =
        true;
      for (
        const item of
        tone.oscillatorNodes
      ) {
        try {
          item.osc.stop();
        } catch (_) {}
        try {
          item.osc.disconnect();
        } catch (_) {}
        try {
          item.gain.disconnect();
        } catch (_) {}
      }
      try {
        tone.lfo.stop();
      } catch (_) {}
      try {
        tone.lfo.disconnect();
      } catch (_) {}
      try {
        tone.lfoGain.disconnect();
      } catch (_) {}
      try {
        tone.masterGain.disconnect();
      } catch (_) {}
      try {
        tone.compressor.disconnect();
      } catch (_) {}
    }
    function fadeOutTone(
      tone,
      seconds = 0.45
    ) {
      if (
        !tone ||
        !audioCtx ||
        tone.disposed
      ) {
        return;
      }
      const now =
        audioCtx.currentTime;
      try {
        if (
          typeof tone.masterGain.gain.cancelAndHoldAtTime ===
          "function"
        ) {
          tone.masterGain.gain.cancelAndHoldAtTime(
            now
          );
        } else {
          const current =
            tone.masterGain.gain.value;
          tone.masterGain.gain.cancelScheduledValues(
            now
          );
          tone.masterGain.gain.setValueAtTime(
            current,
            now
          );
        }
        tone.masterGain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + seconds
        );
      } catch (_) {
        setParamSmooth(
          tone.masterGain.gain,
          0.0001,
          0.08
        );
      }
      window.setTimeout(
        () => disposeTone(tone),
        Math.ceil(
          (seconds + 0.15) * 1000
        )
      );
    }
    function desiredToneLevel() {
      if (!toneEnabled) {
        return 0.0001;
      }
      return isSpeaking
        ? Math.max(
            0.0001,
            toneVolume * 0.23
          )
        : Math.max(
            0.0001,
            toneVolume
          );
    }
    function playTone(ch) {
      highlightCard(ch);
      if (!toneEnabled) {
        return;
      }
      ensureAudio();
      const previousTone =
        currentTone;
      const nextTone =
        createTone(ch);
      currentTone =
        nextTone;
      const now =
        audioCtx.currentTime;
      const target =
        desiredToneLevel();
      try {
        nextTone.masterGain.gain.setValueAtTime(
          0.0001,
          now
        );
        nextTone.masterGain.gain.exponentialRampToValueAtTime(
          target,
          now + 0.75
        );
      } catch (_) {
        setParamSmooth(
          nextTone.masterGain.gain,
          target,
          0.16
        );
      }
      if (
        previousTone &&
        previousTone !== nextTone
      ) {
        fadeOutTone(
          previousTone,
          0.55
        );
      }
    }
    function stopTone(
      clearVisual = true
    ) {
      if (currentTone) {
        const oldTone =
          currentTone;
        currentTone =
          null;
        fadeOutTone(
          oldTone,
          0.40
        );
      }
      if (clearVisual) {
        clearCardHighlight();
      }
    }
    function applyToneVolume() {
      if (
        !currentTone ||
        !toneEnabled
      ) {
        return;
      }
      setParamSmooth(
        currentTone.masterGain.gain,
        desiredToneLevel(),
        isSpeaking
          ? 0.16
          : 0.28
      );
      setParamSmooth(
        currentTone.lfoGain.gain,
        Math.max(
          0.0001,
          toneVolume * 0.035
        ),
        0.20
      );
    }
    function fadeToneForSpeech() {
      isSpeaking =
        true;
      applyToneVolume();
    }
    function restoreToneVolume() {
      isSpeaking =
        false;
      applyToneVolume();
    }
    // ============================================================
    // VOICE ENGINE
    // ============================================================
    function resolveCurrentVoice(
      result
    ) {
      if (
        !currentVoiceResolve
      ) {
        return;
      }
      const resolve =
        currentVoiceResolve;
      currentVoiceResolve =
        null;
      resolve(
        result
      );
    }
    function cleanupVoiceNodes() {
      if (currentVoiceSource) {
        currentVoiceSource.onended =
          null;
        try {
          currentVoiceSource.disconnect();
        } catch (_) {}
        currentVoiceSource =
          null;
      }
      if (currentVoiceGain) {
        try {
          currentVoiceGain.disconnect();
        } catch (_) {}
        currentVoiceGain =
          null;
      }
    }
    function stopVoice(
      restoreTone = true
    ) {
      if (speechController) {
        try {
          speechController.abort();
        } catch (_) {}
        speechController =
          null;
      }
      if (
        currentVoiceSource &&
        audioCtx
      ) {
        const source =
          currentVoiceSource;
        const gain =
          currentVoiceGain;
        const now =
          audioCtx.currentTime;
        if (gain) {
          try {
            if (
              typeof gain.gain.cancelAndHoldAtTime ===
              "function"
            ) {
              gain.gain.cancelAndHoldAtTime(
                now
              );
            } else {
              const current =
                gain.gain.value;
              gain.gain.cancelScheduledValues(
                now
              );
              gain.gain.setValueAtTime(
                current,
                now
              );
            }
            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              now + 0.045
            );
          } catch (_) {}
        }
        source.onended =
          null;
        window.setTimeout(
          () => {
            try {
              source.stop();
            } catch (_) {}
            try {
              source.disconnect();
            } catch (_) {}
            try {
              if (gain) {
                gain.disconnect();
              }
            } catch (_) {}
          },
          55
        );
        currentVoiceSource =
          null;
        currentVoiceGain =
          null;
      }
      if (currentUtterance) {
        currentUtterance.onend =
          null;
        currentUtterance.onerror =
          null;
        currentUtterance =
          null;
      }
      try {
        speechSynthesis.cancel();
      } catch (_) {}
      resolveCurrentVoice(
        false
      );
      isSpeaking =
        false;
      if (restoreTone) {
        restoreToneVolume();
      }
    }
    async function decodeAudioBlob(
      blob
    ) {
      ensureAudio();
      const arrayBuffer =
        await blob.arrayBuffer();
      return await new Promise(
        (resolve, reject) => {
          const copy =
            arrayBuffer.slice(0);
          const result =
            audioCtx.decodeAudioData(
              copy,
              decoded =>
                resolve(decoded),
              error =>
                reject(error)
            );
          if (
            result &&
            typeof result.then ===
            "function"
          ) {
            result
              .then(resolve)
              .catch(reject);
          }
        }
      );
    }
    function playDecodedVoice(
      buffer
    ) {
      return new Promise(
        resolve => {
          ensureAudio();
          const source =
            audioCtx.createBufferSource();
          const gain =
            audioCtx.createGain();
          const now =
            audioCtx.currentTime;
          const fadeIn =
            Math.min(
              0.055,
              Math.max(
                0.015,
                buffer.duration * 0.05
              )
            );
          const fadeOut =
            Math.min(
              0.095,
              Math.max(
                0.035,
                buffer.duration * 0.08
              )
            );
          source.buffer =
            buffer;
          gain.gain.setValueAtTime(
            0.0001,
            now
          );
          try {
            gain.gain.exponentialRampToValueAtTime(
              Math.max(
                0.0001,
                voiceVolume
              ),
              now + fadeIn
            );
            if (
              buffer.duration >
              fadeIn +
              fadeOut +
              0.03
            ) {
              const fadeOutStart =
                now +
                Math.max(
                  fadeIn,
                  buffer.duration -
                  fadeOut
                );
              gain.gain.setValueAtTime(
                Math.max(
                  0.0001,
                  voiceVolume
                ),
                fadeOutStart
              );
              gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now +
                buffer.duration
              );
            }
          } catch (_) {
            gain.gain.value =
              voiceVolume;
          }
          source.connect(
            gain
          );
          gain.connect(
            audioCtx.destination
          );
          currentVoiceSource =
            source;
          currentVoiceGain =
            gain;
          currentVoiceResolve =
            resolve;
          fadeToneForSpeech();
          source.onended =
            () => {
              if (
                currentVoiceSource !==
                source
              ) {
                return;
              }
              cleanupVoiceNodes();
              currentVoiceResolve =
                null;
              restoreToneVolume();
              setStatus("");
              resolve(
                true
              );
            };
          try {
            source.start(
              now
            );
          } catch (error) {
            console.error(
              "Voice start error:",
              error
            );
            cleanupVoiceNodes();
            currentVoiceResolve =
              null;
            restoreToneVolume();
            resolve(
              false
            );
          }
        }
      );
    }
    function speakWithDeviceVoice(
      text
    ) {
      return new Promise(
        resolve => {
          stopVoice(
            false
          );
          const utterance =
            new SpeechSynthesisUtterance(
              text
            );
          currentUtterance =
            utterance;
          currentVoiceResolve =
            resolve;
          utterance.rate =
            0.88;
          utterance.pitch =
            1.0;
          utterance.volume =
            voiceVolume;
          fadeToneForSpeech();
          setStatus(
            "Using device voice..."
          );
          const finish =
            success => {
              if (
                currentUtterance !==
                utterance
              ) {
                return;
              }
              currentUtterance =
                null;
              currentVoiceResolve =
                null;
              restoreToneVolume();
              setStatus("");
              resolve(
                success
              );
            };
          utterance.onend =
            () => finish(true);
          utterance.onerror =
            () => finish(false);
          try {
            speechSynthesis.speak(
              utterance
            );
          } catch (error) {
            console.error(
              "Device speech error:",
              error
            );
            finish(
              false
            );
          }
        }
      );
    }
    async function speakWithElevenLabs(
      text,
      statusPrefix = ""
    ) {
      stopVoice(
        false
      );
      ensureAudio();
      const controller =
        new AbortController();
      speechController =
        controller;
      setStatus(
        statusPrefix
          ? `${statusPrefix} • Generating voice...`
          : "Generating voice..."
      );
      try {
        const response =
          await fetch(
            `https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`,
            {
              method:
                "POST",
              signal:
                controller.signal,
              headers: {
                "Accept":
                  "audio/mpeg",
                "Content-Type":
                  "application/json",
                "xi-api-key":
                  ELEVENLABS_API_KEY
              },
              body:
                JSON.stringify({
                  text,
                  model_id:
                    "eleven_multilingual_v2",
                  voice_settings: {
                    stability:
                      0.50,
                    similarity_boost:
                      0.75
                  }
                })
            }
          );
        if (!response.ok) {
          const body =
            await response.text();
          console.error(
            "ElevenLabs error:",
            response.status,
            body
          );
          throw new Error(
            `ElevenLabs API error ${response.status}`
          );
        }
        const blob =
          await response.blob();
        if (
          controller.signal.aborted
        ) {
          return false;
        }
        const buffer =
          await decodeAudioBlob(
            blob
          );
        if (
          controller.signal.aborted
        ) {
          return false;
        }
        speechController =
          null;
        setStatus(
          statusPrefix
            ? `${statusPrefix} • Speaking...`
            : "Speaking..."
        );
        return await playDecodedVoice(
          buffer
        );
      } catch (error) {
        if (
          error.name ===
            "AbortError" ||
          controller.signal.aborted
        ) {
          setStatus("");
          return false;
        }
        console.error(
          "ElevenLabs failed:",
          error
        );
        speechController =
          null;
        return await speakWithDeviceVoice(
          text
        );
      }
    }
    // ============================================================
    // AFFIRMATIONS
    // ============================================================
    function getNextAffirmation(
      ch
    ) {
      const idx =
        affirmationIndex[
          ch.name
        ] || 0;
      const text =
        ch.affirmations[
          idx
        ];
      const number =
        idx + 1;
      affirmationIndex[
        ch.name
      ] =
        (
          idx + 1
        ) %
        ch.affirmations.length;
      return {
        text,
        number
      };
    }
    function showAffirmation(
      ch,
      text,
      number
    ) {
      affirmLabel.style.display =
        "block";
      affirmLabel.textContent =
        `Affirmation ${number} of ${ch.affirmations.length}`;
      affirmText.textContent =
        text;
      affirmPanel.classList.remove(
        "empty"
      );
      affirmPanel.style.background =
        ch.color + "33";
      const card =
        document.querySelector(
          `.card[data-name="${ch.name}"]`
        );
      if (card) {
        const element =
          card.querySelector(
            "[data-affirm]"
          );
        if (element) {
          element.textContent =
            text;
        }
      }
    }
    function clearAffirmation() {
      affirmLabel.style.display =
        "none";
      affirmText.textContent =
        "Select a chakra to begin";
      affirmPanel.classList.add(
        "empty"
      );
      affirmPanel.style.background =
        "#1a1a22";
      document
        .querySelectorAll(
          "[data-affirm]"
        )
        .forEach(
          element => {
            element.textContent =
              "";
          }
        );
    }
    // ============================================================
    // SINGLE CHAKRA
    // ============================================================
    async function handleCardTap(
      ch
    ) {
      ensureAudio();
      if (isPlayingAll) {
        stopPlayAll(
          false
        );
      }
      stopVoice(
        false
      );
      const {
        text,
        number
      } =
        getNextAffirmation(
          ch
        );
      showAffirmation(
        ch,
        text,
        number
      );
      playTone(
        ch
      );
      await speakWithElevenLabs(
        text
      );
    }
    // ============================================================
    // PLAY ALL
    // ============================================================
    function stopPlayAll(
      clearPanel = true
    ) {
      journeyToken++;
      isPlayingAll =
        false;
      playAllBtn.textContent =
        "Play All";
      stopVoice(
        false
      );
      stopTone(
        true
      );
      if (clearPanel) {
        clearAffirmation();
      }
      setStatus("");
    }
    async function playAllSequence(
      token
    ) {
      for (
        let index = 0;
        index < CHAKRAS.length;
        index++
      ) {
        if (
          !isPlayingAll ||
          token !==
            journeyToken
        ) {
          return;
        }
        const ch =
          CHAKRAS[
            index
          ];
        const {
          text,
          number
        } =
          getNextAffirmation(
            ch
          );
        showAffirmation(
          ch,
          text,
          number
        );
        playTone(
          ch
        );
        const label =
          `Chakra ${index + 1} of ${CHAKRAS.length}`;
        const completed =
          await speakWithElevenLabs(
            text,
            label
          );
        if (
          !isPlayingAll ||
          token !==
            journeyToken
        ) {
          return;
        }
        if (!completed) {
          return;
        }
        setStatus(
          `${label} • Pause`
        );
        await wait(
          1300
        );
        if (
          !isPlayingAll ||
          token !==
            journeyToken
        ) {
          return;
        }
      }
      if (
        !isPlayingAll ||
        token !==
          journeyToken
      ) {
        return;
      }
      isPlayingAll =
        false;
      playAllBtn.textContent =
        "Play All";
      stopVoice(
        false
      );
      stopTone(
        true
      );
      setStatus(
        "Journey complete"
      );
      const completedToken =
        journeyToken;
      window.setTimeout(
        () => {
          if (
            !isPlayingAll &&
            journeyToken ===
              completedToken
          ) {
            setStatus("");
          }
        },
        3000
      );
    }
    // ============================================================
    // PLAY ALL BUTTON
    // ============================================================
    playAllBtn.addEventListener(
      "click",
      () => {
        ensureAudio();
        if (isPlayingAll) {
          stopPlayAll(
            true
          );
          return;
        }
        stopVoice(
          false
        );
        journeyToken++;
        const token =
          journeyToken;
        isPlayingAll =
          true;
        playAllBtn.textContent =
          "Stop Journey";
        playAllSequence(
          token
        );
      }
    );
    // ============================================================
    // STOP BUTTON
    // ============================================================
    stopBtn.addEventListener(
      "click",
      () => {
        stopPlayAll(
          true
        );
      }
    );
    // ============================================================
    // VOICE VOLUME
    // ============================================================
    voiceVolumeSlider.addEventListener(
      "input",
      event => {
        voiceVolume =
          parseFloat(
            event.target.value
          );
        voiceVolumeValue.textContent =
          `${Math.round(
            voiceVolume * 100
          )}%`;
        if (currentVoiceGain) {
          setParamSmooth(
            currentVoiceGain.gain,
            Math.max(
              0.0001,
              voiceVolume
            ),
            0.05
          );
        }
      }
    );
    // ============================================================
    // TONE VOLUME
    // ============================================================
    toneVolumeSlider.addEventListener(
      "input",
      event => {
        toneVolume =
          parseFloat(
            event.target.value
          );
        toneVolumeValue.textContent =
          `${Math.round(
            toneVolume * 100
          )}%`;
        applyToneVolume();
      }
    );
    // ============================================================
    // TONE ON / OFF
    // ============================================================
    toneToggle.addEventListener(
      "change",
      event => {
        toneEnabled =
          event.target.checked;
        if (!toneEnabled) {
          stopTone(
            false
          );
          return;
        }
        if (activeName) {
          const activeChakra =
            CHAKRAS.find(
              ch =>
                ch.name ===
                activeName
            );
          if (activeChakra) {
            playTone(
              activeChakra
            );
          }
        }
      }
    );
    // ============================================================
    // VOICE SELECT
    // ============================================================
    voiceSelect.addEventListener(
      "change",
      event => {
        VOICE_ID =
          event.target.value;
      }
    );
    // ============================================================
    // IOS AUDIO UNLOCK
    // ============================================================
    document.body.addEventListener(
      "touchstart",
      ensureAudio,
      {
        once: true,
        passive: true
      }
    );
    document.body.addEventListener(
      "pointerdown",
      ensureAudio,
      {
        once: true
      }
    );
    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.visibilityState ===
          "visible"
        ) {
          ensureAudio();
        }
      }
    );
  </script>
</body>
</html>
