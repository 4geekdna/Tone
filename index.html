<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenLabs Voice Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    button {
      background: #1565c0;
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 1.1rem;
      border-radius: 12px;
      margin: 10px;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    #status {
      margin-top: 30px;
      font-size: 1rem;
      color: #aaa;
      min-height: 1.5em;
    }
    .success { color: #4caf50; }
    .error { color: #f44336; }
  </style>
</head>
<body>

  <h1>ElevenLabs Voice Test</h1>
  <p>Tap a button below</p>

  <button onclick="testVoice('Hello. This is a test of your ElevenLabs API key.')">
    Test Short Phrase
  </button>

  <button onclick="testVoice('I am safe, grounded, and secure in my body.')">
    Test Affirmation
  </button>

  <div id="status">Ready</div>

  <script>
    const API_KEY = "sk_e9322bc962e4375aa8656bae5caf6a5ddf3fb744e54167aa";
    const VOICE_ID = "EXAVITQu4vr4xnSDxMaL"; // Sarah

    const statusEl = document.getElementById("status");

    async function testVoice(text) {
      statusEl.className = "";
      statusEl.textContent = "Generating voice...";

      try {
        const response = await fetch(
          `https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`,
          {
            method: "POST",
            headers: {
              "Accept": "audio/mpeg",
              "Content-Type": "application/json",
              "xi-api-key": API_KEY
            },
            body: JSON.stringify({
              text: text,
              model_id: "eleven_multilingual_v2",
              voice_settings: {
                stability: 0.5,
                similarity_boost: 0.75
              }
            })
          }
        );

        if (!response.ok) {
          const err = await response.text();
          throw new Error(`API Error ${response.status}: ${err}`);
        }

        statusEl.textContent = "Playing audio...";

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.volume = 1.0;

        audio.onended = () => {
          URL.revokeObjectURL(url);
          statusEl.textContent = "Finished playing";
          statusEl.className = "success";
        };

        audio.onerror = () => {
          statusEl.textContent = "Audio failed to play";
          statusEl.className = "error";
        };

        await audio.play();

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error: " + err.message;
        statusEl.className = "error";
      }
    }
  </script>
</body>
</html>
