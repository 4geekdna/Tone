<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chakra Tones">
  <meta name="theme-color" content="#0f0f12">

  <title>Chakra Tone Player</title>

  <style>
    :root {
      --bg: #0f0f12;
      --card-radius: 16px;
      --text: #ffffff;
      --muted: #a0a0b0;
      --panel: #1a1a20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      min-height: 100dvh;

      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));

      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      gap: 10px;
      max-width: 480px;
      margin: 0 auto 14px;
    }

    .card {
      border-radius: var(--card-radius);
      padding: 13px 15px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        filter 0.2s ease,
        box-shadow 0.3s ease;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;

      border: 2px solid transparent;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.playing {
      border-color: rgba(255,255,255,0.78);

      filter:
        brightness(1.22)
        saturate(1.08);

      box-shadow:
        0 0 14px rgba(255,255,255,0.16),
        0 0 32px rgba(255,255,255,0.08);

      animation: breatheCard 5s ease-in-out infinite;
    }

    @keyframes breatheCard {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.012);
      }
    }

    .card-name {
      font-size: 1.08rem;
      font-weight: 650;
      margin-bottom: 2px;
    }

    .card-meta {
      font-size: 0.78rem;
      opacity: 0.85;
      margin-bottom: 3px;
    }

    .card-affirmation {
      font-size: 0.86rem;
      font-style: italic;
      opacity: 0.95;
      line-height: 1.35;
      min-height: 1.2em;
    }

    .affirmation-panel {
      max-width: 480px;
      margin: 0 auto 14px;

      background: #1a1a22;

      border-radius: 14px;

      padding: 14px 16px;

      text-align: center;

      min-height: 78px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      transition: background 0.3s ease;
    }

    .affirmation-panel.empty {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .affirmation-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .affirmation-text {
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .controls {
      max-width: 480px;
      margin: 0 auto;

      background: var(--panel);

      border-radius: 16px;

      padding: 14px 16px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }

    .control-row:last-of-type {
      margin-bottom: 8px;
    }

    .control-label {
      font-size: 0.88rem;
      color: var(--muted);
      min-width: 76px;
    }

    .volume-value {
      min-width: 40px;
      text-align: right;

      color: #c6c6d0;

      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;

      height: 6px;

      -webkit-appearance: none;
      appearance: none;

      background: #333;

      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 21px;
      height: 21px;

      border-radius: 50%;

      background: #fff;

      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    select {
      flex: 1;

      background: #2a2a32;
      color: white;

      border: 1px solid #444;

      border-radius: 8px;

      padding: 8px 10px;

      font-size: 0.9rem;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;

      background: #333;

      border-radius: 26px;

      transition: 0.2s;
    }

    .slider:before {
      position: absolute;

      content: "";

      height: 20px;
      width: 20px;

      left: 3px;
      bottom: 3px;

      background: white;

      border-radius: 50%;

      transition: 0.2s;
    }

    input:checked + .slider {
      background: #4caf50;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .switch-description {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      padding: 12px 10px;

      border: none;
      border-radius: 12px;

      font-size: 0.95rem;
      font-weight: 600;

      cursor: pointer;

      color: white;

      -webkit-tap-highlight-color: transparent;
    }

    .btn-playall {
      background: #1565c0;
    }

    .btn-stop {
      background: #b71c1c;
    }

    .btn:active {
      opacity: 0.85;
      transform: scale(0.985);
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.76rem;
      color: #555;
    }

    .status {
      text-align: center;
      font-size: 0.84rem;
      color: #aaa;
      margin-top: 10px;
      min-height: 1.3em;
    }

    @media (prefers-reduced-motion: reduce) {
      .card.playing {
        animation: none;
      }
    }
  </style>
</head>

  </div>


  <script>

    // ============================================================

    const ELEVENLABS_API_KEY =

    // ============================================================

    let VOICE_ID =

    // ============================================================

        ]

    ];


    // ============================================================
    // STATE
    // ============================================================

    let audioCtx = null;

    let toneEnabled = true;

    let toneVolume = 0.30;

    let voiceVolume = 0.80;

    let currentTone = null;

    let activeName = null;

    let currentAudio = null;

    let currentAudioUrl = null;

    let speechController = null;

    let speechResolver = null;

    let currentUtterance = null;

    let isSpeaking = false;

    let isPlayingAll = false;

    let currentPlayAllIndex = 0;

    let journeyId = 0;


    const affirmationIndex = {};

    CHAKRAS.forEach(ch => {
      affirmationIndex[ch.name] = 0;
    });


    // ============================================================
    // DOM
    // ============================================================

    const grid =
      document.getElementById("chakraGrid");

    const voiceVolumeSlider =
      document.getElementById("voiceVolume");

    const toneVolumeSlider =
      document.getElementById("toneVolume");

    const voiceVolumeValue =
      document.getElementById("voiceVolumeValue");

    const toneVolumeValue =
      document.getElementById("toneVolumeValue");

    const toneToggle =
      document.getElementById("toneToggle");

    const voiceSelect =
      document.getElementById("voiceSelect");

    const stopBtn =
      document.getElementById("stopAll");

    const playAllBtn =
      document.getElementById("playAll");

    const affirmPanel =
      document.getElementById("affirmationPanel");

    const affirmLabel =
      document.getElementById("affirmLabel");

    const affirmText =
      document.getElementById("affirmText");

    const statusEl =
      document.getElementById("status");


    // ============================================================
    // BUILD CARDS
    // ============================================================

    CHAKRAS.forEach(ch => {

      const card =
        document.createElement("div");

      card.className =
        "card";

      card.style.background =
        ch.color;

      card.dataset.name =
        ch.name;

      card.innerHTML = `

        <div class="card-name">
          ${ch.name} • ${ch.freq} Hz
        </div>

        <div class="card-meta">
          ${ch.sanskrit} (${ch.note})
        </div>

        <div
          class="card-affirmation"
          data-affirm
        ></div>

      `;

      card.addEventListener(
        "click",
        () => handleCardTap(ch)
      );

      grid.appendChild(card);

    });


    // ============================================================
    // STATUS
    // ============================================================

    function setStatus(msg) {

      statusEl.textContent =
        msg || "";

    }


    // ============================================================
    // AUDIO CONTEXT
    // ============================================================

    function ensureAudio() {

      if (!audioCtx) {

        audioCtx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }

      if (
        audioCtx.state ===
        "suspended"
      ) {

        audioCtx.resume().catch(
          () => {}
        );

      }

      return audioCtx;

    }


    // ============================================================
    // CARD VISUAL STATE
    // ============================================================

    function highlightCard(ch) {

      activeName =
        ch.name;

      document
        .querySelectorAll(".card")
        .forEach(card => {

          const original =
            CHAKRAS.find(
              x =>
                x.name ===
                card.dataset.name
            );

          if (
            card.dataset.name ===
            ch.name
          ) {

            card.classList.add(
              "playing"
            );

            card.style.background =
              ch.active;

          } else {

            card.classList.remove(
              "playing"
            );

            if (original) {

              card.style.background =
                original.color;

            }

          }

        });

    }


    function clearCardHighlight() {

      activeName =
        null;

      document
        .querySelectorAll(".card")
        .forEach(card => {

          card.classList.remove(
            "playing"
          );

          const original =
            CHAKRAS.find(
              x =>
                x.name ===
                card.dataset.name
            );

          if (original) {

            card.style.background =
              original.color;

          }

        });

    }


    // ============================================================
    // ENHANCED TONE ENGINE
    // ============================================================

    function playTone(ch) {

      highlightCard(ch);

      if (!toneEnabled) {
        return;
      }

      ensureAudio();

      stopTone(false);

      const now =
        audioCtx.currentTime;


      // Master volume

      const masterGain =
        audioCtx.createGain();

      masterGain.gain.setValueAtTime(
        0,
        now
      );


      // Compressor softens peaks

      const compressor =
        audioCtx.createDynamicsCompressor();

      compressor.threshold.value =
        -22;

      compressor.knee.value =
        20;

      compressor.ratio.value =
        3;

      compressor.attack.value =
        0.02;

      compressor.release.value =
        0.7;


      masterGain.connect(
        compressor
      );

      compressor.connect(
        audioCtx.destination
      );


      // ========================================================
      // SOUND LAYERS
      // ========================================================

      const layers = [

        // Main Chakra / Solfeggio frequency

        {
          frequency: ch.freq,
          gain: 0.52,
          detune: 0
        },

        // Lower octave adds warmth / depth

        {
          frequency: ch.freq / 2,
          gain: 0.22,
          detune: 0
        },

        // Upper octave adds air / presence

        {
          frequency: ch.freq * 2,
          gain: 0.055,
          detune: 0
        },

        // Slight positive detune

        {
          frequency: ch.freq,
          gain: 0.13,
          detune: 4
        },

        // Slight negative detune

        {
          frequency: ch.freq,
          gain: 0.13,
          detune: -4
        }

      ];


      const oscillators =
        [];


      layers.forEach(layer => {

        const oscillator =
          audioCtx.createOscillator();

        const layerGain =
          audioCtx.createGain();


        oscillator.type =
          "sine";


        oscillator.frequency.setValueAtTime(
          layer.frequency,
          now
        );


        oscillator.detune.setValueAtTime(
          layer.detune,
          now
        );


        layerGain.gain.setValueAtTime(
          layer.gain,
          now
        );


        oscillator.connect(
          layerGain
        );


        layerGain.connect(
          masterGain
        );


        oscillator.start(
          now
        );


        oscillators.push(
          {
            oscillator,
            layerGain
          }
        );

      });


      // ========================================================
      // SLOW BREATHING MODULATION
      // ========================================================

      const lfo =
        audioCtx.createOscillator();

      const lfoGain =
        audioCtx.createGain();


      /*
        0.10 Hz means one complete volume swell
        approximately every 10 seconds.
      */

      lfo.frequency.value =
        0.10;


      lfoGain.gain.value =
        toneVolume * 0.055;


      lfo.connect(
        lfoGain
      );


      lfoGain.connect(
        masterGain.gain
      );


      lfo.start();


      // Smooth fade in

      masterGain.gain
        .linearRampToValueAtTime(
          toneVolume,
          now + 1.1
        );


      currentTone = {

        masterGain,
        compressor,
        oscillators,
        lfo,
        lfoGain

      };

    }


    // ============================================================
    // STOP TONE
    // ============================================================

    function stopTone(
      clearVisual = true
    ) {

      if (
        currentTone &&
        audioCtx
      ) {

        const tone =
          currentTone;

        currentTone =
          null;

        const now =
          audioCtx.currentTime;


        try {

          tone.masterGain.gain
            .cancelScheduledValues(
              now
            );

          tone.masterGain.gain
            .setTargetAtTime(
              0,
              now,
              0.08
            );

        } catch (_) {}


        setTimeout(() => {

          tone.oscillators
            .forEach(item => {

              try {
                item.oscillator.stop();
              } catch (_) {}

              try {
                item.oscillator.disconnect();
              } catch (_) {}

              try {
                item.layerGain.disconnect();
              } catch (_) {}

            });


          try {
            tone.lfo.stop();
          } catch (_) {}


          try {
            tone.lfo.disconnect();
          } catch (_) {}


          try {
            tone.lfoGain.disconnect();
          } catch (_) {}


          try {
            tone.masterGain.disconnect();
          } catch (_) {}


          try {
            tone.compressor.disconnect();
          } catch (_) {}

        }, 500);

      }


      if (clearVisual) {
        clearCardHighlight();
      }

    }


    // ============================================================
    // TONE VOLUME
    // ============================================================

    function updateToneVolume(
      target,
      speed = 0.08
    ) {

      if (
        !currentTone ||
        !audioCtx ||
        !toneEnabled
      ) {

        return;

      }


      const now =
        audioCtx.currentTime;


      currentTone.masterGain.gain
        .cancelScheduledValues(
          now
        );


      currentTone.masterGain.gain
        .setTargetAtTime(
          target,
          now,
          speed
        );


      currentTone.lfoGain.gain
        .setTargetAtTime(
          target * 0.055,
          now,
          speed
        );

    }


    // ============================================================
    // DUCK TONE WHILE SPEAKING
    // ============================================================

    function fadeToneForSpeech() {

      if (
        currentTone &&
        toneEnabled
      ) {

        updateToneVolume(
          toneVolume * 0.24,
          0.18
        );

      }

    }


    function restoreToneVolume() {

      if (
        currentTone &&
        toneEnabled
      ) {

        updateToneVolume(
          toneVolume,
          0.35
        );

      }

    }


    // ============================================================
    // STOP VOICE
    // ============================================================

    function stopVoice(
      restoreTone = true
    ) {

      if (speechResolver) {

        const resolver =
          speechResolver;

        speechResolver =
          null;

        resolver(false);

      }


      if (speechController) {

        try {
          speechController.abort();
        } catch (_) {}

        speechController =
          null;

      }


      if (currentAudio) {

        currentAudio.onended =
          null;

        currentAudio.onerror =
          null;

        try {
          currentAudio.pause();
        } catch (_) {}

        currentAudio =
          null;

      }


      if (currentAudioUrl) {

        try {

          URL.revokeObjectURL(
            currentAudioUrl
          );

        } catch (_) {}

        currentAudioUrl =
          null;

      }


      if (currentUtterance) {

        currentUtterance.onend =
          null;

        currentUtterance.onerror =
          null;

        currentUtterance =
          null;

      }


      try {

        speechSynthesis.cancel();

      } catch (_) {}


      isSpeaking =
        false;


      if (restoreTone) {

        restoreToneVolume();

      }

    }


    // ============================================================
    // DEVICE SPEECH FALLBACK
    // ============================================================

    function speakWithDeviceVoice(
      text
    ) {

      return new Promise(
        resolve => {

          stopVoice(false);


          const utterance =
            new SpeechSynthesisUtterance(
              text
            );


          currentUtterance =
            utterance;


          utterance.rate =
            0.88;


          utterance.pitch =
            1.0;


          utterance.volume =
            voiceVolume;


          speechResolver =
            resolve;


          isSpeaking =
            true;


          fadeToneForSpeech();


          setStatus(
            "Speaking with device voice..."
          );


          const finish =
            success => {

              if (
                speechResolver ===
                resolve
              ) {

                speechResolver =
                  null;

              }


              currentUtterance =
                null;


              isSpeaking =
                false;


              restoreToneVolume();


              setStatus("");


              resolve(
                success
              );

            };


          utterance.onend =
            () => finish(true);


          utterance.onerror =
            () => finish(false);


          try {

            speechSynthesis.speak(
              utterance
            );

          } catch (error) {

            console.error(
              error
            );

            finish(
              false
            );

          }

        }
      );

    }


    // ============================================================
    // ELEVENLABS SPEECH
    // ============================================================

    async function speakWithElevenLabs(
      text
    ) {

      stopVoice(false);


      const controller =
        new AbortController();


      speechController =
        controller;


      setStatus(
        "Generating voice..."
      );


      try {

        const response =
          await fetch(

            `https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`,

            {

              method: "POST",

              signal:
                controller.signal,

              headers: {

                "Accept":
                  "audio/mpeg",

                "Content-Type":
                  "application/json",

                "xi-api-key":
                  ELEVENLABS_API_KEY

              },

              body:
                JSON.stringify({

                  text,

                  model_id:
                    "eleven_multilingual_v2",

                  voice_settings: {

                    stability:
                      0.50,

                    similarity_boost:
                      0.75

                  }

                })

            }

          );


        if (!response.ok) {

          const errorBody =
            await response.text();


          console.error(
            "ElevenLabs error:",
            response.status,
            errorBody
          );


          throw new Error(
            `ElevenLabs API error ${response.status}`
          );

        }


        const blob =
          await response.blob();


        if (
          controller.signal.aborted
        ) {

          return false;

        }


        currentAudioUrl =
          URL.createObjectURL(
            blob
          );


        currentAudio =
          new Audio(
            currentAudioUrl
          );


        currentAudio.volume =
          voiceVolume;


        currentAudio.preload =
          "auto";


        isSpeaking =
          true;


        fadeToneForSpeech();


        setStatus(
          "Speaking..."
        );


        // ======================================================
        // IMPORTANT FIX:
        //
        // Audio.play() resolves when playback STARTS.
        //
        // This Promise resolves only when playback has FINISHED.
        // ======================================================

        const completed =
          await new Promise(
            resolve => {

              speechResolver =
                resolve;


              const finish =
                success => {

                  if (
                    speechResolver !==
                    resolve
                  ) {

                    return;

                  }


                  speechResolver =
                    null;


                  resolve(
                    success
                  );

                };


              currentAudio.onended =
                () => {

                  finish(
                    true
                  );

                };


              currentAudio.onerror =
                error => {

                  console.error(
                    "Audio playback error:",
                    error
                  );

                  finish(
                    false
                  );

                };


              currentAudio.play()
                .catch(error => {

                  console.error(
                    "Audio play error:",
                    error
                  );

                  finish(
                    false
                  );

                });

            }
          );


        if (currentAudio) {

          try {
            currentAudio.pause();
          } catch (_) {}

          currentAudio =
            null;

        }


        if (currentAudioUrl) {

          URL.revokeObjectURL(
            currentAudioUrl
          );

          currentAudioUrl =
            null;

        }


        speechController =
          null;


        isSpeaking =
          false;


        restoreToneVolume();


        setStatus("");


        return completed;

      } catch (error) {

        if (
          error.name ===
          "AbortError"
        ) {

          isSpeaking =
            false;

          setStatus("");

          return false;

        }


        console.error(
          "ElevenLabs failed:",
          error
        );


        setStatus(
          "Using device voice..."
        );


        return await speakWithDeviceVoice(
          text
        );

      }

    }


    // ============================================================
    // AFFIRMATIONS
    // ============================================================

    function getNextAffirmation(
      ch
    ) {

      const idx =
        affirmationIndex[
          ch.name
        ] || 0;


      const text =
        ch.affirmations[
          idx
        ];


      const number =
        idx + 1;


      affirmationIndex[
        ch.name
      ] =
        (
          idx + 1
        ) %
        ch.affirmations.length;


      return {
        text,
        number
      };

    }


    function showAffirmation(
      ch,
      text,
      number
    ) {

      affirmLabel.style.display =
        "block";


      affirmLabel.textContent =
        `Affirmation ${number} of ${ch.affirmations.length}`;


      affirmText.textContent =
        text;


      affirmPanel.classList.remove(
        "empty"
      );


      affirmPanel.style.background =
        ch.color + "33";


      const card =
        document.querySelector(
          `.card[data-name="${ch.name}"]`
        );


      if (card) {

        const el =
          card.querySelector(
            "[data-affirm]"
          );


        if (el) {

          el.textContent =
            text;

        }

      }

    }


    function clearAffirmation() {

      affirmLabel.style.display =
        "none";


      affirmText.textContent =
        "Select a chakra to begin";


      affirmPanel.classList.add(
        "empty"
      );


      affirmPanel.style.background =
        "#1a1a22";


      document
        .querySelectorAll(
          "[data-affirm]"
        )
        .forEach(el => {

          el.textContent =
            "";

        });

    }


    // ============================================================
    // SINGLE CHAKRA
    // ============================================================

    async function handleCardTap(
      ch
    ) {

      if (isPlayingAll) {

        stopPlayAll(
          false
        );

      }


      stopVoice(
        false
      );


      const {
        text,
        number
      } =
        getNextAffirmation(
          ch
        );


      showAffirmation(
        ch,
        text,
        number
      );


      playTone(
        ch
      );


      await speakWithElevenLabs(
        text
      );

    }


    // ============================================================
    // WAIT HELPER
    // ============================================================

    function wait(
      milliseconds
    ) {

      return new Promise(
        resolve => {

          setTimeout(
            resolve,
            milliseconds
          );

        }
      );

    }


    // ============================================================
    // STOP PLAY ALL
    // ============================================================

    function stopPlayAll(
      clearPanel = true
    ) {

      journeyId++;


      isPlayingAll =
        false;


      currentPlayAllIndex =
        0;


      playAllBtn.textContent =
        "Play All";


      stopVoice(
        false
      );


      stopTone(
        true
      );


      if (clearPanel) {

        clearAffirmation();

      }


      setStatus("");

    }


    // ============================================================
    // PLAY ALL
    // ============================================================

    async function playAllSequence() {

      const thisJourney =
        journeyId;


      while (

        isPlayingAll &&

        thisJourney ===
          journeyId &&

        currentPlayAllIndex <
          CHAKRAS.length

      ) {

        const ch =
          CHAKRAS[
            currentPlayAllIndex
          ];


        const {
          text,
          number
        } =
          getNextAffirmation(
            ch
          );


        showAffirmation(
          ch,
          text,
          number
        );


        playTone(
          ch
        );


        setStatus(
          `Chakra ${currentPlayAllIndex + 1} of ${CHAKRAS.length}`
        );


        // ======================================================
        // WAIT FOR ENTIRE AFFIRMATION TO FINISH
        // ======================================================

        const completed =
          await speakWithElevenLabs(
            text
          );


        // If Stop was pressed while speech was playing

        if (

          !isPlayingAll ||

          thisJourney !==
            journeyId

        ) {

          return;

        }


        // Restore tone after voice

        restoreToneVolume();


        // Short meditation pause between chakras

        setStatus(
          `Chakra ${currentPlayAllIndex + 1} of ${CHAKRAS.length} • Pause`
        );


        await wait(
          1400
        );


        // Check again in case Stop was pressed during pause

        if (

          !isPlayingAll ||

          thisJourney !==
            journeyId

        ) {

          return;

        }


        currentPlayAllIndex++;

      }


      // ========================================================
      // JOURNEY COMPLETE
      // ========================================================

      if (

        isPlayingAll &&

        thisJourney ===
          journeyId

      ) {

        isPlayingAll =
          false;


        currentPlayAllIndex =
          0;


        playAllBtn.textContent =
          "Play All";


        stopVoice(
          false
        );


        stopTone(
          true
        );


        setStatus(
          "Journey complete"
        );


        setTimeout(
          () => {

            if (!isPlayingAll) {

              setStatus("");

            }

          },

          3000
        );

      }

    }


    // ============================================================
    // PLAY ALL BUTTON
    // ============================================================

    playAllBtn.addEventListener(
      "click",
      () => {

        ensureAudio();


        if (isPlayingAll) {

          stopPlayAll();

          return;

        }


        journeyId++;


        isPlayingAll =
          true;


        currentPlayAllIndex =
          0;


        playAllBtn.textContent =
          "Stop Journey";


        playAllSequence();

      }
    );


    // ============================================================
    // STOP BUTTON
    // ============================================================

    stopBtn.addEventListener(
      "click",
      () => {

        stopPlayAll(
          true
        );

      }
    );


    // ============================================================
    // VOICE VOLUME CONTROL
    // ============================================================

    voiceVolumeSlider.addEventListener(
      "input",
      event => {

        voiceVolume =
          parseFloat(
            event.target.value
          );


        voiceVolumeValue.textContent =
          `${Math.round(
            voiceVolume * 100
          )}%`;


        if (currentAudio) {

          currentAudio.volume =
            voiceVolume;

        }

      }
    );


    // ============================================================
    // TONE VOLUME CONTROL
    // ============================================================

    toneVolumeSlider.addEventListener(
      "input",
      event => {

        toneVolume =
          parseFloat(
            event.target.value
          );


        toneVolumeValue.textContent =
          `${Math.round(
            toneVolume * 100
          )}%`;


        if (
          currentTone &&
          toneEnabled
        ) {

          if (isSpeaking) {

            updateToneVolume(
              toneVolume * 0.24,
              0.05
            );

          } else {

            updateToneVolume(
              toneVolume,
              0.05
            );

          }

        }

      }
    );


    // ============================================================
    // TONE ON / OFF
    // ============================================================

    toneToggle.addEventListener(
      "change",
      event => {

        toneEnabled =
          event.target.checked;


        if (!toneEnabled) {

          stopTone(
            false
          );

          return;

        }


        if (activeName) {

          const chakra =
            CHAKRAS.find(
              item =>
                item.name ===
                activeName
            );


          if (chakra) {

            playTone(
              chakra
            );

          }

        }

      }
    );


    // ============================================================
    // VOICE SELECT
    // ============================================================

    voiceSelect.addEventListener(
      "change",
      event => {

        VOICE_ID =
          event.target.value;

      }
    );


    // ============================================================
    // IOS AUDIO UNLOCK
    // ============================================================

    document.body.addEventListener(
      "touchstart",
      ensureAudio,
      {
        once: true,
        passive: true
      }
    );


    document.body.addEventListener(
      "click",
      ensureAudio,
      {
        once: true
      }
    );


    // ============================================================
    // RETURNING TO APP
    // ============================================================

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.visibilityState ===
          "visible"
        ) {

          ensureAudio();

        }

      }
    );

  </script>
