<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chakra Tones">
  <meta name="theme-color" content="#0f0f12">
  
  <title>Chakra Tone Player</title>
  
  <style>
    :root {
      --bg: #0f0f12;
      --card-radius: 16px;
      --text: #ffffff;
      --muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      gap: 10px;
      max-width: 480px;
      margin: 0 auto 16px;
    }

    .card {
      border-radius: var(--card-radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid transparent;
    }

    .card:active { transform: scale(0.98); }

    .card.playing {
      border-color: rgba(255,255,255,0.75);
      filter: brightness(1.25);
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 650;
      margin-bottom: 2px;
    }

    .card-meta {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .card-affirmation {
      font-size: 0.88rem;
      font-style: italic;
      opacity: 0.95;
      line-height: 1.35;
      min-height: 1.3em;
    }

    .affirmation-panel {
      max-width: 480px;
      margin: 0 auto 18px;
      background: #1a1a22;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .affirmation-panel.empty {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .affirmation-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .affirmation-text {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .controls {
      max-width: 480px;
      margin: 0 auto;
      background: #1a1a20;
      border-radius: 16px;
      padding: 16px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 65px;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #333;
      border-radius: 3px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
    }

    .switch {
      position: relative;
      width: 48px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #333;
      border-radius: 28px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider { background: #4caf50; }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      padding: 13px 10px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    .btn-playall { background: #1565c0; }
    .btn-stop { background: #b71c1c; }
    .btn:active { opacity: 0.85; }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 0.78rem;
      color: #555;
    }

    .status {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Chakra Tone Player</h1>
    <p>ElevenLabs natural voice • Tap a chakra</p>
  </div>

  <div class="grid" id="chakraGrid"></div>

  <div class="affirmation-panel empty" id="affirmationPanel">
    <div class="affirmation-label" id="affirmLabel" style="display:none;">Current Affirmation</div>
    <div class="affirmation-text" id="affirmText">Select a chakra to begin</div>
  </div>

  <div class="controls">
    <div class="control-row">
      <label>Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.4" />
    </div>

    <div class="control-row">
      <label>Loop</label>
      <label class="switch">
        <input type="checkbox" id="loopToggle" />
        <span class="slider"></span>
      </label>
      <span style="color:var(--muted); font-size:0.9rem;">Single chakra</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-playall" id="playAll">Play All (11s each)</button>
      <button class="btn btn-stop" id="stopAll">Stop</button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="footer">
    Solfeggio frequencies + ElevenLabs voice
  </div>

  <script>
    // ========== PASTE YOUR KEY HERE ==========
    const ELEVENLABS_API_KEY = "sk_e9322bc962e4375aa8656bae5caf6a5ddf3fb744e54167aa";
    // =========================================

    // Sarah - Mature, Reassuring, Confident (works on free plan)
    const VOICE_ID = "EXAVITQu4vr4xnSDxMaL";

    const CHAKRAS = [
      {
        name: "Root", sanskrit: "Muladhara", freq: 396, color: "#8B0000", active: "#FF1A1A", note: "C",
        affirmations: [
          "I am safe, grounded, and secure in my body.",
          "I trust the process of life and feel deeply rooted.",
          "My foundation is strong; I belong here.",
          "I release fear and stand firmly in the present moment.",
          "Abundance flows to me as I remain stable and centered."
        ]
      },
      {
        name: "Sacral", sanskrit: "Svadhisthana", freq: 417, color: "#E65100", active: "#FF9100", note: "D",
        affirmations: [
          "I embrace pleasure and creativity with ease.",
          "My emotions flow freely and healthily.",
          "I honor my desires and allow joy into my life.",
          "I am open to change and the beauty of transformation.",
          "Creativity moves through me effortlessly."
        ]
      },
      {
        name: "Solar Plexus", sanskrit: "Manipura", freq: 528, color: "#F9A825", active: "#FFEB3B", note: "E",
        affirmations: [
          "I am confident, powerful, and in control of my life.",
          "I trust my inner wisdom and take decisive action.",
          "My personal power shines brightly.",
          "I release self-doubt and step into my strength.",
          "I am worthy of success and respect."
        ]
      },
      {
        name: "Heart", sanskrit: "Anahata", freq: 639, color: "#2E7D32", active: "#4CAF50", note: "F",
        affirmations: [
          "I give and receive love freely and unconditionally.",
          "My heart is open, compassionate, and full of gratitude.",
          "I forgive myself and others with ease.",
          "Love is my true nature and guides every action.",
          "I am deeply connected to all living beings."
        ]
      },
      {
        name: "Throat", sanskrit: "Vishuddha", freq: 741, color: "#0277BD", active: "#29B6F6", note: "G",
        affirmations: [
          "I speak my truth with clarity and confidence.",
          "My voice is powerful and my words create positive change.",
          "I express myself authentically and listen deeply.",
          "Communication flows easily between me and others.",
          "I am heard, understood, and respected."
        ]
      },
      {
        name: "Third Eye", sanskrit: "Ajna", freq: 852, color: "#283593", active: "#5C6BC0", note: "A",
        affirmations: [
          "I trust my intuition and inner vision.",
          "Clarity and insight guide my path.",
          "I see beyond illusion and perceive the truth.",
          "My mind is clear, focused, and open to wisdom.",
          "I am connected to my higher guidance."
        ]
      },
      {
        name: "Crown", sanskrit: "Sahasrara", freq: 963, color: "#6A1B9A", active: "#AB47BC", note: "B",
        affirmations: [
          "I am one with the divine and infinite consciousness.",
          "Divine wisdom flows through me effortlessly.",
          "I am connected to pure awareness and universal love.",
          "My spirit is free, expansive, and luminous.",
          "I surrender to the highest good and trust the universe."
        ]
      }
    ];

    let audioCtx = null;
    let currentOsc = null;
    let currentGain = null;
    let activeName = null;
    let volume = 0.4;
    let loop = false;
    let isPlayingAll = false;
    let playAllTimeout = null;
    let currentPlayAllIndex = 0;
    let currentAudio = null;

    const affirmationIndex = {};
    CHAKRAS.forEach(ch => affirmationIndex[ch.name] = 0);

    const grid = document.getElementById("chakraGrid");
    const volumeSlider = document.getElementById("volume");
    const loopToggle = document.getElementById("loopToggle");
    const stopBtn = document.getElementById("stopAll");
    const playAllBtn = document.getElementById("playAll");
    const affirmPanel = document.getElementById("affirmationPanel");
    const affirmLabel = document.getElementById("affirmLabel");
    const affirmText = document.getElementById("affirmText");
    const statusEl = document.getElementById("status");

    // Build cards
    CHAKRAS.forEach(ch => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.background = ch.color;
      card.dataset.name = ch.name;
      card.innerHTML = `
        <div class="card-name">${ch.name} • ${ch.freq} Hz</div>
        <div class="card-meta">${ch.sanskrit} (${ch.note})</div>
        <div class="card-affirmation" data-affirm></div>
      `;
      card.addEventListener("click", () => handleCardTap(ch));
      grid.appendChild(card);
    });

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    // ========== ElevenLabs Voice ==========
    async function speakWithElevenLabs(text) {
      try {
        setStatus("Generating voice...");
        
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
          method: "POST",
          headers: {
            "Accept": "audio/mpeg",
            "Content-Type": "application/json",
            "xi-api-key": ELEVENLABS_API_KEY
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75,
              style: 0.3,
              use_speaker_boost: true
            }
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error("ElevenLabs error:", response.status, errorText);
          throw new Error(`ElevenLabs error: ${response.status}`);
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }

        currentAudio = new Audio(audioUrl);
        currentAudio.volume = 1.0;
        
        currentAudio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          setStatus("");
        };

        await currentAudio.play();
        setStatus("");
      } catch (err) {
        console.error(err);
        setStatus("Voice failed – using device voice");
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.87;
        speechSynthesis.speak(utterance);
      }
    }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function getNextAffirmation(ch) {
      const idx = affirmationIndex[ch.name];
      const text = ch.affirmations[idx];
      affirmationIndex[ch.name] = (idx + 1) % ch.affirmations.length;
      return text;
    }

    function showAffirmation(ch, text) {
      affirmText.style.opacity = "0";
      setTimeout(() => {
        affirmLabel.style.display = "block";
        affirmText.textContent = text;
        affirmPanel.classList.remove("empty");
        affirmPanel.style.background = ch.color + "33";
        affirmText.style.opacity = "1";
      }, 150);

      const card = document.querySelector(`.card[data-name="${ch.name}"]`);
      if (card) {
        const el = card.querySelector("[data-affirm]");
        if (el) {
          el.style.opacity = "0";
          setTimeout(() => {
            el.textContent = text;
            el.style.opacity = "1";
          }, 120);
        }
      }
    }

    function clearAffirmation() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      speechSynthesis.cancel();
      
      affirmText.style.opacity = "0";
      setTimeout(() => {
        affirmLabel.style.display = "none";
        affirmText.textContent = "Select a chakra to begin";
        affirmPanel.classList.add("empty");
        affirmPanel.style.background = "#1a1a22";
        affirmText.style.opacity = "1";
      }, 150);

      document.querySelectorAll("[data-affirm]").forEach(el => el.textContent = "");
      setStatus("");
    }

    function stopTone() {
      if (currentOsc) {
        try {
          currentOsc.stop();
          currentOsc.disconnect();
          currentGain.disconnect();
        } catch(e) {}
        currentOsc = null;
        currentGain = null;
      }
      activeName = null;
      document.querySelectorAll(".card").forEach(c => {
        c.classList.remove("playing");
        const original = CHAKRAS.find(x => x.name === c.dataset.name);
        if (original) c.style.background = original.color;
      });
    }

    function playTone(ch, duration = null) {
      ensureAudio();          // force resume every time
      stopTone();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.value = ch.freq;

      // Start silent then ramp up (helps prevent suspension on iOS)
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();

      const playDuration = duration || (loop ? null : 8);

      if (playDuration) {
        gain.gain.setValueAtTime(volume, audioCtx.currentTime + playDuration - 0.5);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + playDuration);
        osc.stop(audioCtx.currentTime + playDuration + 0.05);
      }

      currentOsc = osc;
      currentGain = gain;
      activeName = ch.name;

      // Visual update
      document.querySelectorAll(".card").forEach(c => {
        if (c.dataset.name === ch.name) {
          c.classList.add("playing");
          c.style.background = ch.active;
        } else {
          c.classList.remove("playing");
          const original = CHAKRAS.find(x => x.name === c.dataset.name);
          if (original) c.style.background = original.color;
        }
      });
    }

    function handleCardTap(ch) {
      if (isPlayingAll) stopPlayAll();

      const affirmation = getNextAffirmation(ch);
      showAffirmation(ch, affirmation);
      speakWithElevenLabs(affirmation);

      if (activeName === ch.name) return;
      playTone(ch);
    }

    function stopPlayAll() {
      isPlayingAll = false;
      currentPlayAllIndex = 0;
      clearTimeout(playAllTimeout);
      playAllBtn.textContent = "Play All (11s each)";
      stopTone();
      clearAffirmation();
    }

    function playAllSequence() {
      if (currentPlayAllIndex >= CHAKRAS.length) {
        stopPlayAll();
        return;
      }

      const ch = CHAKRAS[currentPlayAllIndex];
      const affirmation = getNextAffirmation(ch);

      showAffirmation(ch, affirmation);
      speakWithElevenLabs(affirmation);
      playTone(ch, 11);

      currentPlayAllIndex++;
      playAllTimeout = setTimeout(playAllSequence, 11500);
    }

    playAllBtn.addEventListener("click", () => {
      if (isPlayingAll) {
        stopPlayAll();
        return;
      }
      isPlayingAll = true;
      currentPlayAllIndex = 0;
      playAllBtn.textContent = "Stop Journey";
      playAllSequence();
    });

    stopBtn.addEventListener("click", stopPlayAll);

    volumeSlider.addEventListener("input", (e) => {
      volume = parseFloat(e.target.value);
      if (currentGain) {
        currentGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.05);
      }
    });

    loopToggle.addEventListener("change", (e) => {
      loop = e.target.checked;
    });

    document.body.addEventListener("touchstart", ensureAudio, { once: true });
    document.body.addEventListener("click", ensureAudio, { once: true });
  </script>
</body>
</html>
