      align-items: center;
      justify-content: space-between;
      gap: 10px;

      font-size: 0.82rem;

    .api-left {
      min-width: 0;
    }

    .api-title {
      font-weight: 650;
      margin-bottom: 2px;
    }

    .api-detail {
      color: var(--muted);
      font-size: 0.76rem;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .api-indicator {
      flex: 0 0 auto;

      padding: 5px 9px;

      border-radius: 999px;

      background: #2a2a32;
      color: #bbb;

      font-size: 0.72rem;
      font-weight: 700;
    }

    .api-indicator.good {
      color: var(--good);
      background: rgba(103,224,138,0.1);
    }

    .api-indicator.warn {
      color: var(--warn);
      background: rgba(255,209,102,0.1);
    }

    .api-indicator.bad {
      color: var(--bad);
      background: rgba(255,107,107,0.1);
    }

       CHAKRA CARDS
       ========================================================= */

      display: grid;
      gap: 10px;

      max-width: 480px;
      margin: 0 auto 14px;
    }

    .card {
      border-radius: var(--card-radius);

      padding: 13px 15px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        filter 0.2s ease,
        box-shadow 0.3s ease;

      user-select: none;
      -webkit-user-select: none;

      -webkit-tap-highlight-color: transparent;

      border: 2px solid transparent;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.playing {
      border-color: rgba(255,255,255,0.78);

      filter:
        brightness(1.22)
        saturate(1.08);

      box-shadow:
        0 0 14px rgba(255,255,255,0.16),
        0 0 32px rgba(255,255,255,0.08);

      animation:
        breatheCard 5s ease-in-out infinite;
    }

    @keyframes breatheCard {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.012);
      }

    }

    .card-name {
      font-size: 1.08rem;
      font-weight: 650;
      margin-bottom: 2px;
    }

    .card-meta {
      font-size: 0.78rem;
      opacity: 0.85;

      line-height: 1.35;

      min-height: 1.2em;

      gap: 12px;

    }

    .control-row:last-of-type {
      margin-bottom: 8px;
    }

    .control-label {
      font-size: 0.88rem;

      color: var(--muted);

      min-width: 76px;
    }

    .volume-value {
      min-width: 40px;

      text-align: right;

      color: #c6c6d0;

      font-size: 0.78rem;

      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;

      height: 6px;

      -webkit-appearance: none;
      appearance: none;

      background: #333;

      border-radius: 3px;

      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 21px;
      height: 21px;

      border-radius: 50%;

      background: #fff;

      box-shadow:

    select {
      flex: 1;

      min-width: 0;

      background: #2a2a32;
      color: white;

      border: 1px solid #444;

      border-radius: 8px;

      padding: 8px 10px;

      font-size: 0.9rem;
    }

    /* =========================================================
       SWITCH
       ========================================================= */

    .switch {
      position: relative;

      width: 46px;
      height: 26px;

      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;

      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;

      cursor: pointer;

      inset: 0;

      background: #333;

      border-radius: 26px;

      transition: 0.2s;
    }

    .slider:before {
      position: absolute;

      content: "";

      height: 20px;
      width: 20px;

      left: 3px;
      bottom: 3px;

      background: white;

      border-radius: 50%;

      transition: 0.2s;
    }

    input:checked + .slider {
      background: #4caf50;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .switch-description {
      color: var(--muted);
      font-size: 0.88rem;
    }

        animation: none;

function setApiState(
  state,
  detail = ""
) {

  apiIndicator.className =
    "api-indicator";


  if (
    state ===
    "good"
  ) {

    apiIndicator.classList.add(
      "good"
    );

    apiIndicator.textContent =
      "ELEVENLABS ✓";


    apiMiniStatus.textContent =
      "✓";


    apiMiniStatus.style.color =
      "#67e08a";

  }


  else if (
    state ===
    "checking"
  ) {

    apiIndicator.classList.add(
      "warn"
    );

    apiIndicator.textContent =
      "CHECKING…";


    apiMiniStatus.textContent =
      "…";


    apiMiniStatus.style.color =
      "#ffd166";

  }


  else if (
    state ===
    "bad"
  ) {

    apiIndicator.classList.add(
      "bad"
    );

    apiIndicator.textContent =
      "FAILED";


    apiMiniStatus.textContent =
      "✕";


    apiMiniStatus.style.color =
      "#ff6b6b";

  }


  else {

    apiIndicator.textContent =
      "NOT CHECKED";


    apiMiniStatus.textContent =
      "—";


    apiMiniStatus.style.color =
      "#aaa";

  }


  if (detail) {

    apiDetail.textContent =
      detail;

  }

}

// ============================================================
// ELEVENLABS API CHECK
// ============================================================

async function checkElevenLabsAPI(
  showStatus = true
) {

  if (
    apiCheckPromise
  ) {

    return apiCheckPromise;

  }


  apiCheckPromise =
    (async () => {

      elevenLabsAvailable =
        false;


      verifiedVoiceName =
        "";


      verifiedModel =
        false;


      setApiState(
        "checking",
        "Checking API key, model and selected voice…"
      );


      if (showStatus) {

        setStatus(
          "Checking ElevenLabs API…"
        );

      }


      try {

        // ====================================================
        // VERIFY SELECTED VOICE + API KEY
        // ====================================================

        const voiceResponse =
          await fetch(

            `https://api.elevenlabs.io/v1/voices/${encodeURIComponent(VOICE_ID)}`,

            {

              method:
                "GET",

              headers: {

                "xi-api-key":
                  ELEVENLABS_API_KEY

              }

            }

          );


        if (
          !voiceResponse.ok
        ) {

          const body =
            await voiceResponse.text();


          console.error(
            "ElevenLabs voice/API check failed:",
            voiceResponse.status,
            body
          );


          if (
            voiceResponse.status ===
            401
          ) {

            throw new Error(
              "API key rejected (401)"
            );

          }


          if (
            voiceResponse.status ===
            403
          ) {

            throw new Error(
              "API key lacks permission (403)"
            );

          }


          if (
            voiceResponse.status ===
            404
          ) {

            throw new Error(
              "Selected voice is unavailable"
            );

          }


          throw new Error(
            `Voice/API check failed (${voiceResponse.status})`
          );

        }


        const voice =
          await voiceResponse.json();


        verifiedVoiceName =
          voice.name ||
          "ElevenLabs Voice";


        // ====================================================
        // VERIFY MODEL
        // ====================================================

        const modelsResponse =
          await fetch(

            "https://api.elevenlabs.io/v1/models",

            {

              method:
                "GET",

              headers: {

                "xi-api-key":
                  ELEVENLABS_API_KEY

              }

            }

          );


        if (
          modelsResponse.ok
        ) {

          const models =
            await modelsResponse.json();


          const model =
            Array.isArray(
              models
            )
              ?
                models.find(
                  m =>
                    m.model_id ===
                    ELEVENLABS_MODEL
                )
              :
                null;


          verifiedModel =
            !!model &&
            model.can_do_text_to_speech !==
              false;


          if (
            !verifiedModel
          ) {

            throw new Error(
              `TTS model ${ELEVENLABS_MODEL} unavailable`
            );

          }

        }

        else {

          console.warn(
            "Could not verify models endpoint:",
            modelsResponse.status
          );


          // Voice authentication succeeded,
          // so do not fail solely because
          // models endpoint could not be checked.

          verifiedModel =
            true;

        }


        elevenLabsAvailable =
          true;


        setApiState(

          "good",

          `${verifiedVoiceName} • ${ELEVENLABS_MODEL}`

        );


        apiTitle.textContent =
          "ElevenLabs connected";


        if (showStatus) {

          setStatus(
            `✓ ElevenLabs verified: ${verifiedVoiceName}`
          );


          setTimeout(
            () => {

              if (
                !isSpeaking &&
                !isPlayingAll
              ) {

                setStatus("");

              }

            },

            3500
          );

        }


        console.log(
          "ElevenLabs verified:",
          {

            voiceId:
              VOICE_ID,

            voiceName:
              verifiedVoiceName,

            model:
              ELEVENLABS_MODEL

          }
        );


        return true;

      }

      catch (
        error
      ) {

        elevenLabsAvailable =
          false;


        setApiState(

          "bad",

          error.message ||
          "ElevenLabs connection failed"

        );


        apiTitle.textContent =
          "ElevenLabs unavailable";


        if (showStatus) {

          setStatus(

            `⚠ ${
              error.message ||
              "ElevenLabs check failed"
            }`

          );

        }


        console.error(
          "ElevenLabs API check failed:",
          error
        );


        return false;

      }

      finally {

        apiCheckPromise =
          null;

      }

    })();


  return apiCheckPromise;

}


// ============================================================
// AUDIO CONTEXT
// ============================================================

function ensureAudio() {

  if (!audioCtx) {

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if (
    audioCtx.state ===
    "suspended"
  ) {

    audioCtx.resume()
      .catch(
        () => {}
      );

  }


  return audioCtx;

}


// ============================================================
// CARD VISUAL STATE
// ============================================================

function highlightCard(
  ch
) {

  activeName =
    ch.name;


  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {

        const original =
          CHAKRAS.find(
            x =>
              x.name ===
              card.dataset.name
          );


        if (
          card.dataset.name ===
          ch.name
        ) {

          card.classList.add(
            "playing"
          );


          card.style.background =
            ch.active;

        }

        else {

          card.classList.remove(
            "playing"
          );


          if (original) {

            card.style.background =
              original.color;

          }

        }

      }
    );

}


// ============================================================
// CLEAR HIGHLIGHT
// ============================================================

function clearCardHighlight() {

  activeName =
    null;


  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {

        card.classList.remove(
          "playing"
        );


        const original =
          CHAKRAS.find(
            x =>
              x.name ===
              card.dataset.name
          );


        if (original) {

          card.style.background =
            original.color;

        }

      }
    );

}


// ============================================================
// ENHANCED TONE ENGINE
// ============================================================

function playTone(
  ch
) {

  highlightCard(
    ch
  );


  if (
    !toneEnabled
  ) {

    return;

  }


  ensureAudio();


  stopTone(
    false
  );


  const now =
    audioCtx.currentTime;


  // ==========================================================
  // MASTER GAIN
  // ==========================================================

  const masterGain =
    audioCtx.createGain();


  masterGain.gain.setValueAtTime(
    0,
    now
  );


  // ==========================================================
  // COMPRESSOR
  // ==========================================================

  const compressor =
    audioCtx.createDynamicsCompressor();


  compressor.threshold.value =
    -22;


  compressor.knee.value =
    20;


  compressor.ratio.value =
    3;


  compressor.attack.value =
    0.02;


  compressor.release.value =
    0.7;


  masterGain.connect(
    compressor
  );


  compressor.connect(
    audioCtx.destination
  );


  // ==========================================================
  // SOUND LAYERS
  // ==========================================================

  const layers = [

    {
      frequency:
        ch.freq,

      gain:
        0.52,

      detune:
        0
    },


    {
      frequency:
        ch.freq / 2,

      gain:
        0.22,

      detune:
        0
    },


    {
      frequency:
        ch.freq * 2,

      gain:
        0.055,

      detune:
        0
    },


    {
      frequency:
        ch.freq,

      gain:
        0.13,

      detune:
        4
    },


    {
      frequency:
        ch.freq,

      gain:
        0.13,

      detune:
        -4
    }

  ];


  const oscillators =
    [];


  layers.forEach(
    layer => {

      const oscillator =
        audioCtx.createOscillator();


      const layerGain =
        audioCtx.createGain();


      oscillator.type =
        "sine";


      oscillator.frequency.setValueAtTime(
        layer.frequency,
        now
      );


      oscillator.detune.setValueAtTime(
        layer.detune,
        now
      );


      layerGain.gain.setValueAtTime(
        layer.gain,
        now
      );


      oscillator.connect(
        layerGain
      );


      layerGain.connect(
        masterGain
      );


      oscillator.start(
        now
      );


      oscillators.push(
        {

          oscillator,
          layerGain

        }
      );

    }
  );


  // ==========================================================
  // BREATHING LFO
  // ==========================================================

  const lfo =
    audioCtx.createOscillator();


  const lfoGain =
    audioCtx.createGain();


  lfo.frequency.value =
    0.10;


  lfoGain.gain.value =
    toneVolume *
    0.055;


  lfo.connect(
    lfoGain
  );


  lfoGain.connect(
    masterGain.gain
  );


  lfo.start(
    now
  );


  // ==========================================================
  // FADE IN
  // ==========================================================

  masterGain.gain
    .linearRampToValueAtTime(

      toneVolume,

      now + 1.1

    );


  currentTone = {

    masterGain,

    compressor,

    oscillators,

    lfo,

    lfoGain

  };

}


// ============================================================
// STOP TONE
// ============================================================

function stopTone(
  clearVisual = true
) {

  if (
    currentTone &&
    audioCtx
  ) {

    const tone =
      currentTone;


    currentTone =
      null;


    const now =
      audioCtx.currentTime;


    try {

      tone.masterGain.gain
        .cancelScheduledValues(
          now
        );


      tone.masterGain.gain
        .setTargetAtTime(

          0,

          now,

          0.06

        );

    }

    catch (_) {}


    setTimeout(
      () => {

        tone.oscillators
          .forEach(
            item => {

              try {

                item.oscillator.stop();

              }

              catch (_) {}


              try {

                item.oscillator.disconnect();

              }

              catch (_) {}


              try {

                item.layerGain.disconnect();

              }

              catch (_) {}

            }
          );


        try {

          tone.lfo.stop();

        }

        catch (_) {}


        try {

          tone.lfo.disconnect();

        }

        catch (_) {}


        try {

          tone.lfoGain.disconnect();

        }

        catch (_) {}


        try {

          tone.masterGain.disconnect();

        }

        catch (_) {}


        try {

          tone.compressor.disconnect();

        }

        catch (_) {}

      },

      350
    );

  }


  if (
    clearVisual
  ) {

    clearCardHighlight();

  }

}


// ============================================================
// TONE VOLUME
// ============================================================

function updateToneVolume(
  target,
  speed = 0.08
) {

  if (
    !currentTone ||
    !audioCtx ||
    !toneEnabled
  ) {

    return;

  }


  const now =
    audioCtx.currentTime;


  currentTone.masterGain.gain
    .cancelScheduledValues(
      now
    );


  currentTone.masterGain.gain
    .setTargetAtTime(

      target,

      now,

      speed

    );


  currentTone.lfoGain.gain
    .setTargetAtTime(

      target * 0.055,

      now,

      speed

    );

}


// ============================================================
// DUCK TONE WHILE SPEAKING
// ============================================================

function fadeToneForSpeech() {

  if (
    currentTone &&
    toneEnabled
  ) {

    updateToneVolume(

      toneVolume * 0.24,

      0.18

    );

  }

}


// ============================================================
// RESTORE TONE
// ============================================================

function restoreToneVolume() {

  if (
    currentTone &&
    toneEnabled
  ) {

    updateToneVolume(

      toneVolume,

      0.35

    );

  }

}


// ============================================================
// STOP VOICE
// ============================================================

function stopVoice(
  restoreTone = true
) {

  if (
    speechResolver
  ) {

    const resolver =
      speechResolver;


    speechResolver =
      null;


    resolver(
      false
    );

  }


  if (
    speechController
  ) {

    try {

      speechController.abort();

    }

    catch (_) {}


    speechController =
      null;

  }


  if (
    currentAudio
  ) {

    currentAudio.onended =
      null;


    currentAudio.onerror =
      null;


    try {

      currentAudio.pause();

      currentAudio.currentTime =
        0;

    }

    catch (_) {}


    currentAudio =
      null;

  }


  if (
    currentAudioUrl
  ) {

    try {

      URL.revokeObjectURL(
        currentAudioUrl
      );

    }

    catch (_) {}


    currentAudioUrl =
      null;

  }


  if (
    currentUtterance
  ) {

    currentUtterance.onend =
      null;


    currentUtterance.onerror =
      null;


    currentUtterance =
      null;

  }


  try {

    speechSynthesis.cancel();

  }

  catch (_) {}


  isSpeaking =
    false;


  if (
    restoreTone
  ) {

    restoreToneVolume();

  }

}


// ============================================================
// DEVICE VOICE FALLBACK
// ============================================================

function speakWithDeviceVoice(
  text
) {

  return new Promise(
    resolve => {

      stopVoice(
        false
      );


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      currentUtterance =
        utterance;


      utterance.rate =
        0.88;


      utterance.pitch =
        1.0;


      utterance.volume =
        voiceVolume;


      speechResolver =
        resolve;


      isSpeaking =
        true;


      fadeToneForSpeech();


      setApiState(

        "bad",

        "Using iPhone/device speech — ElevenLabs did not generate this voice"

      );


      setStatus(
        "⚠ DEVICE VOICE — ElevenLabs unavailable"
      );


      const finish =
        success => {

          if (
            speechResolver !==
            resolve
          ) {

            return;

          }


          speechResolver =
            null;


          currentUtterance =
            null;


          isSpeaking =
            false;


          restoreToneVolume();


          if (
            !isPlayingAll
          ) {

            setStatus(
              "⚠ Device voice was used"
            );

          }


          resolve(
            success
          );

        };


      utterance.onend =
        () => {

          finish(
            true
          );

        };


      utterance.onerror =
        () => {

          finish(
            false
          );

        };


      try {

        speechSynthesis.speak(
          utterance
        );

      }

      catch (
        error
      ) {

        console.error(
          error
        );


        finish(
          false
        );

      }

    }
  );

}


// ============================================================
// ELEVENLABS SPEECH
// ============================================================

async function speakWithElevenLabs(
  text
) {

  stopVoice(
    false
  );


  // ==========================================================
  // VERIFY ELEVENLABS FIRST
  // ==========================================================

  if (
    !elevenLabsAvailable
  ) {

    const apiOK =
      await checkElevenLabsAPI(
        false
      );


    if (
      !apiOK
    ) {

      return await speakWithDeviceVoice(
        text
      );

    }

  }


  const controller =
    new AbortController();


  speechController =
    controller;


  setApiState(

    "good",

    `${verifiedVoiceName || "ElevenLabs"} • generating`

  );


  setStatus(

    `Generating ${verifiedVoiceName || "ElevenLabs"}…`

  );


  try {

    // ========================================================
    // ELEVENLABS TTS REQUEST
    // ========================================================

    const response =
      await fetch(

        `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(VOICE_ID)}?output_format=mp3_44100_128`,

        {

          method:
            "POST",


          signal:
            controller.signal,


          headers: {

            "Accept":
              "audio/mpeg",

            "Content-Type":
              "application/json",

            "xi-api-key":
              ELEVENLABS_API_KEY

          },


          body:
            JSON.stringify({

              text,

              model_id:
                ELEVENLABS_MODEL,


              voice_settings: {

                stability:
                  0.42,

                similarity_boost:
                  0.82,

                style:
                  0.18,

                use_speaker_boost:
                  true,

                speed:
                  0.90

              }

            })

        }

      );


    if (
      !response.ok
    ) {

      const errorBody =
        await response.text();


      console.error(

        "ElevenLabs TTS error:",

        response.status,

        errorBody

      );


      elevenLabsAvailable =
        false;


      throw new Error(

        `TTS request failed (${response.status})`

      );

    }


    // ========================================================
    // GET AUDIO
    // ========================================================

    const blob =
      await response.blob();


    if (
      controller.signal.aborted
    ) {

      return false;

    }


    if (
      !blob ||
      blob.size ===
        0
    ) {

      throw new Error(
        "ElevenLabs returned empty audio"
      );

    }


    currentAudioUrl =
      URL.createObjectURL(
        blob
      );


    currentAudio =
      new Audio(
        currentAudioUrl
      );


    currentAudio.volume =
      voiceVolume;


    currentAudio.preload =
      "auto";


    isSpeaking =
      true;


    fadeToneForSpeech();


    // ========================================================
    // NOW WE KNOW ELEVENLABS GENERATED THE AUDIO
    // ========================================================

    setApiState(

      "good",

      `Playing ElevenLabs: ${verifiedVoiceName || VOICE_ID}`

    );


    setStatus(

      `ELEVENLABS ✓ • ${verifiedVoiceName || "voice"}`

    );


    // ========================================================
    // WAIT FOR ENTIRE AUDIO TO FINISH
    // ========================================================

    const completed =
      await new Promise(
        resolve => {

          speechResolver =
            resolve;


          const finish =
            success => {

              if (
                speechResolver !==
                resolve
              ) {

                return;

              }


              speechResolver =
                null;


              resolve(
                success
              );

            };


          currentAudio.onended =
            () => {

              finish(
                true
              );

            };


          currentAudio.onerror =
            error => {

              console.error(

                "Audio playback error:",

                error

              );


              finish(
                false
              );

            };


          currentAudio.play()
            .catch(
              error => {

                console.error(

                  "Audio play error:",

                  error

                );


                finish(
                  false
                );

              }
            );

        }
      );


    // ========================================================
    // CLEAN UP AUDIO
    // ========================================================

    if (
      currentAudio
    ) {

      try {

        currentAudio.pause();

      }

      catch (_) {}


      currentAudio =
        null;

    }


    if (
      currentAudioUrl
    ) {

      try {

        URL.revokeObjectURL(
          currentAudioUrl
        );

      }

      catch (_) {}


      currentAudioUrl =
        null;

    }


    speechController =
      null;


    isSpeaking =
      false;


    restoreToneVolume();


    if (
      elevenLabsAvailable
    ) {

      setApiState(

        "good",

        `${verifiedVoiceName} • ${ELEVENLABS_MODEL}`

      );

    }


    if (
      !isPlayingAll
    ) {

      setStatus("");

    }


    return completed;

  }

  catch (
    error
  ) {

    // ========================================================
    // ABORT IS NORMAL WHEN STOP IS PRESSED
    // ========================================================

    if (
      error.name ===
      "AbortError"
    ) {

      isSpeaking =
        false;


      if (
        !isPlayingAll
      ) {

        setStatus("");

      }


      return false;

    }


    console.error(

      "ElevenLabs failed:",

      error

    );


    elevenLabsAvailable =
      false;


    setApiState(

      "bad",

      `${error.message} — using device speech`

    );


    setStatus(

      "⚠ ElevenLabs failed — switching to DEVICE VOICE"

    );


    // ========================================================
    // DEVICE FALLBACK
    // ========================================================

    return await speakWithDeviceVoice(
      text
    );

  }

}


// ============================================================
// AFFIRMATIONS
// ============================================================

function getNextAffirmation(
  ch
) {

  const idx =
    affirmationIndex[
      ch.name
    ] || 0;


  const text =
    ch.affirmations[
      idx
    ];


  const number =
    idx + 1;


  affirmationIndex[
    ch.name
  ] =
    (
      idx + 1
    ) %
    ch.affirmations.length;


  return {

    text,

    number

  };

}


// ============================================================
// SHOW AFFIRMATION
// ============================================================

function showAffirmation(
  ch,
  text,
  number
) {

  affirmLabel.style.display =
    "block";


  affirmLabel.textContent =

    `Affirmation ${number} of ${ch.affirmations.length}`;


  affirmText.textContent =
    text;


  affirmPanel.classList.remove(
    "empty"
  );


  affirmPanel.style.background =
    ch.color + "33";


  const card =
    document.querySelector(

      `.card[data-name="${ch.name}"]`

    );


  if (
    card
  ) {

    const el =
      card.querySelector(
        "[data-affirm]"
      );


    if (
      el
    ) {

      el.textContent =
        text;

    }

  }

}


// ============================================================
// CLEAR AFFIRMATION
// ============================================================

function clearAffirmation() {

  affirmLabel.style.display =
    "none";


  affirmText.textContent =
    "Select a chakra to begin";


  affirmPanel.classList.add(
    "empty"
  );


  affirmPanel.style.background =
    "#1a1a22";

    .querySelectorAll(

    )
    .forEach(

}


// ============================================================
// SINGLE CHAKRA TAP
// ============================================================

async function handleCardTap(
  ch
) {

  ensureAudio();


  if (
    isPlayingAll
  ) {

    stopPlayAll(
      false
    );

  }


  stopVoice(
    false
  );


  const {

    text,

    number

  } =
    getNextAffirmation(
      ch
    );


  showAffirmation(

    ch,

    text,

    number

  );


  playTone(
    ch
  );


  await speakWithElevenLabs(
    text
  );

}


// ============================================================
// WAIT
// ============================================================

function wait(
  milliseconds
) {

  return new Promise(
    resolve => {

      setTimeout(

        resolve,

        milliseconds

      );

    }
  );

}


// ============================================================
// STOP PLAY ALL
// ============================================================

function stopPlayAll(
  clearPanel = true
) {

  journeyId++;


  isPlayingAll =
    false;


  currentPlayAllIndex =
    0;


  playAllBtn.textContent =
    "Play All";


  stopVoice(
    false
  );


  stopTone(
    true
  );


  if (
    clearPanel
  ) {

    clearAffirmation();

  }


  setStatus("");

}


// ============================================================
// PLAY ALL
// ============================================================

async function playAllSequence() {

  const thisJourney =
    journeyId;


  while (

    isPlayingAll &&

    thisJourney ===
      journeyId &&

    currentPlayAllIndex <
      CHAKRAS.length

  ) {

    const ch =
      CHAKRAS[
        currentPlayAllIndex
      ];


    const {

      text,

      number

    } =
      getNextAffirmation(
        ch
      );


    showAffirmation(

      ch,

      text,

      number

    );


    playTone(
      ch
    );


    setStatus(

      `Chakra ${currentPlayAllIndex + 1} of ${CHAKRAS.length} • generating voice`

    );


    // ========================================================
    // WAIT FOR THE ENTIRE AFFIRMATION
    // ========================================================

    const completed =
      await speakWithElevenLabs(
        text
      );


    // ========================================================
    // STOP CHECK
    // ========================================================

    if (

      !isPlayingAll ||

      thisJourney !==
        journeyId

    ) {

      return;

    }


    if (
      !completed
    ) {

      console.warn(
        "Speech did not report successful completion."
      );

    }


    restoreToneVolume();


    // ========================================================
    // MEDITATION PAUSE
    // ========================================================

    setStatus(

      `Chakra ${currentPlayAllIndex + 1} of ${CHAKRAS.length} • Pause`

    );


    await wait(
      1400
    );


    if (

      !isPlayingAll ||

      thisJourney !==
        journeyId

    ) {

      return;

    }


    currentPlayAllIndex++;

  }


  // ==========================================================
  // COMPLETE
  // ==========================================================

  if (

    isPlayingAll &&

    thisJourney ===
      journeyId

  ) {

    isPlayingAll =
      false;


    currentPlayAllIndex =
      0;


    playAllBtn.textContent =
      "Play All";


    stopVoice(
      false
    );


    stopTone(
      true
    );


    setStatus(
      "Journey complete"
    );


    setTimeout(
      () => {

        if (
          !isPlayingAll
        ) {

          setStatus("");

        }

      },

      3000
    );

  }

}


// ============================================================
// PLAY ALL BUTTON
// ============================================================

playAllBtn.addEventListener(

  "click",

  async () => {

    ensureAudio();


    if (
      isPlayingAll
    ) {

      stopPlayAll();

      return;

    }


    journeyId++;


    isPlayingAll =
      true;


    currentPlayAllIndex =
      0;


    playAllBtn.textContent =
      "Stop Journey";


    // ========================================================
    // VERIFY ELEVENLABS FIRST
    // ========================================================

    if (
      !elevenLabsAvailable
    ) {

      await checkElevenLabsAPI(
        true
      );

    }


    if (
      !isPlayingAll
    ) {

      return;

    }


    playAllSequence();

  }

);


// ============================================================
// STOP BUTTON
// ============================================================

stopBtn.addEventListener(

  "click",

  () => {

    stopPlayAll(
      true
    );

  }

);


// ============================================================
// CHECK API BUTTON
// ============================================================

checkApiButton.addEventListener(

  "click",

  async () => {

    elevenLabsAvailable =
      false;


    await checkElevenLabsAPI(
      true
    );

  }

);


// ============================================================
// VOICE VOLUME
// ============================================================

voiceVolumeSlider.addEventListener(

  "input",

  event => {

    voiceVolume =
      parseFloat(
        event.target.value
      );


    voiceVolumeValue.textContent =

      `${Math.round(
        voiceVolume * 100
      )}%`;


    if (
      currentAudio
    ) {

      currentAudio.volume =
        voiceVolume;

    }

  }

);


// ============================================================
// TONE VOLUME
// ============================================================

toneVolumeSlider.addEventListener(

  "input",

  event => {

    toneVolume =
      parseFloat(
        event.target.value
      );


    toneVolumeValue.textContent =

      `${Math.round(
        toneVolume * 100
      )}%`;


    if (

      currentTone &&

      toneEnabled

    ) {

      if (
        isSpeaking
      ) {

        updateToneVolume(

          toneVolume * 0.24,

          0.05

        );

      }

      else {

        updateToneVolume(

          toneVolume,

          0.05

        );

      }

    }

  }

);


// ============================================================
// TONE ON / OFF
// ============================================================

toneToggle.addEventListener(

  "change",

  event => {

    toneEnabled =
      event.target.checked;


    if (
      !toneEnabled
    ) {

      stopTone(
        false
      );


      return;

    }


    if (
      activeName
    ) {

      const chakra =
        CHAKRAS.find(

          item =>
            item.name ===
            activeName

        );


      if (
        chakra
      ) {

        playTone(
          chakra
        );

      }

    }

  }

);


// ============================================================
// VOICE SELECT
// ============================================================

voiceSelect.addEventListener(

  "change",

  async event => {

    stopVoice(
      false
    );


    VOICE_ID =
      event.target.value;


    elevenLabsAvailable =
      false;


    verifiedVoiceName =
      "";


    verifiedModel =
      false;


    setApiState(

      "checking",

      "Verifying selected ElevenLabs voice…"

    );


    await checkElevenLabsAPI(
      true
    );

  }

);


// ============================================================
// IOS AUDIO UNLOCK
// ============================================================

document.body.addEventListener(

  "touchstart",

  ensureAudio,

  {

    once:
      true,

    passive:
      true

  }

);


document.body.addEventListener(

  "click",

  ensureAudio,

  {

    once:
      true

  }

);


// ============================================================
// RETURNING TO APP
// ============================================================

document.addEventListener(

  "visibilitychange",

  () => {

    if (

      document.visibilityState ===
      "visible"

    ) {

      ensureAudio();

    }

  }

);


// ============================================================
// INITIAL API CHECK
// ============================================================
//
// This checks ElevenLabs shortly after the page loads.
// It does NOT play audio.
//
// ============================================================

window.addEventListener(

  "load",

  () => {

    setTimeout(

      () => {

        checkElevenLabsAPI(
          false
        );

      },

      350

    );

  }

);

</script>

</body>
</html>
