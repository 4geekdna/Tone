<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chakra Tones">
  <meta name="theme-color" content="#0f0f12">
  
  <title>Chakra Tone Player</title>
  
  <style>
    :root {
      --bg: #0f0f12;
      --card-radius: 16px;
      --text: #ffffff;
      --muted: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      gap: 10px;
      max-width: 480px;
      margin: 0 auto 16px;
    }

    .card {
      border-radius: var(--card-radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid transparent;
    }

    .card:active { transform: scale(0.98); }

    .card.playing {
      border-color: rgba(255,255,255,0.75);
      filter: brightness(1.25);
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 650;
      margin-bottom: 2px;
    }

    .card-meta {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .card-affirmation {
      font-size: 0.88rem;
      font-style: italic;
      opacity: 0.95;
      line-height: 1.35;
      min-height: 1.3em;
    }

    .affirmation-panel {
      max-width: 480px;
      margin: 0 auto 18px;
      background: #1a1a22;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .affirmation-panel.empty {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .affirmation-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .affirmation-text {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .controls {
      max-width: 480px;
      margin: 0 auto;
      background: #1a1a20;
      border-radius: 16px;
      padding: 16px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 65px;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #333;
      border-radius: 3px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
    }

    .switch {
      position: relative;
      width: 48px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #333;
      border-radius: 28px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider { background: #4caf50; }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      padding: 13px 10px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    .btn-playall { background: #1565c0; }
    .btn-stop { background: #b71c1c; }
    .btn:active { opacity: 0.85; }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 0.78rem;
      color: #555;
    }

    .status {
      text-align: center;
      font-size: 0.8rem;
      color: #888
