<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chakra Tones">
  <meta name="theme-color" content="#0f0f12">
  <title>Chakra Tone Player</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card-radius: 16px;
      --text: #ffffff;
      --muted: #a0a0b0;
      --panel: #1a1a20;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    .header { text-align: center; margin-bottom: 18px; }
    .header h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .header p { color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; gap: 10px; max-width: 480px; margin: 0 auto 14px; }
    .card {
      border-radius: var(--card-radius);
      padding: 13px 15px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.3s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid transparent;
    }
    .card:active { transform: scale(0.98); }
    .card.playing {
      border-color: rgba(255,255,255,0.78);
      filter: brightness(1.20) saturate(1.06);
      box-shadow: 0 0 14px rgba(255,255,255,0.15), 0 0 30px rgba(255,255,255,0.08);
      animation: breatheCard 5s ease-in-out infinite;
    }
    @keyframes breatheCard {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.012); }
    }
    .card-name { font-size: 1.08rem; font-weight: 650; margin-bottom: 2px; }
    .card-meta { font-size: 0.78rem; opacity: 0.85; margin-bottom: 3px; }
    .card-affirmation { font-size: 0.86rem; font-style: italic; opacity: 0.95; line-height: 1.35; min-height: 1.2em; }
    .affirmation-panel {
      max-width: 480px; margin: 0 auto 14px;
      background: #1a1a22; border-radius: 14px; padding: 14px 16px;
      text-align: center; min-height: 78px;
      display: flex; flex-direction: column; justify-content: center;
      transition: background 0.3s ease;
    }
    .affirmation-panel.empty { color: var(--muted); font-size: 0.95rem; }
    .affirmation-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
    .affirmation-text { font-size: 1.02rem; font-weight: 500; line-height: 1.4; }
    .controls {
      max-width: 480px; margin: 0 auto;
      background: var(--panel); border-radius: 16px; padding: 14px 16px;
    }
    .control-row { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
    .control-row:last-of-type { margin-bottom: 8px; }
    .control-label { font-size: 0.88rem; color: var(--muted); min-width: 76px; }
    .unit { min-width: 32px; text-align: left; color: #888; font-size: 0.78rem; }
    .volume-value { min-width: 40px; text-align: right; color: #c6c6d0; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    input[type="range"] {
      flex: 1; height: 6px; -webkit-appearance: none; appearance: none;
      background: #333; border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 21px; height: 21px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    select, input[type="password"], input[type="text"], input[type="number"] {
      flex: 1; background: #2a2a32; color: white;
      border: 1px solid #444; border-radius: 8px;
      padding: 8px 10px; font-size: 0.9rem; min-width: 0;
    }
    input[type="number"] { max-width: 90px; }
    input[type="password"]::placeholder { color: #777; }
    .switch { position: relative; width: 46px; height: 26px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #333; border-radius: 26px; transition: 0.2s;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: #4caf50; }
    input:checked + .slider:before { transform: translateX(20px); }
    .switch-description { color: var(--muted); font-size: 0.88rem; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .btn {
      padding: 12px 10px; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; color: white;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-playall { background: #1565c0; }
    .btn-stop { background: #b71c1c; }
    .btn:active { opacity: 0.85; transform: scale(0.985); }
    .status { text-align: center; font-size: 0.84rem; color: #aaa; margin-top: 10px; min-height: 1.3em; }
    .footer { text-align: center; margin-top: 18px; font-size: 0.76rem; color: #555; }
    @media (prefers-reduced-motion: reduce) {
      .card.playing { animation: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Chakra Tone Player</h1>
    <p>Click to toggle • Smooth crossfades • Custom seconds</p>
  </div>

  <div class="grid" id="chakraGrid"></div>

  <div class="affirmation-panel empty" id="affirmationPanel">
    <div class="affirmation-label" id="affirmLabel" style="display:none;">Current Affirmation</div>
    <div class="affirmation-text" id="affirmText">Tap chakras to turn tones on / off</div>
  </div>

  <div class="controls">
    <div class="control-row">
      <label class="control-label" for="voiceSelect">Voice</label>
      <select id="voiceSelect">
        <option value="EXAVITQu4vr4xnSDxMaL">Sarah – Mature & Reassuring</option>
        <option value="cgSgspJ2msm6clMCkdW9">Jessica – Bright & Warm</option>
        <option value="pFZP5JQG7iQjIQuC4Bku">Lily – Soft & Velvety</option>
        <option value="nPczCjzI2devNBz1zQrb">Brian – Deep & Resonant</option>
        <option value="JBFqnCBsd6RMkjVDRZzb">George – Warm Storyteller</option>
      </select>
    </div>

    <div class="control-row">
      <label class="control-label" for="apiKeyInput">API Key</label>
      <input type="password" id="apiKeyInput" placeholder="Paste ElevenLabs API key here" autocomplete="off" spellcheck="false" />
    </div>

    <!-- Free-entry number fields -->
    <div class="control-row">
      <label class="control-label" for="durationInput">Duration</label>
      <input type="number" id="durationInput" min="10" max="180" step="1" value="30" />
      <span class="unit">sec</span>
    </div>

    <div class="control-row">
      <label class="control-label" for="mantraCount">Mantras</label>
      <select id="mantraCount">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="control-row">
      <label class="control-label" for="mantraGapInput">Mantra Gap</label>
      <input type="number" id="mantraGapInput" min="0" max="20" step="0.5" value="2" />
      <span class="unit">sec</span>
    </div>

    <div class="control-row">
      <label class="control-label" for="overlapInput">Overlap</label>
      <input type="number" id="overlapInput" min="0" max="30" step="1" value="7" />
      <span class="unit">sec</span>
    </div>

    <div class="control-row">
      <label class="control-label" for="toneStyle">Tone Style</label>
      <select id="toneStyle">
        <option value="enhanced" selected>Enhanced</option>
        <option value="pure">Pure Tone</option>
        <option value="bowl">Singing Bowl</option>
      </select>
    </div>

    <div class="control-row">
      <label class="control-label" for="voiceVolume">Voice</label>
      <input type="range" id="voiceVolume" min="0" max="1" step="0.01" value="0.80" />
      <span class="volume-value" id="voiceVolumeValue">80%</span>
    </div>

    <div class="control-row">
      <label class="control-label" for="toneVolume">Tone</label>
      <input type="range" id="toneVolume" min="0" max="1" step="0.01" value="0.28" />
      <span class="volume-value" id="toneVolumeValue">28%</span>
    </div>

    <div class="control-row">
      <span class="control-label">Tone</span>
      <label class="switch">
        <input type="checkbox" id="toneToggle" checked />
        <span class="slider"></span>
      </label>
      <span class="switch-description">Play tones</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-playall" id="playAll" type="button">Play All</button>
      <button class="btn btn-stop" id="stopAll" type="button">Stop All</button>
    </div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div class="footer">Custom seconds • Matched linear crossfade</div>

  <script>
    "use strict";

    // ============================================================
    // SETTINGS
    // ============================================================
    let ELEVENLABS_API_KEY = "";
    let VOICE_ID = "EXAVITQu4vr4xnSDxMaL";
    let durationPerChakra = 30;
    let mantrasPerChakra  = 2;
    let mantraGapSeconds  = 2;
    let overlapSeconds    = 7;
    let toneStyle         = "enhanced";

    // ============================================================
    // CHAKRAS
    // ============================================================
    const CHAKRAS = [
      { name: "Root", sanskrit: "Muladhara", freq: 396, color: "#8B0000", active: "#FF1A1A", note: "C",
        affirmations: ["I am safe, grounded, and secure in my body.","I trust the process of life and feel deeply rooted.","My foundation is strong; I belong here.","I release fear and stand firmly in the present moment.","Abundance flows to me as I remain stable and centered."] },
      { name: "Sacral", sanskrit: "Svadhisthana", freq: 417, color: "#E65100", active: "#FF9100", note: "D",
        affirmations: ["I embrace pleasure and creativity with ease.","My emotions flow freely and healthily.","I honor my desires and allow joy into my life.","I am open to change and the beauty of transformation.","Creativity moves through me effortlessly."] },
      { name: "Solar Plexus", sanskrit: "Manipura", freq: 528, color: "#F9A825", active: "#FFEB3B", note: "E",
        affirmations: ["I am confident, powerful, and in control of my life.","I trust my inner wisdom and take decisive action.","My personal power shines brightly.","I release self-doubt and step into my strength.","I am worthy of success and respect."] },
      { name: "Heart", sanskrit: "Anahata", freq: 639, color: "#2E7D32", active: "#4CAF50", note: "F",
        affirmations: ["I give and receive love freely and unconditionally.","My heart is open, compassionate, and full of gratitude.","I forgive myself and others with ease.","Love is my true nature and guides every action.","I am deeply connected to all living beings."] },
      { name: "Throat", sanskrit: "Vishuddha", freq: 741, color: "#0277BD", active: "#29B6F6", note: "G",
        affirmations: ["I speak my truth with clarity and confidence.","My voice is powerful and my words create positive change.","I express myself authentically and listen deeply.","Communication flows easily between me and others.","I am heard, understood, and respected."] },
      { name: "Third Eye", sanskrit: "Ajna", freq: 852, color: "#283593", active: "#5C6BC0", note: "A",
        affirmations: ["I trust my intuition and inner vision.","Clarity and insight guide my path.","I see beyond illusion and perceive the truth.","My mind is clear, focused, and open to wisdom.","I am connected to my higher guidance."] },
      { name: "Crown", sanskrit: "Sahasrara", freq: 963, color: "#6A1B9A", active: "#AB47BC", note: "B",
        affirmations: ["I am one with the divine and infinite consciousness.","Divine wisdom flows through me effortlessly.","I am connected to pure awareness and universal love.","My spirit is free, expansive, and luminous.","I surrender to the highest good and trust the universe."] }
    ];

    // ============================================================
    // STATE
    // ============================================================
    let audioCtx = null;
    let toneEnabled = true;
    let toneVolume = 0.28;
    let voiceVolume = 0.80;
    let activeTones = {};
    let currentVoiceSource = null;
    let currentVoiceGain = null;
    let currentVoiceResolve = null;
    let speechController = null;
    let currentUtterance = null;
    let isSpeaking = false;
    let isPlayingAll = false;
    let sessionToken = 0;

    const affirmationIndex = {};
    CHAKRAS.forEach(ch => { affirmationIndex[ch.name] = 0; });

    // ============================================================
    // DOM
    // ============================================================
    const grid              = document.getElementById("chakraGrid");
    const voiceVolumeSlider = document.getElementById("voiceVolume");
    const toneVolumeSlider  = document.getElementById("toneVolume");
    const voiceVolumeValue  = document.getElementById("voiceVolumeValue");
    const toneVolumeValue   = document.getElementById("toneVolumeValue");
    const toneToggle        = document.getElementById("toneToggle");
    const voiceSelect       = document.getElementById("voiceSelect");
    const apiKeyInput       = document.getElementById("apiKeyInput");
    const durationInput     = document.getElementById("durationInput");
    const mantraCountSelect = document.getElementById("mantraCount");
    const mantraGapInput    = document.getElementById("mantraGapInput");
    const overlapInput      = document.getElementById("overlapInput");
    const toneStyleSelect   = document.getElementById("toneStyle");
    const stopBtn           = document.getElementById("stopAll");
    const playAllBtn        = document.getElementById("playAll");
    const affirmPanel       = document.getElementById("affirmationPanel");
    const affirmLabel       = document.getElementById("affirmLabel");
    const affirmText        = document.getElementById("affirmText");
    const statusEl          = document.getElementById("status");

    // ============================================================
    // LOAD / SAVE
    // ============================================================
    function loadSettings() {
      ELEVENLABS_API_KEY = localStorage.getItem("chakra_elevenlabs_key") || "";
      if (apiKeyInput) apiKeyInput.value = ELEVENLABS_API_KEY;

      durationPerChakra = clamp(parseFloat(localStorage.getItem("chakra_duration") || "30"), 10, 180);
      mantrasPerChakra  = clamp(parseInt(localStorage.getItem("chakra_mantras") || "2", 10), 1, 5);
      mantraGapSeconds  = clamp(parseFloat(localStorage.getItem("chakra_mantra_gap") || "2"), 0, 20);
      overlapSeconds    = clamp(parseFloat(localStorage.getItem("chakra_overlap") || "7"), 0, 30);
      toneStyle         = localStorage.getItem("chakra_tone_style") || "enhanced";

      durationInput.value   = durationPerChakra;
      mantraCountSelect.value = mantrasPerChakra;
      mantraGapInput.value  = mantraGapSeconds;
      overlapInput.value    = overlapSeconds;
      toneStyleSelect.value = toneStyle;

      if (!ELEVENLABS_API_KEY) setStatus("Paste your ElevenLabs API key above to use natural voice");
    }

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

    function saveApiKey() {
      const val = (apiKeyInput.value || "").trim();
      ELEVENLABS_API_KEY = val;
      localStorage.setItem("chakra_elevenlabs_key", val);
      setStatus(val ? "API key saved" : "API key cleared");
      setTimeout(() => { if (statusEl.textContent.includes("API key")) setStatus(""); }, 1800);
    }

    function saveDuration() {
      durationPerChakra = clamp(parseFloat(durationInput.value) || 30, 10, 180);
      durationInput.value = durationPerChakra;
      localStorage.setItem("chakra_duration", String(durationPerChakra));
    }

    function saveMantraCount() {
      mantrasPerChakra = clamp(parseInt(mantraCountSelect.value, 10) || 2, 1, 5);
      localStorage.setItem("chakra_mantras", String(mantrasPerChakra));
    }

    function saveMantraGap() {
      mantraGapSeconds = clamp(parseFloat(mantraGapInput.value) || 2, 0, 20);
      mantraGapInput.value = mantraGapSeconds;
      localStorage.setItem("chakra_mantra_gap", String(mantraGapSeconds));
    }

    function saveOverlap() {
      overlapSeconds = clamp(parseFloat(overlapInput.value) || 7, 0, 30);
      overlapInput.value = overlapSeconds;
      localStorage.setItem("chakra_overlap", String(overlapSeconds));
    }

    function saveToneStyle() {
      toneStyle = toneStyleSelect.value;
      localStorage.setItem("chakra_tone_style", toneStyle);
      // rebuild active tones with new style
      Object.keys(activeTones).forEach(name => {
        const ch = CHAKRAS.find(c => c.name === name);
        if (ch) {
          const old = activeTones[name];
          delete activeTones[name];
          if (old) fadeOutTone(old, 0.4);
          startTone(ch);
        }
      });
    }

    // ============================================================
    // BUILD CARDS
    // ============================================================
    CHAKRAS.forEach(ch => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.background = ch.color;
      card.dataset.name = ch.name;
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.innerHTML = `
        <div class="card-name">${ch.name} • ${ch.freq} Hz</div>
        <div class="card-meta">${ch.sanskrit} (${ch.note})</div>
        <div class="card-affirmation" data-affirm></div>
      `;
      card.addEventListener("click", () => handleCardTap(ch));
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleCardTap(ch); }
      });
      grid.appendChild(card);
    });

    // ============================================================
    // HELPERS
    // ============================================================
    function setStatus(msg) { statusEl.textContent = msg || ""; }
    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
      }
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function setParamSmooth(param, target, timeConstant = 0.12) {
      if (!audioCtx || !param) return;
      const now = audioCtx.currentTime;
      try {
        if (typeof param.cancelAndHoldAtTime === "function") param.cancelAndHoldAtTime(now);
        else {
          param.cancelScheduledValues(now);
          param.setValueAtTime(param.value, now);
        }
      } catch (_) {}
      param.setTargetAtTime(Math.max(0.0001, target), now, timeConstant);
    }

    // ============================================================
    // CARD VISUALS
    // ============================================================
    function setCardPlaying(ch, isOn) {
      const card = document.querySelector(`.card[data-name="${ch.name}"]`);
      if (!card) return;
      if (isOn) {
        card.classList.add("playing");
        card.style.background = ch.active;
      } else {
        card.classList.remove("playing");
        card.style.background = ch.color;
      }
    }

    function clearAllCardHighlights() {
      document.querySelectorAll(".card").forEach(card => {
        card.classList.remove("playing");
        const orig = CHAKRAS.find(c => c.name === card.dataset.name);
        if (orig) card.style.background = orig.color;
      });
    }

    // ============================================================
    // TONE ENGINE
    // ============================================================
    function getToneLayers(ch) {
      if (toneStyle === "pure") {
        return [
          { frequency: ch.freq, gain: 0.72, detune: 0 },
          { frequency: ch.freq / 2, gain: 0.12, detune: 0 }
        ];
      }
      if (toneStyle === "bowl") {
        return [
          { frequency: ch.freq * 1.00, gain: 0.42, detune: 0 },
          { frequency: ch.freq * 2.00, gain: 0.26, detune: 1.8 },
          { frequency: ch.freq * 3.01, gain: 0.13, detune: -1.2 },
          { frequency: ch.freq * 4.18, gain: 0.07, detune: 3.5 },
          { frequency: ch.freq * 5.35, gain: 0.035, detune: -2.8 },
          { frequency: ch.freq * 0.50, gain: 0.16, detune: 0 }
        ];
      }
      return [
        { frequency: ch.freq, gain: 0.50, detune: 0 },
        { frequency: ch.freq / 2, gain: 0.22, detune: 0 },
        { frequency: ch.freq * 2, gain: 0.045, detune: 0 },
        { frequency: ch.freq, gain: 0.105, detune: 3.5 },
        { frequency: ch.freq, gain: 0.105, detune: -3.5 }
      ];
    }

    function createTone(ch) {
      ensureAudio();
      const now = audioCtx.currentTime;
      const masterGain = audioCtx.createGain();
      const compressor = audioCtx.createDynamicsCompressor();
      masterGain.gain.setValueAtTime(0.0001, now);

      compressor.threshold.value = -24;
      compressor.knee.value = 18;
      compressor.ratio.value = 2.5;
      compressor.attack.value = 0.03;
      compressor.release.value = 0.7;

      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      const layers = getToneLayers(ch);
      const oscillatorNodes = [];

      for (const layer of layers) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(layer.frequency, now);
        osc.detune.setValueAtTime(layer.detune, now);
        gain.gain.setValueAtTime(layer.gain, now);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        oscillatorNodes.push({ osc, gain });
      }

      const lfoDepth = toneStyle === "pure" ? 0.018 : 0.035;
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(0.085, now);
      lfoGain.gain.setValueAtTime(toneVolume * lfoDepth, now);
      lfo.connect(lfoGain);
      lfoGain.connect(masterGain.gain);
      lfo.start(now);

      return { ch, masterGain, compressor, oscillatorNodes, lfo, lfoGain, disposed: false, style: toneStyle };
    }

    function disposeTone(tone) {
      if (!tone || tone.disposed) return;
      tone.disposed = true;
      for (const item of tone.oscillatorNodes) {
        try { item.osc.disconnect(); } catch (_) {}
        try { item.gain.disconnect(); } catch (_) {}
      }
      try { tone.lfo.disconnect(); } catch (_) {}
      try { tone.lfoGain.disconnect(); } catch (_) {}
      try { tone.masterGain.disconnect(); } catch (_) {}
      try { tone.compressor.disconnect(); } catch (_) {}
    }

    function fadeOutTone(tone, seconds = 0.6) {
      if (!tone || !audioCtx || tone.disposed) return;
      const now = audioCtx.currentTime;
      const endTime = now + Math.max(0.5, seconds);
      try {
        tone.masterGain.gain.cancelScheduledValues(now);
        tone.masterGain.gain.setValueAtTime(Math.max(0.0001, tone.masterGain.gain.value), now);
        tone.masterGain.gain.linearRampToValueAtTime(0.0001, endTime);
      } catch (_) {
        setParamSmooth(tone.masterGain.gain, 0.0001, seconds * 0.3);
      }
      for (const item of tone.oscillatorNodes) {
        try { item.osc.stop(endTime + 0.12); } catch (_) {}
      }
      try { tone.lfo.stop(endTime + 0.12); } catch (_) {}
      window.setTimeout(() => disposeTone(tone), Math.ceil((seconds + 0.3) * 1000));
    }

    function desiredToneLevel() {
      if (!toneEnabled) return 0.0001;
      return isSpeaking ? Math.max(0.0001, toneVolume * 0.18) : Math.max(0.0001, toneVolume);
    }

    function startTone(ch, attackSeconds = 1.1) {
      if (!toneEnabled) return;

      if (activeTones[ch.name] && !activeTones[ch.name].disposed && activeTones[ch.name].style === toneStyle) {
        applyToneVolume();
        setCardPlaying(ch, true);
        return;
      }

      if (activeTones[ch.name]) {
        fadeOutTone(activeTones[ch.name], 0.45);
        delete activeTones[ch.name];
      }

      const tone = createTone(ch);
      activeTones[ch.name] = tone;
      setCardPlaying(ch, true);

      const now = audioCtx.currentTime;
      const target = desiredToneLevel();
      const attack = Math.max(0.6, attackSeconds);

      try {
        tone.masterGain.gain.setValueAtTime(0.0001, now);
        tone.masterGain.gain.linearRampToValueAtTime(target, now + attack);
      } catch (_) {
        setParamSmooth(tone.masterGain.gain, target, attack * 0.3);
      }
    }

    function stopToneFor(ch) {
      const tone = activeTones[ch.name];
      if (tone) {
        fadeOutTone(tone, 0.55);
        delete activeTones[ch.name];
      }
      setCardPlaying(ch, false);
    }

    function stopAllTones() {
      Object.keys(activeTones).forEach(name => fadeOutTone(activeTones[name], 0.5));
      activeTones = {};
      clearAllCardHighlights();
    }

    function applyToneVolume() {
      const level = desiredToneLevel();
      const depth = toneStyle === "pure" ? 0.018 : 0.035;
      Object.values(activeTones).forEach(tone => {
        if (tone.disposed) return;
        setParamSmooth(tone.masterGain.gain, level, isSpeaking ? 0.28 : 0.34);
        setParamSmooth(tone.lfoGain.gain, Math.max(0.0001, toneVolume * depth), 0.22);
      });
    }

    function fadeToneForSpeech() { isSpeaking = true; applyToneVolume(); }
    function restoreToneVolume() { isSpeaking = false; applyToneVolume(); }

    // ============================================================
    // VOICE ENGINE (unchanged core)
    // ============================================================
    function resolveCurrentVoice(result) {
      if (!currentVoiceResolve) return;
      const r = currentVoiceResolve;
      currentVoiceResolve = null;
      r(result);
    }

    function cleanupVoiceNodes() {
      if (currentVoiceSource) {
        currentVoiceSource.onended = null;
        try { currentVoiceSource.disconnect(); } catch (_) {}
        currentVoiceSource = null;
      }
      if (currentVoiceGain) {
        try { currentVoiceGain.disconnect(); } catch (_) {}
        currentVoiceGain = null;
      }
    }

    function stopVoice(restoreTone = true) {
      if (speechController) { try { speechController.abort(); } catch (_) {} speechController = null; }
      if (currentVoiceSource && audioCtx) {
        const source = currentVoiceSource;
        const gain = currentVoiceGain;
        const now = audioCtx.currentTime;
        if (gain) {
          try {
            gain.gain.cancelScheduledValues(now);
            gain.gain.setValueAtTime(Math.max(0.0001, gain.gain.value), now);
            gain.gain.linearRampToValueAtTime(0.0001, now + 0.09);
          } catch (_) {}
        }
        source.onended = null;
        window.setTimeout(() => {
          try { source.stop(); } catch (_) {}
          try { source.disconnect(); } catch (_) {}
          try { if (gain) gain.disconnect(); } catch (_) {}
        }, 100);
        currentVoiceSource = null;
        currentVoiceGain = null;
      }
      if (currentUtterance) {
        currentUtterance.onend = null;
        currentUtterance.onerror = null;
        currentUtterance = null;
      }
      try { speechSynthesis.cancel(); } catch (_) {}
      resolveCurrentVoice(false);
      isSpeaking = false;
      if (restoreTone) restoreToneVolume();
    }

    async function decodeAudioBlob(blob) {
      ensureAudio();
      const ab = await blob.arrayBuffer();
      return await new Promise((resolve, reject) => {
        const copy = ab.slice(0);
        const res = audioCtx.decodeAudioData(copy, d => resolve(d), e => reject(e));
        if (res && typeof res.then === "function") res.then(resolve).catch(reject);
      });
    }

    function playDecodedVoice(buffer) {
      return new Promise(resolve => {
        ensureAudio();
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;
        const fadeIn = Math.min(0.12, Math.max(0.08, buffer.duration * 0.06));
        const fadeOut = Math.min(0.16, Math.max(0.1, buffer.duration * 0.09));

        source.buffer = buffer;
        gain.gain.setValueAtTime(0.0001, now);
        try {
          gain.gain.linearRampToValueAtTime(Math.max(0.0001, voiceVolume), now + fadeIn);
          if (buffer.duration > fadeIn + fadeOut + 0.05) {
            const startFade = now + Math.max(fadeIn, buffer.duration - fadeOut);
            gain.gain.setValueAtTime(Math.max(0.0001, voiceVolume), startFade);
            gain.gain.linearRampToValueAtTime(0.0001, now + buffer.duration);
          }
        } catch (_) { gain.gain.value = voiceVolume; }

        source.connect(gain);
        gain.connect(audioCtx.destination);
        currentVoiceSource = source;
        currentVoiceGain = gain;
        currentVoiceResolve = resolve;
        fadeToneForSpeech();

        source.onended = () => {
          if (currentVoiceSource !== source) return;
          cleanupVoiceNodes();
          currentVoiceResolve = null;
          restoreToneVolume();
          setStatus("");
          resolve(true);
        };

        try { source.start(now); }
        catch (err) {
          cleanupVoiceNodes();
          currentVoiceResolve = null;
          restoreToneVolume();
          resolve(false);
        }
      });
    }

    function speakWithDeviceVoice(text) {
      return new Promise(resolve => {
        stopVoice(false);
        const utt = new SpeechSynthesisUtterance(text);
        currentUtterance = utt;
        currentVoiceResolve = resolve;
        utt.rate = 0.88; utt.pitch = 1.0; utt.volume = voiceVolume;
        fadeToneForSpeech();
        setStatus("Using device voice...");
        const finish = ok => {
          if (currentUtterance !== utt) return;
          currentUtterance = null;
          currentVoiceResolve = null;
          restoreToneVolume();
          setStatus("");
          resolve(ok);
        };
        utt.onend = () => finish(true);
        utt.onerror = () => finish(false);
        try { speechSynthesis.speak(utt); } catch (e) { finish(false); }
      });
    }

    async function speakWithElevenLabs(text, statusPrefix = "") {
      stopVoice(false);
      ensureAudio();
      if (!ELEVENLABS_API_KEY) {
        setStatus("No API key – using device voice");
        return await speakWithDeviceVoice(text);
      }
      const controller = new AbortController();
      speechController = controller;
      setStatus(statusPrefix ? `${statusPrefix} • Generating...` : "Generating voice...");
      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Accept": "audio/mpeg",
            "Content-Type": "application/json",
            "xi-api-key": ELEVENLABS_API_KEY
          },
          body: JSON.stringify({
            text,
            model_id: "eleven_multilingual_v2",
            voice_settings: { stability: 0.50, similarity_boost: 0.75 }
          })
        });
        if (!response.ok) throw new Error(`ElevenLabs ${response.status}`);
        const blob = await response.blob();
        if (controller.signal.aborted) return false;
        const buffer = await decodeAudioBlob(blob);
        if (controller.signal.aborted) return false;
        speechController = null;
        setStatus(statusPrefix ? `${statusPrefix} • Speaking...` : "Speaking...");
        return await playDecodedVoice(buffer);
      } catch (err) {
        if (err.name === "AbortError" || controller.signal.aborted) { setStatus(""); return false; }
        speechController = null;
        return await speakWithDeviceVoice(text);
      }
    }

    // ============================================================
    // AFFIRMATIONS
    // ============================================================
    function getNextAffirmation(ch) {
      const idx = affirmationIndex[ch.name] || 0;
      const text = ch.affirmations[idx];
      const number = idx + 1;
      affirmationIndex[ch.name] = (idx + 1) % ch.affirmations.length;
      return { text, number };
    }

    function showAffirmation(ch, text, number) {
      affirmLabel.style.display = "block";
      affirmLabel.textContent = `Affirmation ${number} of ${ch.affirmations.length}`;
      affirmText.textContent = text;
      affirmPanel.classList.remove("empty");
      affirmPanel.style.background = ch.color + "33";
      const card = document.querySelector(`.card[data-name="${ch.name}"]`);
      if (card) {
        const el = card.querySelector("[data-affirm]");
        if (el) el.textContent = text;
      }
    }

    function clearAffirmation() {
      affirmLabel.style.display = "none";
      affirmText.textContent = "Tap chakras to turn tones on / off";
      affirmPanel.classList.add("empty");
      affirmPanel.style.background = "#1a1a22";
      document.querySelectorAll("[data-affirm]").forEach(el => el.textContent = "");
    }

    // ============================================================
    // TOGGLE
    // ============================================================
    async function handleCardTap(ch) {
      ensureAudio();
      if (activeTones[ch.name] && !activeTones[ch.name].disposed) {
        stopToneFor(ch);
        if (Object.keys(activeTones).length === 0) {
          clearAffirmation();
          setStatus("");
        }
        return;
      }
      startTone(ch);
      for (let m = 0; m < mantrasPerChakra; m++) {
        const { text, number } = getNextAffirmation(ch);
        showAffirmation(ch, text, number);
        const label = `Mantra ${m + 1}/${mantrasPerChakra}`;
        const ok = await speakWithElevenLabs(text, label);
        if (!ok) break;
        if (m < mantrasPerChakra - 1) {
          setStatus(`${label} • Pause`);
          await wait(mantraGapSeconds * 1000);
        }
      }
      setStatus("");
    }

    // ============================================================
    // PLAY ALL – matched linear crossfade
    // ============================================================
    function stopEverything(clearPanel = true) {
      sessionToken++;
      isPlayingAll = false;
      playAllBtn.textContent = "Play All";
      stopVoice(false);
      stopAllTones();
      if (clearPanel) clearAffirmation();
      setStatus("");
    }

    async function playAllSequence(token) {
      for (let i = 0; i < CHAKRAS.length; i++) {
        if (!isPlayingAll || token !== sessionToken) return;

        const ch = CHAKRAS[i];
        const isLast = i === CHAKRAS.length - 1;
        const label = `Chakra ${i + 1}/${CHAKRAS.length}`;
        const startTime = performance.now();

        startTone(ch, 1.2);

        // Mantras
        for (let m = 0; m < mantrasPerChakra; m++) {
          if (token !== sessionToken) return;
          const { text, number } = getNextAffirmation(ch);
          showAffirmation(ch, text, number);
          const mLabel = `${label} • Mantra ${m + 1}/${mantrasPerChakra}`;
          const ok = await speakWithElevenLabs(text, mLabel);
          if (!ok || token !== sessionToken) return;
          if (m < mantrasPerChakra - 1) {
            setStatus(`${mLabel} • Pause`);
            await wait(mantraGapSeconds * 1000);
            if (token !== sessionToken) return;
          }
        }

        const elapsed = performance.now() - startTime;
        let remaining = Math.max(0, durationPerChakra * 1000 - elapsed);

        if (!isLast && overlapSeconds > 0) {
          const blend = Math.max(1.5, overlapSeconds);
          const blendMs = blend * 1000;
          const holdBefore = Math.max(0, remaining - blendMs);

          if (holdBefore > 200) {
            setStatus(`${label} • Holding...`);
            await wait(holdBefore);
            if (token !== sessionToken) return;
          }

          // ===== MATCHED LINEAR CROSSFADE =====
          setStatus(`Blending ${ch.name} → ${CHAKRAS[i+1].name} (${blend}s)`);

          const nextCh = CHAKRAS[i + 1];
          const now = audioCtx.currentTime;
          const targetLevel = desiredToneLevel();

          // Fade out current with linear ramp
          if (activeTones[ch.name]) {
            const oldTone = activeTones[ch.name];
            try {
              oldTone.masterGain.gain.cancelScheduledValues(now);
              oldTone.masterGain.gain.setValueAtTime(Math.max(0.0001, oldTone.masterGain.gain.value), now);
              oldTone.masterGain.gain.linearRampToValueAtTime(0.0001, now + blend);
            } catch (_) {}
            // Keep visual & map entry until most of the fade is done
            setTimeout(() => {
              if (activeTones[ch.name] === oldTone) {
                delete activeTones[ch.name];
                setCardPlaying(ch, false);
              }
              // actual stop is handled by the scheduled osc.stop inside fadeOutTone
              // but since we did manual ramp we still call dispose later
              setTimeout(() => disposeTone(oldTone), (blend + 0.3) * 1000);
            }, blendMs * 0.85);
          }

          // Start next tone at silence and linear-ramp up over the same duration
          if (activeTones[nextCh.name]) {
            fadeOutTone(activeTones[nextCh.name], 0.3);
            delete activeTones[nextCh.name];
          }
          const newTone = createTone(nextCh);
          activeTones[nextCh.name] = newTone;
          setCardPlaying(nextCh, true);

          try {
            newTone.masterGain.gain.setValueAtTime(0.0001, now);
            newTone.masterGain.gain.linearRampToValueAtTime(targetLevel, now + blend);
          } catch (_) {
            setParamSmooth(newTone.masterGain.gain, targetLevel, blend * 0.3);
          }

          // Wait through the majority of the blend
          await wait(blendMs * 0.9);
        } else {
          if (remaining > 250) {
            setStatus(`${label} • Holding...`);
            await wait(remaining);
          }
          if (token === sessionToken) stopToneFor(ch);
        }
      }

      if (token === sessionToken) {
        isPlayingAll = false;
        playAllBtn.textContent = "Play All";
        await wait(overlapSeconds > 0 ? overlapSeconds * 400 : 300);
        stopAllTones();
        setStatus("Journey complete");
        setTimeout(() => { if (!isPlayingAll && token === sessionToken) setStatus(""); }, 2800);
      }
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    playAllBtn.addEventListener("click", () => {
      ensureAudio();
      if (isPlayingAll) { stopEverything(true); return; }
      stopEverything(false);
      sessionToken++;
      const token = sessionToken;
      isPlayingAll = true;
      playAllBtn.textContent = "Stop Journey";
      playAllSequence(token);
    });

    stopBtn.addEventListener("click", () => stopEverything(true));

    voiceVolumeSlider.addEventListener("input", e => {
      voiceVolume = parseFloat(e.target.value);
      voiceVolumeValue.textContent = `${Math.round(voiceVolume * 100)}%`;
      if (currentVoiceGain) setParamSmooth(currentVoiceGain.gain, Math.max(0.0001, voiceVolume), 0.06);
    });

    toneVolumeSlider.addEventListener("input", e => {
      toneVolume = parseFloat(e.target.value);
      toneVolumeValue.textContent = `${Math.round(toneVolume * 100)}%`;
      applyToneVolume();
    });

    toneToggle.addEventListener("change", e => {
      toneEnabled = e.target.checked;
      if (!toneEnabled) stopAllTones();
    });

    voiceSelect.addEventListener("change", e => { VOICE_ID = e.target.value; });
    apiKeyInput.addEventListener("change", saveApiKey);
    apiKeyInput.addEventListener("blur", saveApiKey);

    durationInput.addEventListener("change", saveDuration);
    durationInput.addEventListener("blur", saveDuration);
    mantraCountSelect.addEventListener("change", saveMantraCount);
    mantraGapInput.addEventListener("change", saveMantraGap);
    mantraGapInput.addEventListener("blur", saveMantraGap);
    overlapInput.addEventListener("change", saveOverlap);
    overlapInput.addEventListener("blur", saveOverlap);
    toneStyleSelect.addEventListener("change", saveToneStyle);

    // ============================================================
    // INIT
    // ============================================================
    loadSettings();
    document.body.addEventListener("touchstart", ensureAudio, { once: true, passive: true });
    document.body.addEventListener("pointerdown", ensureAudio, { once: true });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") ensureAudio();
    });
  </script>
</body>
</html>
