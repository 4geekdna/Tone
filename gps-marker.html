<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GPS Marker – Favorites + Nearby</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #2d3748;
      --active: #1e3a5f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-bottom: 50px;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 2px; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .coords {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92rem;
      word-break: break-all;
    }
    .row { display: flex; gap: 10px; margin-top: 10px; }
    .stat {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat .value { font-size: 1.15rem; font-weight: 600; }
    .stat .unit { font-size: 0.72rem; color: var(--muted); }
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 10px;
      -webkit-appearance: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.35);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 14px;
      min-height: 1.2em;
    }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--success); }

    .arrow-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90px;
      margin: 6px 0 2px;
    }
    #arrow {
      width: 58px;
      height: 58px;
      transition: transform 0.25s ease-out;
    }

    .marker-item, .nearby-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .marker-item.active { background: var(--active); border-color: var(--accent); }
    .marker-info, .nearby-info { flex: 1; min-width: 0; }
    .marker-name, .nearby-name {
      font-weight: 600;
      font-size: 1.02rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .marker-meta, .nearby-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .marker-actions, .nearby-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn.delete { color: var(--danger); border-color: rgba(239,68,68,0.3); }
    .icon-btn:active { transform: scale(0.93); }

    /* Overlays / sheets */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .sheet {
      background: var(--card);
      border-radius: 20px 20px 16px 16px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 1.1rem;
      color: var(--text);
      margin: 12px 0 16px;
      outline: none;
    }
    .sheet input:focus { border-color: var(--accent); }
    .sheet-buttons { display: flex; gap: 10px; }
    .sheet-buttons .btn { margin-bottom: 0; }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0 8px;
    }
    .cat-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }
    .cat-btn:active { background: var(--accent); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 18px 10px;
      font-size: 0.95rem;
    }
    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 18px 0 10px;
    }
    .footer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 24px;
    }
    .hidden { display: none !important; }
    .loading {
      text-align: center;
      padding: 30px 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>GPS Marker</h1>
  <p class="subtitle">Save spots • find things nearby</p>

  <div id="status">Requesting location permission…</div>

  <!-- Current position -->
  <div class="card">
    <div class="label">Current Location</div>
    <div class="coords" id="currentCoords">—</div>
    <div class="row">
      <div class="stat">
        <div class="value" id="accuracy">—</div>
        <div class="unit">accuracy</div>
      </div>
      <div class="stat">
        <div class="value" id="lastUpdate">—</div>
        <div class="unit">last update</div>
      </div>
    </div>
  </div>

  <!-- Active navigation -->
  <div class="card" id="navCard">
    <div class="label">Navigating To</div>
    <div id="activeName" style="font-weight:600; font-size:1.1rem; margin-bottom:4px;">None selected</div>
    <div class="coords" id="activeCoords" style="margin-bottom:6px;">—</div>
    <div id="navSection" class="hidden">
      <div class="arrow-wrap">
        <svg id="arrow" viewBox="0 0 64 64" fill="none">
          <path d="M32 6 L48 42 L32 34 L16 42 Z" fill="#3b82f6"/>
          <circle cx="32" cy="32" r="4" fill="#e2e8f0"/>
        </svg>
      </div>
      <div class="row">
        <div class="stat">
          <div class="value" id="distance">—</div>
          <div class="unit">distance</div>
        </div>
        <div class="stat">
          <div class="value" id="bearing">—</div>
          <div class="unit">bearing</div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" id="markBtn" disabled>Mark Current Location</button>
  <button class="btn btn-secondary" id="nearbyBtn" disabled>Find Nearby</button>
  <button class="btn btn-secondary" id="mapsBtn" disabled>Open in Maps</button>

  <div class="section-title">Saved Markers</div>
  <div id="markerList"></div>

  <button class="btn btn-danger" id="clearAllBtn" style="margin-top:8px;">Clear All Markers</button>

  <p class="footer">Uses OpenStreetMap data · Works offline after load</p>

  <!-- Name input sheet -->
  <div class="overlay" id="nameOverlay">
    <div class="sheet">
      <div class="label">Name this location</div>
      <input type="text" id="nameInput" placeholder="e.g. Parking, Hotel, Car…" maxlength="40" />
      <div class="sheet-buttons">
        <button class="btn btn-secondary" id="cancelNameBtn" style="flex:1;">Cancel</button>
        <button class="btn btn-primary" id="saveNameBtn" style="flex:1;">Save</button>
      </div>
    </div>
  </div>

  <!-- Nearby category + results sheet -->
  <div class="overlay" id="nearbyOverlay">
    <div class="sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="label" style="margin:0;">Find Nearby</div>
        <button class="icon-btn" id="closeNearbyBtn" style="width:32px;height:32px;">✕</button>
      </div>

      <div id="categoryView">
        <div class="category-grid">
          <button class="cat-btn" data-cat="food">🍽️ Food & Drink</button>
          <button class="cat-btn" data-cat="coffee">☕ Coffee</button>
          <button class="cat-btn" data-cat="fuel">⛽ Gas</button>
          <button class="cat-btn" data-cat="parking">🅿️ Parking</button>
          <button class="cat-btn" data-cat="hotel">🏨 Hotels</button>
          <button class="cat-btn" data-cat="pharmacy">💊 Pharmacy</button>
        </div>
      </div>

      <div id="resultsView" class="hidden">
        <div id="nearbyStatus" class="loading">Searching…</div>
        <div id="nearbyResults"></div>
        <button class="btn btn-secondary" id="backToCatsBtn" style="margin-top:12px;">← Back to categories</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────
    let watchId = null;
    let current = null;
    let markers = [];
    let activeId = null;

    const STORAGE_KEY = "gps-marker-favorites-v1";

    // ── DOM ────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const statusEl      = $("status");
    const currentCoords = $("currentCoords");
    const accuracyEl    = $("accuracy");
    const lastUpdateEl  = $("lastUpdate");
    const activeNameEl  = $("activeName");
    const activeCoords  = $("activeCoords");
    const navSection    = $("navSection");
    const distanceEl    = $("distance");
    const bearingEl     = $("bearing");
    const arrowEl       = $("arrow");
    const markBtn       = $("markBtn");
    const nearbyBtn     = $("nearbyBtn");
    const mapsBtn       = $("mapsBtn");
    const clearAllBtn   = $("clearAllBtn");
    const markerListEl  = $("markerList");
    const nameOverlay   = $("nameOverlay");
    const nameInput     = $("nameInput");
    const saveNameBtn   = $("saveNameBtn");
    const cancelNameBtn = $("cancelNameBtn");
    const nearbyOverlay = $("nearbyOverlay");
    const closeNearbyBtn= $("closeNearbyBtn");
    const categoryView  = $("categoryView");
    const resultsView   = $("resultsView");
    const nearbyStatus  = $("nearbyStatus");
    const nearbyResults = $("nearbyResults");
    const backToCatsBtn = $("backToCatsBtn");

    // ── Helpers ────────────────────────────────────────────
    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = type;
    }
    function fmtCoord(n) { return n.toFixed(6); }
    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function bearingDegrees(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      let θ = Math.atan2(y, x) * 180 / Math.PI;
      return (θ + 360) % 360;
    }
    function cardinal(deg) {
      const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
      return dirs[Math.round(deg / 22.5) % 16];
    }
    function formatDistance(m) {
      if (m < 1000) {
        const ft = m * 3.28084;
        return ft < 10 ? `${ft.toFixed(1)} ft` : `${Math.round(ft)} ft`;
      }
      const mi = m / 1609.344;
      return mi < 10 ? `${mi.toFixed(2)} mi` : `${mi.toFixed(1)} mi`;
    }
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])
      );
    }

    // ── Persistence ────────────────────────────────────────
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ markers, activeId }));
    }
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          markers = data.markers || [];
          activeId = data.activeId || null;
        }
      } catch (e) {}
    }

    // ── UI Updates ─────────────────────────────────────────
    function updateCurrentUI() {
      if (!current) return;
      currentCoords.textContent = `${fmtCoord(current.lat)}, ${fmtCoord(current.lng)}`;
      accuracyEl.textContent = current.accuracy < 1000
        ? `±${Math.round(current.accuracy)} m`
        : `±${(current.accuracy/1000).toFixed(1)} km`;
      lastUpdateEl.textContent = fmtTime(current.time);
      markBtn.disabled = false;
      nearbyBtn.disabled = false;
    }

    function getActiveMarker() {
      return markers.find(m => m.id === activeId) || null;
    }

    function updateActiveUI() {
      const active = getActiveMarker();
      if (!active) {
        activeNameEl.textContent = "None selected";
        activeCoords.textContent = "—";
        navSection.classList.add("hidden");
        mapsBtn.disabled = true;
        return;
      }
      activeNameEl.textContent = active.name;
      activeCoords.textContent = `${fmtCoord(active.lat)}, ${fmtCoord(active.lng)}`;
      navSection.classList.remove("hidden");
      mapsBtn.disabled = false;
      updateNavigation();
    }

    function updateNavigation() {
      const active = getActiveMarker();
      if (!current || !active) return;
      const dist = distanceMeters(current.lat, current.lng, active.lat, active.lng);
      const brg  = bearingDegrees(current.lat, current.lng, active.lat, active.lng);
      distanceEl.textContent = formatDistance(dist);
      bearingEl.textContent  = `${Math.round(brg)}° ${cardinal(brg)}`;
      arrowEl.style.transform = `rotate(${brg}deg)`;
    }

    function renderList() {
      if (markers.length === 0) {
        markerListEl.innerHTML = `<div class="empty-state">No markers saved yet.<br>Tap “Mark Current Location” to add one.</div>`;
        clearAllBtn.style.display = "none";
        return;
      }
      clearAllBtn.style.display = "block";
      const sorted = [...markers].sort((a, b) => b.time - a.time);
      markerListEl.innerHTML = sorted.map(m => {
        let distText = "—";
        if (current) {
          distText = formatDistance(distanceMeters(current.lat, current.lng, m.lat, m.lng));
        }
        const isActive = m.id === activeId;
        return `
          <div class="marker-item ${isActive ? "active" : ""}" data-id="${m.id}">
            <div class="marker-info">
              <div class="marker-name">${escapeHtml(m.name)}</div>
              <div class="marker-meta">${distText} · ${fmtTime(m.time)}</div>
            </div>
            <div class="marker-actions">
              <button class="icon-btn" data-action="nav" title="Navigate">➤</button>
              <button class="icon-btn delete" data-action="del" title="Delete">✕</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function fullRefresh() {
      updateActiveUI();
      renderList();
      save();
    }

    // ── Geolocation ────────────────────────────────────────
    function onPosition(pos) {
      current = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        time: pos.timestamp || Date.now()
      };
      setStatus("Live tracking active", "ok");
      updateCurrentUI();
      updateNavigation();
      renderList();
    }
    function onError(err) {
      let msg = "Location error";
      if (err.code === 1) msg = "Permission denied – enable location for this site";
      else if (err.code === 2) msg = "Position unavailable";
      else if (err.code === 3) msg = "Timeout – trying again…";
      setStatus(msg, "error");
    }
    function startWatch() {
      if (!navigator.geolocation) {
        setStatus("Geolocation not supported", "error");
        return;
      }
      watchId = navigator.geolocation.watchPosition(onPosition, onError, {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 15000
      });
    }

    // ── Nearby (Overpass) ──────────────────────────────────
    const categoryQueries = {
      food: `
        node["amenity"~"restaurant|cafe|fast_food|bar|pub|ice_cream"](around:900,LAT,LON);
        way["amenity"~"restaurant|cafe|fast_food|bar|pub|ice_cream"](around:900,LAT,LON);
      `,
      coffee: `
        node["amenity"="cafe"](around:900,LAT,LON);
        node["cuisine"="coffee_shop"](around:900,LAT,LON);
        way["amenity"="cafe"](around:900,LAT,LON);
      `,
      fuel: `
        node["amenity"="fuel"](around:1500,LAT,LON);
        way["amenity"="fuel"](around:1500,LAT,LON);
      `,
      parking: `
        node["amenity"="parking"](around:800,LAT,LON);
        way["amenity"="parking"](around:800,LAT,LON);
      `,
      hotel: `
        node["tourism"~"hotel|motel|guest_house"](around:1500,LAT,LON);
        way["tourism"~"hotel|motel|guest_house"](around:1500,LAT,LON);
      `,
      pharmacy: `
        node["amenity"="pharmacy"](around:1200,LAT,LON);
        way["amenity"="pharmacy"](around:1200,LAT,LON);
      `
    };

    async function searchNearby(cat) {
      if (!current) return;
      categoryView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      nearbyStatus.textContent = "Searching OpenStreetMap…";
      nearbyStatus.className = "loading";
      nearbyResults.innerHTML = "";

      const query = `
        [out:json][timeout:20];
        (
          ${categoryQueries[cat].replaceAll("LAT", current.lat).replaceAll("LON", current.lng)}
        );
        out center 20;
      `;

      try {
        const res = await fetch("https://overpass-api.de/api/interpreter", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "User-Agent": "GPS-Marker-App/1.0 (personal use)"
          },
          body: "data=" + encodeURIComponent(query)
        });

        if (!res.ok) throw new Error("Network error");

        const data = await res.json();
        const elements = data.elements || [];

        // Normalize to points
        const places = elements.map(el => {
          const lat = el.lat || (el.center && el.center.lat);
          const lon = el.lon || (el.center && el.center.lon);
          if (!lat || !lon) return null;
          const tags = el.tags || {};
          const name = tags.name || tags.brand || tags.operator || "Unnamed";
          const type = tags.amenity || tags.tourism || tags.cuisine || cat;
          return { lat, lon, name, type };
        }).filter(Boolean);

        // Deduplicate roughly by name+rounded coords
        const seen = new Set();
        const unique = places.filter(p => {
          const key = p.name + "|" + p.lat.toFixed(4) + "|" + p.lon.toFixed(4);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });

        // Sort by distance
        unique.forEach(p => {
          p.dist = distanceMeters(current.lat, current.lng, p.lat, p.lon);
        });
        unique.sort((a, b) => a.dist - b.dist);

        if (unique.length === 0) {
          nearbyStatus.textContent = "No results found nearby.";
          nearbyStatus.className = "empty-state";
          return;
        }

        nearbyStatus.textContent = `${unique.length} places found`;
        nearbyStatus.className = "label";
        nearbyResults.innerHTML = unique.slice(0, 15).map(p => `
          <div class="nearby-item">
            <div class="nearby-info">
              <div class="nearby-name">${escapeHtml(p.name)}</div>
              <div class="nearby-meta">${formatDistance(p.dist)} · ${escapeHtml(p.type)}</div>
            </div>
            <div class="nearby-actions">
              <button class="icon-btn" data-lat="${p.lat}" data-lon="${p.lon}" data-name="${escapeHtml(p.name)}" data-action="go" title="Navigate">➤</button>
              <button class="icon-btn" data-lat="${p.lat}" data-lon="${p.lon}" data-name="${escapeHtml(p.name)}" data-action="save" title="Save">＋</button>
            </div>
          </div>
        `).join("");

      } catch (err) {
        console.error(err);
        nearbyStatus.textContent = "Search failed. Try again later.";
        nearbyStatus.className = "empty-state";
      }
    }

    // ── Event listeners ────────────────────────────────────
    markBtn.addEventListener("click", () => {
      if (!current) return;
      nameInput.value = "";
      nameOverlay.classList.add("show");
      setTimeout(() => nameInput.focus(), 80);
    });

    cancelNameBtn.addEventListener("click", () => nameOverlay.classList.remove("show"));
    saveNameBtn.addEventListener("click", () => {
      const name = nameInput.value.trim() || `Spot ${markers.length + 1}`;
      const newMarker = {
        id: uid(),
        name,
        lat: current.lat,
        lng: current.lng,
        accuracy: current.accuracy,
        time: Date.now()
      };
      markers.push(newMarker);
      activeId = newMarker.id;
      nameOverlay.classList.remove("show");
      fullRefresh();
      setStatus(`Saved “${name}”`, "ok");
    });
    nameInput.addEventListener("keydown", e => {
      if (e.key === "Enter") saveNameBtn.click();
    });

    markerListEl.addEventListener("click", e => {
      const item = e.target.closest(".marker-item");
      if (!item) return;
      const id = item.dataset.id;
      const actionBtn = e.target.closest("[data-action]");
      if (actionBtn) {
        const action = actionBtn.dataset.action;
        if (action === "nav") {
          activeId = id;
          fullRefresh();
        } else if (action === "del") {
          if (confirm("Delete this marker?")) {
            markers = markers.filter(m => m.id !== id);
            if (activeId === id) activeId = markers.length ? markers[markers.length - 1].id : null;
            fullRefresh();
          }
        }
      } else {
        activeId = id;
        fullRefresh();
      }
    });

    mapsBtn.addEventListener("click", () => {
      const active = getActiveMarker();
      if (!active) return;
      window.open(`https://maps.apple.com/?daddr=${active.lat},${active.lng}&dirflg=w`, "_blank");
    });

    clearAllBtn.addEventListener("click", () => {
      if (!confirm("Delete ALL saved markers?")) return;
      markers = [];
      activeId = null;
      fullRefresh();
      setStatus("All markers cleared", "ok");
    });

    // Nearby
    nearbyBtn.addEventListener("click", () => {
      if (!current) return;
      categoryView.classList.remove("hidden");
      resultsView.classList.add("hidden");
      nearbyOverlay.classList.add("show");
    });
    closeNearbyBtn.addEventListener("click", () => nearbyOverlay.classList.remove("show"));
    backToCatsBtn.addEventListener("click", () => {
      resultsView.classList.add("hidden");
      categoryView.classList.remove("hidden");
    });

    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => searchNearby(btn.dataset.cat));
    });

    nearbyResults.addEventListener("click", e => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const lat = parseFloat(btn.dataset.lat);
      const lon = parseFloat(btn.dataset.lon);
      const name = btn.dataset.name;

      if (btn.dataset.action === "go") {
        window.open(`https://maps.apple.com/?daddr=${lat},${lon}&dirflg=w`, "_blank");
      } else if (btn.dataset.action === "save") {
        const newMarker = {
          id: uid(),
          name: name || "Nearby place",
          lat, lng: lon,
          accuracy: 30,
          time: Date.now()
        };
        markers.push(newMarker);
        activeId = newMarker.id;
        fullRefresh();
        nearbyOverlay.classList.remove("show");
        setStatus(`Saved “${newMarker.name}”`, "ok");
      }
    });

    // ── Init ───────────────────────────────────────────────
    load();
    fullRefresh();
    startWatch();
  </script>
</body>
</html>
