<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GPS Marker – Google Places Food</title>

  <!-- Google Maps JavaScript API + Places Library -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAshrwRouMRF8QW-3Du0wgSNjjkFnr89yw&libraries=places"></script>

  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #2d3748;
      --active: #1e3a5f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-bottom: 50px;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 2px; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .coords {
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92rem;
      word-break: break-all;
    }
    .row { display: flex; gap: 10px; margin-top: 10px; }
    .stat {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat .value { font-size: 1.15rem; font-weight: 600; }
    .stat .unit { font-size: 0.72rem; color: var(--muted); }
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      -webkit-appearance: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.35);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #status { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; min-height: 1.2em; }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--success); }

    .arrow-wrap { display: flex; justify-content: center; align-items: center; height: 90px; margin: 6px 0 2px; }
    #arrow { width: 58px; height: 58px; transition: transform 0.25s ease-out; }

    .marker-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .marker-item.active { background: var(--active); border-color: var(--accent); }
    .marker-info { flex: 1; min-width: 0; }
    .marker-name {
      font-weight: 600;
      font-size: 1.02rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .marker-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .marker-actions { display: flex; gap: 6px; flex-shrink: 0; }

      border-radius: 10px;
