<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>My Bar v0.7</title>
  <style>
    :root {
      --bg: #0c0d12; --surface: #161822; --border: #2a2e42;
      --text: #f0f1f5; --text-muted: #9ca3af; --accent: #a78bfa;
      --accent-soft: rgba(167,139,250,0.15); --success: #34d399;
      --danger: #f87171; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100dvh;
      padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(167,139,250,0.16), transparent),
        radial-gradient(ellipse 40% 30% at 90% 90%, rgba(244,114,182,0.07), transparent);
    }
    .version-badge {
      position: fixed; top: max(8px, env(safe-area-inset-top)); right: 12px; z-index: 50;
      font-size: 11px; color: #6b7280; background: rgba(12,13,18,0.85);
      padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    }
    .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 18px; }
    .back { display: inline-flex; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 12px; }
    h1 {
      font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px;
      background: linear-gradient(135deg, #e0e7ff, #c4b5fd, #f9a8d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .subtitle { color: var(--text-muted); font-size: 14px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 20px;
    }
    .pick-btn {
      display: block; width: 100%; text-align: center;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff; font-size: 17px; font-weight: 700;
      padding: 18px 16px; border-radius: 14px; border: none;
      cursor: pointer; position: relative; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .pick-btn:active { opacity: 0.88; }
    .pick-btn input[type=file] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; font-size: 20px; cursor: pointer;
    }
    .status {
      margin-top: 14px; text-align: center; font-size: 13px;
      color: var(--text-muted); padding: 10px; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.03);
      line-height: 1.45;
    }
    .status.ok { color: var(--success); border-color: rgba(52,211,153,0.35); }
    .status.error { color: var(--danger); border-color: rgba(248,113,113,0.35); }
    .tip {
      margin-top: 10px; font-size: 12.5px; color: var(--text-muted);
      text-align: center; line-height: 1.45;
    }
    .section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .count {
      background: var(--accent-soft); color: var(--accent);
      font-size: 12px; padding: 2px 9px; border-radius: 999px;
    }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      display: flex; gap: 12px; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px;
    }
    .item img {
      width: 64px; height: 64px; border-radius: 10px;
      object-fit: cover; background: #0a0b10; flex-shrink: 0;
    }
    .item .info { flex: 1; min-width: 0; }
    .item .name-input {
      width: 100%; background: #0f111a; border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; color: var(--text);
      font-size: 15px; font-weight: 650; outline: none;
    }
    .item .name-input:focus { border-color: var(--accent); }
    .item .meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .del {
      width: 36px; height: 36px; border: none; border-radius: 10px;
      background: rgba(255,255,255,0.06); font-size: 16px; cursor: pointer;
      flex-shrink: 0;
    }
    .empty {
      text-align: center; padding: 36px 16px; color: var(--text-muted);
      font-size: 14.5px; background: var(--surface);
      border: 1px dashed var(--border); border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="version-badge">v0.7</div>

  <div class="container">
    <header>
      <a class="back" href="index.html">← Back to Index</a>
      <h1>My Bar</h1>
      <p class="subtitle">Photograph bottles • Build your drink collection</p>
    </header>

    <div class="card">
      <label class="pick-btn">
        📷 Add Photo
        <input type="file" id="photoInput" accept="image/*">
      </label>

      <div class="status" id="status">Tap Add Photo — the picture will be saved to My Collection automatically</div>
      <p class="tip">On iPhone choose <strong>Photo Library</strong> (most reliable) or <strong>Take Photo</strong>.</p>
    </div>

    <div class="section-title">
      <span>My Collection</span>
      <span class="count" id="count">0</span>
    </div>
    <div class="list" id="list">
      <div class="empty" id="empty">🍾<br><br>No bottles yet.<br>Tap <strong>Add Photo</strong> above.</div>
    </div>
  </div>

  <script>
    "use strict";

    var LS_KEY = "tone_bar_v7";
    var input = document.getElementById("photoInput");
    var statusEl = document.getElementById("status");
    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    var countEl = document.getElementById("count");

    var lastKey = "";
    var busy = false;

    function setStatus(msg, type) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">")
        .replace(/"/g, """);
    }

    function loadItems() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return [];
        var arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(items));
        return true;
      } catch (e) {
        // Quota — keep only newest few
        try {
          var trimmed = items.slice(-8);
          localStorage.setItem(LS_KEY, JSON.stringify(trimmed));
          return true;
        } catch (e2) {
          return false;
        }
      }
    }

    function render() {
      var items = loadItems();
      items.sort(function (a, b) {
        return (b.addedAt || "").localeCompare(a.addedAt || "");
      });

      countEl.textContent = String(items.length);
      list.querySelectorAll(".item").forEach(function (el) { el.remove(); });

      if (!items.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      items.forEach(function (it) {
        var el = document.createElement("div");
        el.className = "item";
        el.innerHTML =
          '<img src="' + it.image + '" alt="">' +
          '<div class="info">' +
            '<input class="name-input" data-id="' + esc(it.id) + '" value="' + esc(it.name) + '" placeholder="Bottle name">' +
            '<div class="meta">Tap name to edit</div>' +
          '</div>' +
          '<button class="del" type="button" data-id="' + esc(it.id) + '">🗑️</button>';
        list.appendChild(el);
      });

      list.querySelectorAll(".del").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-id");
          saveItems(loadItems().filter(function (x) { return x.id !== id; }));
          render();
          setStatus("Removed", "ok");
        };
      });

      list.querySelectorAll(".name-input").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var id = inp.getAttribute("data-id");
          var name = (inp.value || "").trim() || "Bottle";
          var items = loadItems();
          for (var i = 0; i < items.length; i++) {
            if (items[i].id === id) {
              items[i].name = name;
              break;
            }
          }
          saveItems(items);
          setStatus('Renamed to “' + name + '”', "ok");
        });
      });
    }

    function addPhoto(dataUrl) {
      var items = loadItems();
      var n = items.length + 1;
      items.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: "Bottle " + n,
        category: "Other",
        image: dataUrl,
        addedAt: new Date().toISOString()
      });

      if (!saveItems(items)) {
        setStatus("Storage full — delete some bottles first", "error");
        return false;
      }

      render();
      setStatus("Saved to My Collection — tap the name to rename", "ok");
      setTimeout(function () {
        list.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
      return true;
    }

    function processFile(file) {
      if (!file || busy) return;

      var key = (file.name || "img") + "|" + file.size + "|" + (file.lastModified || Date.now());
      if (key === lastKey) return;
      lastKey = key;
      busy = true;

      setStatus("Processing photo (" + Math.round(file.size / 1024) + " KB)…");

      var url;
      try { url = URL.createObjectURL(file); }
      catch (e) {
        busy = false;
        setStatus("Could not open photo", "error");
        return;
      }

      var img = new Image();
      img.onload = function () {
        try {
          var max = 480;
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          var dataUrl = c.toDataURL("image/jpeg", 0.6);
          try { URL.revokeObjectURL(url); } catch (e) {}
          addPhoto(dataUrl);
        } catch (e) {
          console.error(e);
          addPhoto(url);
        }
        busy = false;
      };
      img.onerror = function () {
        var reader = new FileReader();
        reader.onload = function (ev) {
          addPhoto(ev.target.result);
          busy = false;
        };
        reader.onerror = function () {
          setStatus("Could not read photo", "error");
          busy = false;
          try { URL.revokeObjectURL(url); } catch (e) {}
        };
        reader.readAsDataURL(file);
      };
      img.src = url;
    }

    function onFiles() {
      var file = input.files && input.files[0];
      if (file) processFile(file);
      // allow selecting same file again later
      try { input.value = ""; } catch (e) {}
    }

    input.addEventListener("change", onFiles);
    input.addEventListener("input", onFiles);

    function recheck() {
      if (input.files && input.files[0]) processFile(input.files[0]);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        setTimeout(recheck, 250);
        setTimeout(recheck, 900);
      }
    });
    window.addEventListener("focus", function () {
      setTimeout(recheck, 250);
    });

    render();
  </script>
</body>
</html>
