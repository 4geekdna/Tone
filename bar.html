<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Bar • Bottle Inventory</title>
  <style>
    :root {
      --bg: #0c0d12;
      --surface: #161822;
      --border: #2a2e42;
      --text: #f0f1f5;
      --text-muted: #9ca3af;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.15);
      --success: #34d399;
      --danger: #f87171;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(167, 139, 250, 0.16), transparent),
        radial-gradient(ellipse 40% 30% at 90% 90%, rgba(244, 114, 182, 0.07), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
    }

    header { text-align: center; margin-bottom: 24px; }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #e0e7ff, #c4b5fd, #f9a8d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle { color: var(--text-muted); font-size: 14px; }

    .capture-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .capture-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: opacity 0.15s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-align: center;
      position: relative;
    }

    .btn:active { opacity: 0.85; transform: scale(0.98); }

    .btn-camera {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
    }

    .btn-gallery {
      background: #1e293b;
      border: 1px solid var(--border);
    }

    .btn input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 0;
    }

    .preview-wrap {
      display: none;
      margin-top: 16px;
    }

    .preview-wrap.active { display: block; }

    .preview-img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 12px;
      background: #0a0b10;
      margin-bottom: 14px;
    }

    .form-row { margin-bottom: 12px; }

    label.field-label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      background: #0f111a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }

    .btn-add {
      width: 100%;
      background: var(--success);
      color: #0c0d12;
      margin-top: 8px;
    }

    .btn-cancel {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-top: 8px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .count {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 999px;
    }

    .drink-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drink-card {
      display: flex;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      align-items: center;
    }

    .drink-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #0a0b10;
      flex-shrink: 0;
    }

    .drink-info { flex: 1; min-width: 0; }

    .drink-name {
      font-weight: 650;
      font-size: 15.5px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drink-meta {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14.5px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-icon { font-size: 36px; margin-bottom: 10px; }

    .status {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 12px;
      min-height: 1.3em;
      word-break: break-word;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--success); }

    .hint {
      font-size: 12.5px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="back" href="index.html">← Back to Index</a>
      <h1>My Bar</h1>
      <p class="subtitle">Photograph bottles • Build your drink collection</p>
    </header>

    <div class="capture-card">
      <div class="capture-buttons">
        <label class="btn btn-camera">
          📷 Take Photo
          <input type="file" id="cameraInput" accept="image/*" capture="environment">
        </label>

        <label class="btn btn-gallery">
          🖼️ From Photos
          <input type="file" id="galleryInput" accept="image/*">
        </label>
      </div>

      <div class="preview-wrap" id="previewWrap">
        <img class="preview-img" id="previewImg" alt="Bottle preview">

        <div class="form-row">
          <label class="field-label" for="drinkName">Drink / Bottle name</label>
          <input type="text" id="drinkName" placeholder="e.g. Grey Goose Vodka, Macallan 12..." list="drinkSuggestions" autocomplete="off">
          <datalist id="drinkSuggestions">
            <option value="Grey Goose Vodka">
            <option value="Belvedere Vodka">
            <option value="Tito's Handmade Vodka">
            <option value="Absolut Vodka">
            <option value="Macallan 12">
            <option value="Glenfiddich 12">
            <option value="Johnnie Walker Black">
            <option value="Jameson Irish Whiskey">
            <option value="Jack Daniel's">
            <option value="Maker's Mark">
            <option value="Hennessy VS">
            <option value="Rémy Martin VSOP">
            <option value="Patrón Silver">
            <option value="Don Julio Blanco">
            <option value="Casamigos Blanco">
            <option value="Bacardi Superior">
            <option value="Captain Morgan">
            <option value="Tanqueray Gin">
            <option value="Bombay Sapphire">
            <option value="Hendrick's Gin">
            <option value="Campari">
            <option value="Aperol">
            <option value="Cointreau">
            <option value="Grand Marnier">
            <option value="Baileys Irish Cream">
            <option value="Kahlúa">
            <option value="Champagne / Prosecco">
            <option value="Red Wine">
            <option value="White Wine">
            <option value="Beer">
          </datalist>
        </div>

        <div class="form-row">
          <label class="field-label" for="drinkCategory">Category</label>
          <select id="drinkCategory">
            <option value="Vodka">Vodka</option>
            <option value="Whiskey / Whisky">Whiskey / Whisky</option>
            <option value="Gin">Gin</option>
            <option value="Rum">Rum</option>
            <option value="Tequila / Mezcal">Tequila / Mezcal</option>
            <option value="Brandy / Cognac">Brandy / Cognac</option>
            <option value="Liqueur">Liqueur</option>
            <option value="Wine">Wine</option>
            <option value="Champagne / Sparkling">Champagne / Sparkling</option>
            <option value="Beer">Beer</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button class="btn btn-add" id="addBtn" type="button">Add to My Bar</button>
        <button class="btn btn-cancel" id="cancelBtn" type="button">Cancel</button>
        <p class="hint">After the photo appears, type a name and tap <strong>Add to My Bar</strong>.</p>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="section-title">
      <span>My Collection</span>
      <span class="count" id="countBadge">0</span>
    </div>

    <div class="drink-list" id="drinkList">
      <div class="empty" id="emptyState">
        <div class="empty-icon">🍾</div>
        <div>No bottles yet.<br>Take or upload a photo, name it, then tap Add.</div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const DB_NAME = "ToneBarDB";
    const DB_VERSION = 1;
    const STORE_NAME = "bottles";

    const cameraInput  = document.getElementById("cameraInput");
    const galleryInput = document.getElementById("galleryInput");
    const previewWrap  = document.getElementById("previewWrap");
    const previewImg   = document.getElementById("previewImg");
    const drinkName    = document.getElementById("drinkName");
    const drinkCategory = document.getElementById("drinkCategory");
    const addBtn       = document.getElementById("addBtn");
    const cancelBtn    = document.getElementById("cancelBtn");
    const drinkList    = document.getElementById("drinkList");
    const emptyState   = document.getElementById("emptyState");
    const countBadge   = document.getElementById("countBadge");
    const statusEl     = document.getElementById("status");

    let currentDataUrl = null;
    let db = null;

    function setStatus(msg, type) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">")
        .replace(/"/g, """);
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      } catch {
        return "";
      }
    }

    function openDB() {
      return new Promise(function (resolve, reject) {
        if (db) return resolve(db);
        var request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = function () { reject(request.error || new Error("DB open failed")); };
        request.onsuccess = function () { db = request.result; resolve(db); };
        request.onupgradeneeded = function (event) {
          var database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
      });
    }

    function getAllItems() {
      return openDB().then(function (database) {
        return new Promise(function (resolve, reject) {
          var tx = database.transaction(STORE_NAME, "readonly");
          var store = tx.objectStore(STORE_NAME);
          var req = store.getAll();
          req.onsuccess = function () { resolve(req.result || []); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function addItemToDB(item) {
      return openDB().then(function (database) {
        return new Promise(function (resolve, reject) {
          var tx = database.transaction(STORE_NAME, "readwrite");
          var store = tx.objectStore(STORE_NAME);
          var req = store.add(item);
          req.onsuccess = function () { resolve(item); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function deleteItemFromDB(id) {
      return openDB().then(function (database) {
        return new Promise(function (resolve, reject) {
          var tx = database.transaction(STORE_NAME, "readwrite");
          var store = tx.objectStore(STORE_NAME);
          var req = store.delete(id);
          req.onsuccess = function () { resolve(); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function renderList() {
      getAllItems()
        .then(function (items) {
          items.sort(function (a, b) {
            return (b.addedAt || "").localeCompare(a.addedAt || "");
          });

          countBadge.textContent = items.length;
          drinkList.querySelectorAll(".drink-card").forEach(function (el) { el.remove(); });

          if (items.length === 0) {
            emptyState.style.display = "block";
            return;
          }

          emptyState.style.display = "none";

          items.forEach(function (item) {
            var card = document.createElement("div");
            card.className = "drink-card";
            card.innerHTML =
              '<img class="drink-thumb" src="' + item.image + '" alt="' + escapeHtml(item.name) + '">' +
              '<div class="drink-info">' +
                '<div class="drink-name">' + escapeHtml(item.name) + '</div>' +
                '<div class="drink-meta">' + escapeHtml(item.category) + ' · ' + formatDate(item.addedAt) + '</div>' +
              '</div>' +
              '<button class="icon-btn delete" data-id="' + escapeHtml(item.id) + '" type="button">🗑️</button>';
            drinkList.appendChild(card);
          });

          drinkList.querySelectorAll(".icon-btn.delete").forEach(function (btn) {
            btn.addEventListener("click", function () {
              removeItem(btn.getAttribute("data-id"));
            });
          });
        })
        .catch(function (err) {
          console.error(err);
          setStatus("Could not load collection", "error");
        });
    }

    function showPreview(dataUrl) {
      currentDataUrl = dataUrl;
      previewImg.onload = function () {
        previewWrap.classList.add("active");
        setStatus("Photo ready — enter a name, then tap Add", "ok");
        setTimeout(function () { drinkName.focus(); }, 100);
      };
      previewImg.onerror = function () {
        setStatus("Preview failed to display", "error");
      };
      previewImg.src = dataUrl;
      drinkName.value = "";
    }

    function hidePreview() {
      currentDataUrl = null;
      previewWrap.classList.remove("active");
      previewImg.removeAttribute("src");
      setStatus("");
    }

    function addItem() {
      var name = (drinkName.value || "").trim();
      if (!name) {
        setStatus("Please enter a drink name first", "error");
        drinkName.focus();
        return;
      }
      if (!currentDataUrl) {
        setStatus("No photo selected", "error");
        return;
      }

      addBtn.disabled = true;
      setStatus("Saving…");

      var item = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        name: name,
        category: drinkCategory.value,
        image: currentDataUrl,
        addedAt: new Date().toISOString()
      };

      addItemToDB(item)
        .then(function () {
          hidePreview();
          renderList();
          setStatus('Saved “' + name + '”', "ok");
          setTimeout(function () { setStatus(""); }, 2500);
        })
        .catch(function (err) {
          console.error(err);
          setStatus("Save failed — try again", "error");
        })
        .finally(function () {
          addBtn.disabled = false;
        });
    }

    function removeItem(id) {
      deleteItemFromDB(id)
        .then(function () {
          renderList();
          setStatus("Removed", "ok");
          setTimeout(function () { setStatus(""); }, 1500);
        })
        .catch(function () {
          setStatus("Could not remove", "error");
        });
    }

    // More reliable image pipeline for iOS camera photos
    function handleFile(file) {
      if (!file) {
        setStatus("No file received from camera/photos", "error");
        return;
      }

      setStatus("Got photo (“ + (file.name || "image") + ”, " + Math.round(file.size / 1024) + " KB)…");

      // Prefer object URL – more reliable on iOS than FileReader for camera shots
      var objectUrl = null;
      try {
        objectUrl = URL.createObjectURL(file);
      } catch (e) {
        console.error(e);
        setStatus("Could not open photo", "error");
        return;
      }

      var img = new Image();

      img.onload = function () {
        try {
          var maxSize = 720;
          var width = img.naturalWidth || img.width;
          var height = img.naturalHeight || img.height;

          if (!width || !height) {
            // Fallback: show original object URL as preview without compression
            showPreview(objectUrl);
            setStatus("Photo loaded (no resize)", "ok");
            return;
          }

          if (width > maxSize || height > maxSize) {
            if (width > height) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            } else {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
          }

          var canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          var dataUrl = canvas.toDataURL("image/jpeg", 0.75);
          URL.revokeObjectURL(objectUrl);
          showPreview(dataUrl);
        } catch (err) {
          console.error(err);
          // Last resort: use the object URL directly so user still sees something
          showPreview(objectUrl);
          setStatus("Loaded without compression", "ok");
        }
      };

      img.onerror = function () {
        // HEIC or unsupported format – try FileReader as backup
        setStatus("Trying alternate load method…");
        var reader = new FileReader();
        reader.onload = function (e) {
          showPreview(e.target.result);
        };
        reader.onerror = function () {
          setStatus("Could not load this photo format. Try From Photos or take again as JPEG.", "error");
          if (objectUrl) URL.revokeObjectURL(objectUrl);
        };
        reader.readAsDataURL(file);
      };

      img.src = objectUrl;
    }

    function onInputChange(input) {
      var file = input.files && input.files[0];
      setStatus(file ? "Photo selected, processing…" : "No photo selected");
      if (file) handleFile(file);
      // Reset so the same file can be chosen again
      try { input.value = ""; } catch (e) {}
    }

    cameraInput.addEventListener("change", function () {
      onInputChange(cameraInput);
    });

    galleryInput.addEventListener("change", function () {
      onInputChange(galleryInput);
    });

    // Extra safety: also listen for input event (some WebViews fire this)
    cameraInput.addEventListener("input", function () {
      if (cameraInput.files && cameraInput.files[0]) onInputChange(cameraInput);
    });

    galleryInput.addEventListener("input", function () {
      if (galleryInput.files && galleryInput.files[0]) onInputChange(galleryInput);
    });

    addBtn.addEventListener("click", addItem);
    cancelBtn.addEventListener("click", hidePreview);

    drinkName.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        addItem();
      }
    });

    openDB()
      .then(function () { renderList(); })
      .catch(function () {
        setStatus("Storage unavailable", "error");
      });
  </script>
</body>
</html>
