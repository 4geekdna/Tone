<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>My Bar v0.9</title>
  <style>
    :root {
      --bg: #0c0d12; --surface: #161822; --border: #2a2e42;
      --text: #f0f1f5; --text-muted: #9ca3af; --accent: #a78bfa;
      --accent-soft: rgba(167,139,250,0.15); --success: #34d399;
      --danger: #f87171; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100dvh;
      padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(167,139,250,0.16), transparent),
        radial-gradient(ellipse 40% 30% at 90% 90%, rgba(244,114,182,0.07), transparent);
    }
    .version-badge {
      position: fixed; top: max(8px, env(safe-area-inset-top)); right: 12px; z-index: 50;
      font-size: 11px; color: #6b7280; background: rgba(12,13,18,0.85);
      padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    }
    .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 18px; }
    .back { display: inline-flex; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 12px; }
    h1 {
      font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px;
      background: linear-gradient(135deg, #e0e7ff, #c4b5fd, #f9a8d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .subtitle { color: var(--text-muted); font-size: 14px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 20px;
    }
    .pick-btn {
      display: block; width: 100%; text-align: center;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff; font-size: 17px; font-weight: 700;
      padding: 18px 16px; border-radius: 14px; border: none;
      cursor: pointer; position: relative; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .pick-btn:active { opacity: 0.88; }
    .pick-btn input[type=file] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; font-size: 20px; cursor: pointer;
    }
    .status {
      margin-top: 14px; text-align: center; font-size: 13px;
      color: var(--text-muted); padding: 10px; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.03);
      line-height: 1.45;
    }
    .status.ok { color: var(--success); border-color: rgba(52,211,153,0.35); }
    .status.error { color: var(--danger); border-color: rgba(248,113,113,0.35); }
    .tip {
      margin-top: 10px; font-size: 12.5px; color: var(--text-muted);
      text-align: center; line-height: 1.45;
    }

    .preview {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .preview.active { display: block; }
    .preview img {
      width: 100%; max-height: 220px; object-fit: contain;
      border-radius: 12px; background: #0a0b10; margin-bottom: 16px;
    }

    /* Prominent name entry box */
    .name-box {
      background: rgba(167, 139, 250, 0.12);
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.12);
    }
    .name-box .lbl {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #e9d5ff;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }
    .name-box input[type=text] {
      width: 100%;
      background: #0c0d12;
      border: 2px solid #c4b5fd;
      border-radius: 12px;
      padding: 16px 14px;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      outline: none;
      margin-bottom: 0;
    }
    .name-box input[type=text]::placeholder {
      color: #7c6fa0;
      font-weight: 500;
    }
    .name-box input[type=text]:focus {
      border-color: #ddd6fe;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
    }

    label.lbl {
      display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
    }
    select {
      width: 100%; background: #0f111a; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; color: var(--text);
      font-size: 16px; outline: none; margin-bottom: 14px;
    }
    select:focus { border-color: var(--accent); }

    .btn-save {
      width: 100%; border: none; border-radius: 12px; padding: 18px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      background: var(--success); color: #0c0d12; margin-bottom: 8px;
    }
    .btn-cancel {
      width: 100%; border-radius: 12px; padding: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    }

    .section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .count {
      background: var(--accent-soft); color: var(--accent);
      font-size: 12px; padding: 2px 9px; border-radius: 999px;
    }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      display: flex; gap: 12px; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px;
    }
    .item img {
      width: 64px; height: 64px; border-radius: 10px;
      object-fit: cover; background: #0a0b10; flex-shrink: 0;
    }
    .item .info { flex: 1; min-width: 0; }
    .item .name {
      font-weight: 650; font-size: 15.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item .meta { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .del {
      width: 36px; height: 36px; border: none; border-radius: 10px;
      background: rgba(255,255,255,0.06); font-size: 16px; cursor: pointer;
      flex-shrink: 0;
    }
    .empty {
      text-align: center; padding: 36px 16px; color: var(--text-muted);
      font-size: 14.5px; background: var(--surface);
      border: 1px dashed var(--border); border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="version-badge">v0.9</div>

  <div class="container">
    <header>
      <a class="back" href="index.html">← Back to Index</a>
      <h1>My Bar</h1>
      <p class="subtitle">Photograph bottles • Build your drink collection</p>
    </header>

    <div class="card">
      <label class="pick-btn">
        📷 Add Photo
        <input type="file" id="photoInput" accept="image/*">
      </label>

      <div class="status" id="status">1) Add Photo &nbsp;→&nbsp; 2) Enter name &nbsp;→&nbsp; 3) Tap Save</div>
      <p class="tip">On iPhone: choose <strong>Photo Library</strong> or <strong>Take Photo</strong>.</p>

      <div class="preview" id="preview">
        <img id="previewImg" alt="Preview">

        <!-- Highly visible name field -->
        <div class="name-box">
          <label class="lbl" for="drinkName">✏️ Type the bottle name here</label>
          <input type="text" id="drinkName" placeholder="Example: Grey Goose Vodka" list="suggestions" autocomplete="off">
        </div>

        <datalist id="suggestions">
          <option value="Grey Goose Vodka">
          <option value="Belvedere Vodka">
          <option value="Macallan 12">
          <option value="Glenfiddich 12">
          <option value="Johnnie Walker Black">
          <option value="Jameson Irish Whiskey">
          <option value="Jack Daniel's">
          <option value="Maker's Mark">
          <option value="Hennessy VS">
          <option value="Patrón Silver">
          <option value="Don Julio Blanco">
          <option value="Casamigos Blanco">
          <option value="Tanqueray Gin">
          <option value="Bombay Sapphire">
          <option value="Hendrick's Gin">
          <option value="Campari">
          <option value="Aperol">
          <option value="Baileys Irish Cream">
          <option value="Champagne / Prosecco">
          <option value="Red Wine">
          <option value="White Wine">
          <option value="Beer">
        </datalist>

        <label class="lbl" for="drinkCategory">Category</label>
        <select id="drinkCategory">
          <option value="Vodka">Vodka</option>
          <option value="Whiskey / Whisky">Whiskey / Whisky</option>
          <option value="Gin">Gin</option>
          <option value="Rum">Rum</option>
          <option value="Tequila / Mezcal">Tequila / Mezcal</option>
          <option value="Brandy / Cognac">Brandy / Cognac</option>
          <option value="Liqueur">Liqueur</option>
          <option value="Wine">Wine</option>
          <option value="Champagne / Sparkling">Champagne / Sparkling</option>
          <option value="Beer">Beer</option>
          <option value="Other">Other</option>
        </select>

        <button class="btn-save" id="saveBtn" type="button">💾 Save to My Collection</button>
        <button class="btn-cancel" id="cancelBtn" type="button">Cancel</button>
      </div>
    </div>

    <div class="section-title">
      <span>My Collection</span>
      <span class="count" id="count">0</span>
    </div>
    <div class="list" id="list">
      <div class="empty" id="empty">🍾<br><br>No bottles yet.<br>Add a photo, enter a name, then tap Save.</div>
    </div>
  </div>

  <script>
    "use strict";

    var LS_KEY = "tone_bar_v9";
    var input = document.getElementById("photoInput");
    var statusEl = document.getElementById("status");
    var preview = document.getElementById("preview");
    var previewImg = document.getElementById("previewImg");
    var drinkName = document.getElementById("drinkName");
    var drinkCategory = document.getElementById("drinkCategory");
    var saveBtn = document.getElementById("saveBtn");
    var cancelBtn = document.getElementById("cancelBtn");
    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    var countEl = document.getElementById("count");

    var currentDataUrl = null;
    var lastKey = "";

    function setStatus(msg, type) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadItems() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return [];
        var arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(items));
        return true;
      } catch (e) {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(items.slice(-8)));
          return true;
        } catch (e2) {
          return false;
        }
      }
    }

    function render() {
      var items = loadItems();
      items.sort(function (a, b) {
        return (b.addedAt || "").localeCompare(a.addedAt || "");
      });

      countEl.textContent = String(items.length);
      list.querySelectorAll(".item").forEach(function (el) { el.remove(); });

      if (!items.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      items.forEach(function (it) {
        var el = document.createElement("div");
        el.className = "item";
        el.innerHTML =
          '<img src="' + it.image + '" alt="">' +
          '<div class="info">' +
            '<div class="name">' + esc(it.name) + '</div>' +
            '<div class="meta">' + esc(it.category) + '</div>' +
          '</div>' +
          '<button class="del" type="button" data-id="' + esc(it.id) + '">🗑️</button>';
        list.appendChild(el);
      });

      list.querySelectorAll(".del").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-id");
          saveItems(loadItems().filter(function (x) { return x.id !== id; }));
          render();
          setStatus("Removed", "ok");
        };
      });
    }

    function showPreview(dataUrl) {
      currentDataUrl = dataUrl;
      previewImg.src = dataUrl;
      preview.classList.add("active");
      drinkName.value = "";
      setStatus("Type the bottle name in the purple box, then tap Save", "ok");
      setTimeout(function () {
        drinkName.focus();
        preview.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 80);
    }

    function hidePreview() {
      currentDataUrl = null;
      preview.classList.remove("active");
      previewImg.removeAttribute("src");
      setStatus("1) Add Photo  →  2) Enter name  →  3) Tap Save");
    }

    function processFile(file) {
      if (!file) {
        setStatus("No file selected", "error");
        return;
      }

      var key = (file.name || "img") + "|" + file.size + "|" + (file.lastModified || Date.now());
      if (key === lastKey && currentDataUrl) return;
      lastKey = key;

      setStatus("Processing photo (" + Math.round(file.size / 1024) + " KB)…");

      var url;
      try { url = URL.createObjectURL(file); }
      catch (e) {
        setStatus("Could not open photo", "error");
        return;
      }

      var img = new Image();
      img.onload = function () {
        try {
          var max = 560;
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          var dataUrl = c.toDataURL("image/jpeg", 0.7);
          try { URL.revokeObjectURL(url); } catch (e) {}
          showPreview(dataUrl);
        } catch (e) {
          showPreview(url);
        }
      };
      img.onerror = function () {
        var reader = new FileReader();
        reader.onload = function (ev) { showPreview(ev.target.result); };
        reader.onerror = function () {
          setStatus("Could not read photo", "error");
          try { URL.revokeObjectURL(url); } catch (e) {}
        };
        reader.readAsDataURL(file);
      };
      img.src = url;
    }

    function onFiles() {
      var file = input.files && input.files[0];
      if (file) processFile(file);
    }

    input.addEventListener("change", onFiles);
    input.addEventListener("input", onFiles);

    function recheck() {
      if (input.files && input.files[0]) processFile(input.files[0]);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        setTimeout(recheck, 250);
        setTimeout(recheck, 900);
      }
    });
    window.addEventListener("focus", function () {
      setTimeout(recheck, 250);
    });

    saveBtn.addEventListener("click", function () {
      if (!currentDataUrl) {
        setStatus("No photo loaded yet", "error");
        return;
      }

      var name = (drinkName.value || "").trim();
      if (!name) {
        setStatus("Please type a bottle name in the purple box", "error");
        drinkName.focus();
        return;
      }

      var items = loadItems();
      items.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: name,
        category: drinkCategory.value || "Other",
        image: currentDataUrl,
        addedAt: new Date().toISOString()
      });

      if (!saveItems(items)) {
        setStatus("Storage full — delete some bottles first", "error");
        return;
      }

      hidePreview();
      render();
      setStatus('Saved “' + name + '” to My Collection', "ok");
      setTimeout(function () {
        list.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    });

    cancelBtn.addEventListener("click", hidePreview);

    drinkName.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        saveBtn.click();
      }
    });

    render();
  </script>
</body>
</html>
