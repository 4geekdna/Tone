<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Source Breath — Energy Flow</title>
<style>
  :root {
    --bg: #07060a;
    --surface: #111018;
    --gold: #e8c872;
    --gold-dim: #a88a4a;
    --base: #e85d4c;
    --center: #ff9a3c;
    --top: #ffd56b;
    --text: #f0ebe0;
    --muted: #8a8378;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 8px;
    z-index: 10;
  }
  header h1 {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
  }
  .status {
    font-size: 11px;
    color: var(--muted);
  }
  .canvas-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .cue {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  .breath-ring-wrap {
    position: absolute;
    bottom: 72px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 72px;
    pointer-events: none;
    z-index: 6;
  }
  .breath-ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .breath-ring circle {
    fill: none;
    stroke-width: 3.5;
    stroke-linecap: round;
  }
  .breath-ring .track {
    stroke: rgba(232, 200, 114, 0.18);
  }
  .breath-ring .progress {
    stroke: var(--gold);
    stroke-dasharray: 188.5;
    stroke-dashoffset: 188.5;
  }
  .cue .phase {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .cue .detail {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }
  .controls {
    background: linear-gradient(to top, #0a090e 70%, transparent);
    padding: 12px 16px 28px;
    z-index: 10;
  }
  .patterns {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    scrollbar-width: none;
  }
  .patterns::-webkit-scrollbar { display: none; }
  .pat {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid #2a2733;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pat.active {
    border-color: var(--gold);
    background: #1a1610;
    color: var(--gold);
  }
  .session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--gold);
  }
  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 30% 30%, #3a2f1a, #1a140c);
    color: var(--gold);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(232, 200, 114, 0.15);
  }
  .play-btn:active { transform: scale(0.96); }
  .points-legend {
    display: flex;
    justify-content: space-around;
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .points-legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.base { background: var(--base); }
  .dot.center { background: var(--center); }
  .dot.top { background: var(--top); }
  .timing, .voice-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 12px;
    font-size: 12px;
  }
  .timing label, .voice-panel {
    color: var(--muted);
  }
  .timing input, .voice-panel input {
    width: 52px;
    background: #1a1610;
    border: 1px solid #2a2733;
    color: var(--gold);
    border-radius: 8px;
    padding: 6px 4px;
    font-size: 13px;
    text-align: center;
  }
  .voice-panel input { width: 140px; }
  .timing button, .voice-panel button {
    background: var(--surface);
    border: 1px solid #2a2733;
    color: var(--text);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .timing button:active, .voice-panel button:active { opacity: 0.8; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Source Breath</h1>
    <div class="status" id="status">Ready</div>
  </header>
  <div class="canvas-wrap">
    <canvas id="flow"></canvas>
    <div class="breath-ring-wrap">
      <svg class="breath-ring" viewBox="0 0 72 72">
        <circle class="track" cx="36" cy="36" r="30" />
        <circle class="progress" id="breathProgress" cx="36" cy="36" r="30" />
      </svg>
    </div>
    <div class="cue">
      <div class="phase" id="phase">Breathe</div>
      <div class="detail" id="detail">Choose a pattern and begin</div>
    </div>
  </div>
  <div class="controls">
    <div class="patterns" id="patterns"></div>
    <div class="session-bar">
      <div class="timer" id="timer">00:00</div>
      <button class="play-btn" id="playBtn">▶</button>
      <div style="width:56px"></div>
    </div>
    <div class="points-legend">
      <span><span class="dot base"></span> Base</span>
      <span><span class="dot center"></span> Center</span>
      <span><span class="dot top"></span> Top</span>
    </div>
    <div class="timing">
      <label>Inhale <input type="number" id="inhaleSec" value="5" min="0.5" step="0.5"></label>
      <label>Hold <input type="number" id="holdSec" value="2" min="0" step="0.5"></label>
      <label>Exhale <input type="number" id="exhaleSec" value="7" min="0.5" step="0.5"></label>
      <button id="applyTiming">Apply timing</button>
    </div>
    <div class="voice-panel">
      <input type="password" id="elKey" placeholder="ElevenLabs key (optional)">
      <button id="speakBase">Base</button>
      <button id="speakCenter">Center</button>
      <button id="speakTop">Top</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('flow');
const ctx = canvas.getContext('2d');
const phaseEl = document.getElementById('phase');
const detailEl = document.getElementById('detail');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const playBtn = document.getElementById('playBtn');
const patternsEl = document.getElementById('patterns');
const breathProgress = document.getElementById('breathProgress');

const PATTERNS = {
  slow: {
    name: 'Slow Deep',
    phases: [
      { name: 'Inhale', duration: 5, cue: 'Belly fills · energy rises through Source', engage: 'soft' },
      { name: 'Exhale', duration: 7, cue: 'Release fully · soften Base & Center', engage: 'release' },
      { name: 'Pause', duration: 2, cue: 'Rest · feel the glow', engage: 'none' }
    ]
  },
  rhythmic: {
    name: 'Rhythmic Belly',
    phases: [
      { name: 'Inhale', duration: 1.2, cue: 'Quick rise · light Center pulse', engage: 'pulse' },
      { name: 'Exhale', duration: 1.2, cue: 'Fall · keep Base soft', engage: 'pulse' }
    ]
  },
  rapid: {
    name: 'Rapid Peak',
    phases: [
      { name: 'Inhale', duration: 0.4, cue: 'Shallow · Top light', engage: 'light' },
      { name: 'Exhale', duration: 0.4, cue: 'Quick · stay open', engage: 'light' }
    ]
  },
  box: {
    name: 'Box Reset',
    phases: [
      { name: 'Inhale', duration: 4, cue: 'Steady · no force', engage: 'none' },
      { name: 'Hold', duration: 4, cue: 'Still · notice Source', engage: 'none' },
      { name: 'Exhale', duration: 4, cue: 'Release · all three soft', engage: 'none' },
      { name: 'Hold', duration: 4, cue: 'Empty · quiet', engage: 'none' }
    ]
  },
  relax: {
    name: 'Relaxation',
    phases: [
      { name: 'Inhale', duration: 4, cue: 'Nose · deep into belly', engage: 'none' },
      { name: 'Hold', duration: 2, cue: 'Brief · feel the points', engage: 'none' },
      { name: 'Exhale', duration: 6, cue: 'Mouth · let Base, Center, Top melt', engage: 'release' }
    ]
  }
};

let currentPattern = 'slow';
let running = false;
let startTime = 0;
let phaseIndex = 0;
let phaseStart = 0;
let particles = [];
let animationId;
let audioCtx = null;
let lastCuedPhase = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playCue(phaseName, duration) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  gain.gain.setValueAtTime(0, now);

  const cover = Math.max(duration, 0.4);
  if (phaseName === 'Inhale') {
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.linearRampToValueAtTime(340, now + cover);
    gain.gain.linearRampToValueAtTime(0.065, now + 0.08);
    gain.gain.setValueAtTime(0.065, now + cover - 0.25);
    gain.gain.linearRampToValueAtTime(0, now + cover);
  } else if (phaseName === 'Exhale') {
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.linearRampToValueAtTime(120, now + cover);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.08);
    gain.gain.setValueAtTime(0.06, now + cover - 0.3);
    gain.gain.linearRampToValueAtTime(0, now + cover);
  } else {
    // Hold / Pause — quiet sustained tone covering the phase
    osc.frequency.setValueAtTime(190, now);
    gain.gain.linearRampToValueAtTime(0.028, now + 0.06);
    gain.gain.setValueAtTime(0.028, now + cover - 0.15);
    gain.gain.linearRampToValueAtTime(0, now + cover);
  }
  osc.start(now);
  osc.stop(now + cover);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function getPoints() {
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  const cx = w / 2;
  const cy = h * 0.48;
  return {
    top:    { x: cx, y: cy - 90, r: 18, color: '#ffd56b' },
    center: { x: cx, y: cy,      r: 22, color: '#ff9a3c' },
    base:   { x: cx, y: cy + 90, r: 20, color: '#e85d4c' }
  };
}

function spawnParticles() {
  const pts = getPoints();
  const breath = getBreathIntensity(performance.now());
  const count = Math.floor(1 + breath * 4);
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    let from, to;
    if (r < 0.4) { from = pts.base; to = pts.center; }
    else if (r < 0.75) { from = pts.center; to = pts.top; }
    else { from = pts.base; to = pts.top; }
    particles.push({
      x: from.x + (Math.random()-0.5)*30,
      y: from.y + (Math.random()-0.5)*20,
      tx: to.x + (Math.random()-0.5)*16,
      ty: to.y + (Math.random()-0.5)*16,
      life: 1,
      speed: 0.003 + Math.random()*0.005 + breath*0.004,
      size: 1 + Math.random()*2.2,
      color: from.color
    });
  }
}

function drawBody(w, h) {
  const cx = w / 2;
  const cy = h * 0.48;
  ctx.save();
  ctx.strokeStyle = 'rgba(232, 200, 114, 0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - 70, cy - 140);
  ctx.quadraticCurveTo(cx - 90, cy - 40, cx - 60, cy + 40);
  ctx.quadraticCurveTo(cx - 40, cy + 130, cx, cy + 150);
  ctx.quadraticCurveTo(cx + 40, cy + 130, cx + 60, cy + 40);
  ctx.quadraticCurveTo(cx + 90, cy - 40, cx + 70, cy - 140);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);

  const g = ctx.createRadialGradient(w/2, h*0.48, 20, w/2, h*0.48, 220);
  g.addColorStop(0, 'rgba(232, 200, 114, 0.06)');
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  drawBody(w, h);

  const pts = getPoints();
  const now = performance.now();
  const breathPhase = getBreathIntensity(now);

  ctx.strokeStyle = 'rgba(232, 200, 114, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pts.base.x, pts.base.y);
  ctx.lineTo(pts.center.x, pts.center.y);
  ctx.lineTo(pts.top.x, pts.top.y);
  ctx.stroke();

  if (running && Math.random() < 0.4 + breathPhase * 0.4) spawnParticles();
  particles = particles.filter(p => {
    p.life -= p.speed;
    p.x += (p.tx - p.x) * 0.02;
    p.y += (p.ty - p.y) * 0.02;
    if (p.life <= 0) return false;
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    return true;
  });
  ctx.globalAlpha = 1;

  Object.entries(pts).forEach(([key, p]) => {
    const pulse = 1 + breathPhase * 0.25;
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3 * pulse);
    glow.addColorStop(0, p.color + '88');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 3 * pulse, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * pulse * 0.55, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  animationId = requestAnimationFrame(draw);
}

function getBreathIntensity(now) {
  if (!running) return 0.3;
  const pat = PATTERNS[currentPattern];
  if (!pat || !pat.phases[phaseIndex]) return 0.5;
  const elapsed = (now - phaseStart) / 1000;
  const dur = pat.phases[phaseIndex].duration;
  const t = Math.min(elapsed / dur, 1);
  const name = pat.phases[phaseIndex].name;
  if (name === 'Inhale') return t;
  if (name === 'Exhale') return 1 - t;
  return 0.5;
}

function updatePhase(now) {
  if (!running) return;
  const pat = PATTERNS[currentPattern];
  if (!pat) return;
  const elapsed = (now - phaseStart) / 1000;
  if (elapsed >= pat.phases[phaseIndex].duration) {
    phaseIndex = (phaseIndex + 1) % pat.phases.length;
    phaseStart = now;
    lastCuedPhase = null;
  }
  const ph = pat.phases[phaseIndex];
  if (lastCuedPhase !== ph.name) {
    playCue(ph.name, ph.duration);
    lastCuedPhase = ph.name;
  }
  phaseEl.textContent = ph.name;
  detailEl.textContent = ph.cue;

  const t = Math.min(elapsed / ph.duration, 1);
  if (breathProgress) {
    const circumference = 2 * Math.PI * 30;
    const offset = circumference * (1 - t);
    breathProgress.style.strokeDasharray = circumference;
    breathProgress.style.strokeDashoffset = offset;
    if (ph.name === 'Inhale') breathProgress.style.stroke = '#e8c872';
    else if (ph.name === 'Exhale') breathProgress.style.stroke = '#ff9a3c';
    else breathProgress.style.stroke = '#a88a4a';
  }

  const total = (now - startTime) / 1000;
  const m = Math.floor(total / 60).toString().padStart(2,'0');
  const s = Math.floor(total % 60).toString().padStart(2,'0');
  timerEl.textContent = `${m}:${s}`;
}

function loop(now) {
  updatePhase(now);
  requestAnimationFrame(loop);
}

const inhaleInput = document.getElementById('inhaleSec');
const holdInput = document.getElementById('holdSec');
const exhaleInput = document.getElementById('exhaleSec');
const elKeyInput = document.getElementById('elKey');

function loadSavedKey() {
  const saved = localStorage.getItem('sourceElKey');
  if (saved) elKeyInput.value = saved;
}
loadSavedKey();

function applyTimings() {
  const inh = Math.max(0.5, parseFloat(inhaleInput.value) || 5);
  const hld = Math.max(0, parseFloat(holdInput.value) || 0);
  const exh = Math.max(0.5, parseFloat(exhaleInput.value) || 7);
  const phases = [
    { name: 'Inhale', duration: inh, cue: 'Inhale · energy rises through Source' }
  ];
  if (hld > 0) {
    phases.push({ name: 'Hold', duration: hld, cue: 'Hold · notice the Source' });
  }
  phases.push({ name: 'Exhale', duration: exh, cue: 'Exhale · soften Base, Center & Top' });
  PATTERNS[currentPattern].phases = phases;
  statusEl.textContent = 'Timing applied';
  if (running) {
    phaseIndex = 0;
    phaseStart = performance.now();
    lastCuedPhase = null;
  }
}

document.getElementById('applyTiming').onclick = applyTimings;

async function speakPoint(text) {
  const key = elKeyInput.value.trim();
  if (!key) {
    statusEl.textContent = 'Add ElevenLabs key';
    return;
  }
  localStorage.setItem('sourceElKey', key);
  try {
    statusEl.textContent = 'Speaking…';
    const resp = await fetch('https://api.elevenlabs.io/v1/text-to-speech/EXAVITQu4vr4xnSDxMaL', {
      method: 'POST',
      headers: {
        'Accept': 'audio/mpeg',
        'Content-Type': 'application/json',
        'xi-api-key': key
      },
      body: JSON.stringify({
        text: text,
        model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.55, similarity_boost: 0.75, style: 0.15 }
      })
    });
    if (!resp.ok) throw new Error('Voice API error');
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    a.onended = () => URL.revokeObjectURL(url);
    await a.play();
    statusEl.textContent = 'Voice ready';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Voice failed';
  }
}

document.getElementById('speakBase').onclick = () => speakPoint('Base');
document.getElementById('speakCenter').onclick = () => speakPoint('Center');
document.getElementById('speakTop').onclick = () => speakPoint('Top');

function buildPatterns() {
  patternsEl.innerHTML = '';
  Object.entries(PATTERNS).forEach(([key, p]) => {
    const el = document.createElement('div');
    el.className = 'pat' + (key === currentPattern ? ' active' : '');
    el.textContent = p.name;
    el.onclick = () => {
      currentPattern = key;
      document.querySelectorAll('.pat').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      if (running) {
        phaseIndex = 0;
        phaseStart = performance.now();
        lastCuedPhase = null;
        updatePhase(performance.now());
      }
      statusEl.textContent = p.name;
    };
    patternsEl.appendChild(el);
  });
}

playBtn.onclick = () => {
  unlockAudio();
  running = !running;
  playBtn.textContent = running ? '⏸' : '▶';
  if (running) {
    const now = performance.now();
    startTime = now;
    phaseStart = now;
    phaseIndex = 0;
    lastCuedPhase = null;
    statusEl.textContent = 'In session';
    updatePhase(now);
  } else {
    statusEl.textContent = 'Paused';
    phaseEl.textContent = 'Paused';
    detailEl.textContent = 'Tap play to resume';
    if (breathProgress) breathProgress.style.strokeDashoffset = 188.5;
  }
};

buildPatterns();
draw();
loop(performance.now());
</script>
</body>
</html>
