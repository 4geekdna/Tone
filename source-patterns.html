<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Source Breath — Pattern Library</title>
<style>
  :root {
    --bg: #07060a;
    --surface: #111018;
    --gold: #e8c872;
    --gold-dim: #a88a4a;
    --text: #f0ebe0;
    --muted: #8a8378;
    --base: #e85d4c;
    --center: #ff9a3c;
    --top: #ffd56b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100dvh;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
  }
  header {
    padding: 18px 20px 6px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .library {
    padding: 8px 0 12px;
  }
  .lib-label {
    padding: 0 20px 8px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .cards {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 20px 6px;
    scrollbar-width: none;
  }
  .cards::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 148px;
    background: var(--surface);
    border: 1px solid #2a2733;
    border-radius: 16px;
    padding: 14px 12px 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .card.active {
    border-color: var(--gold);
    background: #1a1610;
  }
  .card-vis {
    height: 36px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card h3 {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .card .meta {
    font-size: 10px;
    color: var(--muted);
  }
  .live {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
    padding: 10px 20px 0;
  }
  .live-label {
    position: absolute;
    top: 8px;
    left: 20px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-label::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }
  .orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orb {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff6d0, #e8c872 40%, #a88a4a 70%, #3a2a10);
    box-shadow: 0 0 60px rgba(232, 200, 114, 0.25);
    transition: transform 0.4s ease;
  }
  .ring {
    position: absolute;
    border: 1px solid rgba(232, 200, 114, 0.25);
    border-radius: 50%;
  }
  .ring1 { width: 180px; height: 180px; }
  .ring2 { width: 210px; height: 210px; border-style: dashed; opacity: 0.5; }
  .cue-block {
    text-align: center;
    margin-top: 18px;
  }
  .cue-phase {
    font-size: 18px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .cue-text {
    font-size: 14px;
    color: var(--muted);
  }
  .stats {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-top: 22px;
    padding: 0 8px;
  }
  .stat {
    flex: 1;
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat .label {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat .value {
    font-size: 18px;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .actions {
    display: flex;
    gap: 10px;
    width: 100%;
    padding: 16px 20px 28px;
  }
  .btn {
    flex: 1;
    height: 48px;
    border-radius: 14px;
    border: 1px solid #2a2733;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .btn.primary {
    background: #1a1610;
    border-color: var(--gold);
    color: var(--gold);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Breath Patterns</h1>
    <p>Choose a pattern and breathe with intention</p>
  </header>

  <div class="library">
    <div class="lib-label">Select a pattern</div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="live">
    <div class="live-label">Live Session</div>
    <div class="orb-wrap">
      <div class="ring ring2"></div>
      <div class="ring ring1"></div>
      <div class="orb" id="orb"></div>
    </div>
    <div class="cue-block">
      <div class="cue-phase" id="phase">Ready</div>
      <div class="cue-text" id="cue">Select a pattern to begin</div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="label">Session</div>
        <div class="value" id="timer">00:00</div>
      </div>
      <div class="stat">
        <div class="label">Breaths</div>
        <div class="value" id="breaths">0</div>
      </div>
      <div class="stat">
        <div class="label">Focus</div>
        <div class="value" id="focus">—</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="pauseBtn">Start</button>
    <button class="btn primary" id="endBtn">End Session</button>
  </div>
</div>

<script>
const PATTERNS = {
  slow: {
    name: 'Slow Deep',
    meta: '4–6s in · 6–8s out',
    focus: 'Spread',
    phases: [
      { name: 'Inhale', dur: 5, cue: 'Fill the belly · energy rises' },
      { name: 'Exhale', dur: 7, cue: 'Empty fully · soften Base & Center' },
      { name: 'Pause', dur: 2, cue: 'Natural rest · feel the glow' }
    ]
  },
  rhythmic: {
    name: 'Rhythmic Belly',
    meta: '~2 breaths / sec',
    focus: 'Build',
    phases: [
      { name: 'Inhale', dur: 1.1, cue: 'Quick belly rise · light Center' },
      { name: 'Exhale', dur: 1.1, cue: 'Belly falls · keep Base soft' }
    ]
  },
  rapid: {
    name: 'Rapid Peak',
    meta: '15–30s max',
    focus: 'Peak',
    phases: [
      { name: 'Inhale', dur: 0.35, cue: 'Shallow · Top light' },
      { name: 'Exhale', dur: 0.35, cue: 'Quick · stay open' }
    ]
  },
  box: {
    name: 'Box Reset',
    meta: '4-4-4-4',
    focus: 'Reset',
    phases: [
      { name: 'Inhale', dur: 4, cue: 'Steady · no force' },
      { name: 'Hold', dur: 4, cue: 'Still · notice Source' },
      { name: 'Exhale', dur: 4, cue: 'Release · all three soft' },
      { name: 'Hold', dur: 4, cue: 'Empty · quiet' }
    ]
  },
  fusion: {
    name: 'Relaxation Fusion',
    meta: 'Smooth & flowing',
    focus: 'Release',
    phases: [
      { name: 'Inhale', dur: 4, cue: 'Nose · deep into belly' },
      { name: 'Hold', dur: 2, cue: 'Brief · feel the points' },
      { name: 'Exhale', dur: 6, cue: 'Mouth · let Base, Center, Top melt' }
    ]
  }
};

let current = 'slow';
let running = false;
let startTime = 0;
let phaseIndex = 0;
let phaseStart = 0;
let breathCount = 0;
let animId;
let audioCtx = null;
let lastCuedPhase = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playCue(phaseName, duration) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.07, now + 0.04);

  let stopAt = now + 0.25;
  if (phaseName === 'Inhale') {
    osc.frequency.setValueAtTime(170, now);
    osc.frequency.linearRampToValueAtTime(310, now + Math.min(duration * 0.9, 2.2));
    gain.gain.linearRampToValueAtTime(0, now + Math.min(duration * 0.9, 2.2));
    stopAt = now + Math.min(duration * 0.9, 2.2);
  } else if (phaseName === 'Exhale') {
    osc.frequency.setValueAtTime(290, now);
    osc.frequency.linearRampToValueAtTime(130, now + Math.min(duration * 0.85, 2.8));
    gain.gain.linearRampToValueAtTime(0, now + Math.min(duration * 0.85, 2.8));
    stopAt = now + Math.min(duration * 0.85, 2.8);
  } else {
    osc.frequency.setValueAtTime(210, now);
    gain.gain.linearRampToValueAtTime(0.035, now + 0.04);
    gain.gain.linearRampToValueAtTime(0, now + 0.22);
    stopAt = now + 0.22;
  }
  osc.start(now);
  osc.stop(stopAt);
}

const cardsEl = document.getElementById('cards');
const phaseEl = document.getElementById('phase');
const cueEl = document.getElementById('cue');
const timerEl = document.getElementById('timer');
const breathsEl = document.getElementById('breaths');
const focusEl = document.getElementById('focus');
const orb = document.getElementById('orb');
const pauseBtn = document.getElementById('pauseBtn');
const endBtn = document.getElementById('endBtn');

function buildCards() {
  cardsEl.innerHTML = '';
  Object.entries(PATTERNS).forEach(([key, p]) => {
    const card = document.createElement('div');
    card.className = 'card' + (key === current ? ' active' : '');
    card.innerHTML = `
      <div class="card-vis">${miniVis(key)}</div>
      <h3>${p.name}</h3>
      <div class="meta">${p.meta}</div>
    `;
    card.onclick = () => selectPattern(key);
    cardsEl.appendChild(card);
  });
}

function miniVis(key) {
  if (key === 'slow') return '<div style="width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff6d0,#a88a4a);opacity:0.8"></div>';
  if (key === 'rhythmic') return '<div style="display:flex;gap:3px;align-items:flex-end;height:20px"><div style="width:3px;height:8px;background:#e8c872;border-radius:1px"></div><div style="width:3px;height:14px;background:#e8c872;border-radius:1px"></div><div style="width:3px;height:10px;background:#e8c872;border-radius:1px"></div><div style="width:3px;height:16px;background:#e8c872;border-radius:1px"></div></div>';
  if (key === 'rapid') return '<div style="font-size:18px;letter-spacing:-1px;color:#e8c872">⋀⋀⋀</div>';
  if (key === 'box') return '<div style="width:22px;height:22px;border:1.5px solid #e8c872;border-radius:3px"></div>';
  return '<div style="width:26px;height:8px;background:linear-gradient(90deg,#e85d4c,#ff9a3c,#ffd56b);border-radius:4px;opacity:0.7"></div>';
}

function selectPattern(key) {
  current = key;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
  focusEl.textContent = PATTERNS[key].focus;
  if (running) {
    phaseIndex = 0;
    phaseStart = performance.now();
    lastCuedPhase = null;
  }
}

function update(now) {
  if (!running) {
    orb.style.transform = 'scale(1)';
    animId = requestAnimationFrame(update);
    return;
  }
  const pat = PATTERNS[current];
  if (!pat) {
    animId = requestAnimationFrame(update);
    return;
  }
  const elapsed = (now - phaseStart) / 1000;
  if (elapsed >= pat.phases[phaseIndex].dur) {
    phaseIndex = (phaseIndex + 1) % pat.phases.length;
    phaseStart = now;
    if (pat.phases[phaseIndex].name === 'Inhale') breathCount++;
    breathsEl.textContent = breathCount;
    lastCuedPhase = null;
  }
  const ph = pat.phases[phaseIndex];
  if (lastCuedPhase !== ph.name) {
    playCue(ph.name, ph.dur);
    lastCuedPhase = ph.name;
  }
  phaseEl.textContent = ph.name;
  cueEl.textContent = ph.cue;

  const t = Math.min(elapsed / ph.dur, 1);
  let scale = 1;
  if (ph.name === 'Inhale') scale = 0.85 + t * 0.3;
  else if (ph.name === 'Exhale') scale = 1.15 - t * 0.3;
  else scale = 1.05;
  orb.style.transform = `scale(${scale})`;

  const total = (now - startTime) / 1000;
  const m = Math.floor(total / 60).toString().padStart(2, '0');
  const s = Math.floor(total % 60).toString().padStart(2, '0');
  timerEl.textContent = `${m}:${s}`;

  animId = requestAnimationFrame(update);
}

pauseBtn.onclick = () => {
  unlockAudio();
  running = !running;
  if (running) {
    pauseBtn.textContent = 'Pause';
    const now = performance.now();
    if (startTime === 0) startTime = now;
    phaseStart = now;
    lastCuedPhase = null;
    update(now);
  } else {
    pauseBtn.textContent = 'Resume';
  }
};

endBtn.onclick = () => {
  running = false;
  startTime = 0;
  phaseIndex = 0;
  breathCount = 0;
  lastCuedPhase = null;
  phaseEl.textContent = 'Ready';
  cueEl.textContent = 'Select a pattern to begin';
  timerEl.textContent = '00:00';
  breathsEl.textContent = '0';
  pauseBtn.textContent = 'Start';
  orb.style.transform = 'scale(1)';
};

buildCards();
focusEl.textContent = PATTERNS[current].focus;
requestAnimationFrame(update);
</script>
</body>
</html>
